<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智选情报官</title>
  <script src="/static/vendor/vue.global.prod.js"></script>
  <style>
    :root {
      /* 浅绿 70% / 白 20% / 黄 10% 色系（明亮工作台风格） */
      --bg0: #eef7ef; --bg1: #e2f0e4;
      --panel: rgba(255, 255, 255, .82); --panel-solid: #ffffff;
      --panel2: rgba(240, 248, 241, .9); --line: rgba(84, 170, 105, .28);
      --accent: #54aa69; --accent2: #7cc089;
      --text: #1d3a24; --muted: #5d7a64;
      --net: #3f9e5c; --db: #67b26f; --kb: #f5c542; --warn: #e0653f;
      --shadow: 0 8px 26px rgba(45, 110, 60, .12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      color: var(--text); height: 100vh; overflow: hidden;
      background:
        radial-gradient(1100px 500px at 85% -10%, rgba(245,197,66,.22), transparent 60%),
        radial-gradient(900px 480px at -10% 110%, rgba(84,170,105,.16), transparent 60%),
        linear-gradient(160deg, var(--bg1), var(--bg0));
      background-attachment: fixed;
    }
    /* 用户自定义背景图（任务4）：默认无，导入后覆盖在渐变之上，透明度可调 */
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1;
      background-image: var(--user-bg, none);
      background-size: cover; background-position: center; background-repeat: no-repeat;
      opacity: var(--bg-opacity, .6); pointer-events: none;
      transition: opacity .3s;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.25); border-radius: 8px; }

    /* ================= 登录页 ================= */
    .login-wrap { height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    .login-card {
      position: relative; width: 380px; padding: 40px 42px 34px;
      background: var(--panel); backdrop-filter: blur(14px);
      border: 1px solid var(--line); border-radius: 22px;
      box-shadow: 0 24px 70px rgba(0,0,0,.5);
    }
    .login-card h1 {
      margin: 0 0 6px; font-size: 26px; letter-spacing: 1px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .login-card .sub { color: var(--muted); font-size: 13px; margin-bottom: 26px; line-height: 1.6; }
    .field { margin-bottom: 18px; }
    .field > label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 8px; letter-spacing: 1px; }
    .input-container { position: relative; }
    .input {
      width: 100%; padding: 10px 12px; height: 44px;
      border: 2px solid rgba(84,170,105,.55); border-top: none; border-bottom: none;
      font-size: 14px; font-family: inherit; background: rgba(255,255,255,.75); color: var(--text);
      outline: none; box-shadow: 7px 7px 0 0 rgba(84,170,105,.25); transition: box-shadow .5s, border-color .5s;
    }
    .input:focus { box-shadow: none; border-color: var(--accent); }
    .input-container .topline, .input-container .underline {
      position: absolute; right: 0; width: 0%; height: 2px; background: var(--accent); transition: width .5s;
    }
    .input-container .topline { top: 0; } .input-container .underline { bottom: 0; }
    .input-container .input:focus ~ .topline { width: 35%; }
    .input-container .input:focus ~ .underline { width: 100%; }
    .role-pick { display: flex; gap: 10px; }
    .role-pick label {
      flex: 1; text-align: center; padding: 10px 0; border-radius: 10px; cursor: pointer;
      border: 1px solid rgba(84,170,105,.35); color: var(--muted);
      transition: all .25s; background: rgba(255,255,255,.6);
    }
    .role-pick input { display: none; }
    .role-pick label:hover { border-color: var(--line); color: var(--text); }
    .role-pick input:checked + span { color: #14381f; font-weight: 700; }
    .role-pick label:has(input:checked) {
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-color: transparent; transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(56,189,248,.35);
    }
    .bubbles {
      --c1: #1d3a24; --c2: #54aa69; --size-letter: 15px;
      padding: .7em 1em; font-size: var(--size-letter); font-family: inherit;
      background-color: transparent; border: calc(var(--size-letter) / 6) solid var(--c2);
      border-radius: .35em; cursor: pointer; overflow: hidden; position: relative;
      transition: 300ms cubic-bezier(.83, 0, .17, 1);
    }
    .bubbles.full { width: 100%; }
    .bubbles > .text { font-weight: 700; color: var(--c2); position: relative; z-index: 1; transition: color 700ms cubic-bezier(.83,0,.17,1); }
    .bubbles::before { top: 0; left: 0; } .bubbles::after { top: 100%; left: 100%; }
    .bubbles::before, .bubbles::after {
      content: ""; width: 150%; aspect-ratio: 1/1; scale: 0;
      transition: 1000ms cubic-bezier(.76, 0, .24, 1);
      background-color: var(--c2); border-radius: 50%;
      position: absolute; translate: -50% -50%;
    }
    .bubbles:hover > .text { color: var(--c1); }
    .bubbles:hover::before, .bubbles:hover::after { scale: 1; }
    .bubbles:active { scale: .98; filter: brightness(.9); }
    .bubbles:disabled { opacity: .55; cursor: not-allowed; filter: grayscale(.4); }
    .err { color: var(--warn); font-size: 13px; margin-top: 12px; min-height: 18px; }

    /* ================= 应用框架 ================= */
    #app-view { height: 100vh; display: flex; flex-direction: column; }
    .topbar {
      height: 54px; display: flex; align-items: center; gap: 14px; padding: 0 22px;
      background: rgba(15,23,42,.78); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .logo {
      font-weight: 800; font-size: 16px; letter-spacing: 1px; cursor: pointer;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .mode { background: rgba(84,170,105,.18); border: 1px solid rgba(56,189,248,.25);
            padding: 4px 12px; border-radius: 999px; font-size: 12px; color: var(--accent); }
    .nav-tabs { display: flex; gap: 4px; margin-left: 10px; }
    .nav-tab {
      padding: 7px 18px; border-radius: 9px; cursor: pointer; font-size: 13.5px; color: var(--muted);
      transition: all .2s; text-decoration: none;
    }
    .nav-tab:hover { color: var(--text); background: rgba(84,170,105,.14); }
    .nav-tab.active {
      color: #14381f; font-weight: 700;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      box-shadow: 0 4px 14px rgba(56,189,248,.3);
    }
    .spacer { flex: 1; }
    .who { font-size: 13px; color: var(--muted); }
    .link { color: var(--muted); font-size: 13px; cursor: pointer; padding: 6px 12px; border-radius: 8px; transition: all .2s; }
    .link:hover { color: var(--accent); background: rgba(84,170,105,.14); }

    /* ================= 视图容器 ================= */
    .view { flex: 1; overflow-y: auto; }

    /* ---- 工作台 ---- */
    .home { max-width: 1080px; margin: 0 auto; padding: 30px 26px 50px; }
    .hero {
      background: linear-gradient(120deg, rgba(84,170,105,.18), rgba(245,197,66,.14));
      border: 1px solid var(--line); border-radius: 20px; padding: 28px 32px; margin-bottom: 26px;
      display: flex; align-items: center; gap: 20px;
      position: relative; overflow: hidden;
    }
    .hero::after {
      content: ""; position: absolute; width: 220px; height: 220px; right: -60px; top: -90px;
      background: radial-gradient(circle, rgba(245,197,66,.35), transparent 65%);
      pointer-events: none;
    }
    .hero .emoji { font-size: 44px; }
    .hero h2 { margin: 0 0 6px; font-size: 21px; }
    .hero p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.7; }
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 26px; }
    .stat-card {
      background: linear-gradient(160deg, rgba(255,255,255,.95), rgba(240,248,241,.85));
      border: 1px solid rgba(84,170,105,.3); border-radius: 16px;
      padding: 18px; box-shadow: var(--shadow);
      position: relative; overflow: hidden;
      transition: transform .35s cubic-bezier(.83,0,.17,1), box-shadow .35s;
    }
    .stat-card::before {
      content: ""; position: absolute; width: 90px; height: 90px; left: -30px; top: -30px;
      background: radial-gradient(circle, rgba(84,170,105,.25), transparent 70%);
      transition: transform .5s;
    }
    .stat-card:hover { transform: translateY(-5px) rotate(-.6deg); box-shadow: 0 16px 36px rgba(45,110,60,.18); }
    .stat-card:hover::before { transform: scale(1.6); }
    .stat-card .num { font-size: 30px; font-weight: 800; line-height: 1.1; }
    .stat-card.c1 { border-top: 3px solid var(--accent); } .stat-card.c1 .num { color: var(--accent); }
    .stat-card.c2 { border-top: 3px solid var(--accent2); } .stat-card.c2 .num { color: var(--accent2); }
    .stat-card.c3 { border-top: 3px solid var(--net); } .stat-card.c3 .num { color: var(--net); }
    .stat-card.c4 { border-top: 3px solid var(--kb); } .stat-card.c4 .num { color: var(--kb); }
    .stat-card .lbl { font-size: 12.5px; color: var(--muted); margin-top: 5px; }
    .section-title { font-size: 15px; font-weight: 700; margin: 26px 0 14px; display: flex; align-items: center; gap: 10px; }
    .section-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }

    /* 快捷入口大卡片（蜀道 quick-card 风格：气泡填充 hover） */
    .quick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .quick-card {
      --qc-fill: var(--qc-c, var(--accent));
      display: flex; align-items: center; gap: 16px; padding: 20px 18px;
      background: linear-gradient(150deg, rgba(255,255,255,.96), rgba(240,248,241,.88));
      border: 1px solid rgba(84,170,105,.3); border-radius: 16px;
      cursor: pointer; text-decoration: none; color: var(--text);
      position: relative; overflow: hidden; isolation: isolate;
      transition: transform .3s cubic-bezier(.83,0,.17,1), box-shadow .3s, border-color .3s;
      box-shadow: var(--shadow);
    }
    .quick-card::before, .quick-card::after {
      content: ""; width: 150%; aspect-ratio: 1/1; scale: 0;
      background: var(--qc-fill); border-radius: 50%;
      position: absolute; z-index: -1;
      transition: scale 900ms cubic-bezier(.76, 0, .24, 1);
    }
    .quick-card::before { top: 0; left: 0; translate: -50% -50%; }
    .quick-card::after { bottom: 0; right: 0; translate: 50% 50%; }
    .quick-card:hover { transform: translateY(-4px); border-color: transparent; box-shadow: 0 14px 34px rgba(0,0,0,.45); }
    .quick-card:hover::before, .quick-card:hover::after { scale: 1; }
    .quick-card .qc-icon { font-size: 34px; flex-shrink: 0; transition: transform .3s; }
    .quick-card:hover .qc-icon { transform: scale(1.18) rotate(-6deg); }
    .quick-card .qc-name { font-weight: 700; font-size: 15.5px; transition: color .4s; }
    .quick-card:hover .qc-name { color: #14381f; }
    .quick-card .qc-desc { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.5; transition: color .4s; }
    .quick-card:hover .qc-desc { color: rgba(20,56,31,.75); }
    .quick-card .qc-arrow {
      margin-left: auto; font-size: 26px; color: var(--muted); flex-shrink: 0;
      transition: transform .3s, color .4s;
    }
    .quick-card:hover .qc-arrow { transform: translateX(6px); color: #14381f; }
    .qc-sky { --qc-c: #54aa69; } .qc-indigo { --qc-c: #818cf8; } .qc-yellow { --qc-c: #fbbf24; }
    .qc-green { --qc-c: #34d399; } .qc-gold { --qc-c: #fbbf24; }
    .qc-pink { --qc-c: #f472b6; } .qc-red { --qc-c: #f87171; }

    /* ---- 报告视图（M4）---- */
    .reports-wrap { padding: 24px; max-width: 900px; margin: 0 auto; width:100%; overflow-y:auto; }
    .reports-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .reports-head h2 { margin:0; font-size:18px; }
    .sub-card { background: rgba(245,197,66,.30); border:1px solid rgba(245,197,66,.45); border-radius:10px; padding:12px 14px; font-size:13px; margin-bottom:16px; }
    .reports-tbl td, .reports-tbl th { text-align:left; }
    .reports-tbl a { color: var(--accent); text-decoration:none; }
    .cov { color: var(--kb); font-size:11px; }
    .reddot { background:#dc2626; color:#fff; font-size:9px; padding:1px 5px; border-radius:8px; margin-left:5px; vertical-align:top; }

    /* ---- 对话视图 ---- */
    .chat-view { display: flex; overflow: hidden; height: 100%; }
    .col-left { width: 240px; background: rgba(84,170,105,.22); backdrop-filter: blur(10px); border-right: 1px solid var(--line); padding: 16px 14px; overflow-y: auto; }
    .col-mid { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .col-right { width: 320px; background: rgba(84,170,105,.22); backdrop-filter: blur(10px); border-left: 1px solid var(--line); padding: 14px 12px; overflow-y: auto; }
    .col-left h3 {
      font-size: 11.5px; color: var(--muted); margin: 18px 0 10px;
      text-transform: uppercase; letter-spacing: 2px; display: flex; align-items: center; gap: 8px;
    }
    .col-left h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .chip { background: var(--panel2); border: 1px solid rgba(84,170,105,.25); padding: 8px 11px;
            border-radius: 10px; font-size: 12.5px; margin-bottom: 8px; line-height: 1.5; display: flex; align-items: center; gap: 6px; }
    .comp-item {
      background: var(--panel2); border: 1px solid rgba(84,170,105,.25); border-radius: 12px;
      padding: 10px 12px; margin-bottom: 9px; cursor: pointer;
      transition: transform .2s, border-color .2s, box-shadow .2s;
    }
    .comp-item:hover { transform: translateY(-2px); border-color: rgba(84,170,105,.42); box-shadow: 0 8px 22px rgba(0,0,0,.35); }
    .comp-item .name { font-size: 13.5px; font-weight: 700; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .comp-item .name a { color: var(--accent); text-decoration: none; font-size: 11px; }
    .comp-item .note { color: var(--muted); font-size: 11.5px; margin-top: 5px; line-height: 1.5;
                       display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .badge { font-size: 10px; padding: 1.5px 8px; border-radius: 999px; font-weight: 400;
             background: rgba(52,211,153,.12); color: var(--net); border: 1px solid rgba(52,211,153,.3); }
    .badge.ref { color: var(--muted); background: rgba(100,116,139,.15); border-color: rgba(100,116,139,.35); }
    .example { font-size: 12.5px; color: var(--muted); cursor: pointer; padding: 8px 10px; border-radius: 9px; transition: all .2s; line-height: 1.5; }
    .example:hover { color: var(--accent); background: rgba(56,189,248,.07); transform: translateX(2px); }
    .thinking { color: var(--muted); font-size: 13px; }
    .edit-link { font-size: 11px; color: var(--accent); cursor: pointer; letter-spacing: 0; text-transform: none; font-weight: 400; }
    .edit-link:hover { text-decoration: underline; }
    .del-x { margin-left: auto; color: var(--muted); cursor: pointer; font-size: 13px; padding: 0 4px; border-radius: 5px; line-height: 1; }
    .del-x:hover { color: var(--warn); background: rgba(248,113,113,.12); }
    .chip.clickable { cursor: pointer; transition: border-color .2s, background .2s; }
    .chip.clickable:hover { border-color: rgba(84,170,105,.42); background: #31425f88; }
    .chip-main { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hint-line { font-size: 11px; color: var(--muted); opacity: .7; margin-top: 6px; font-style: italic; }

    .chat-scroll { flex: 1; overflow-y: auto; padding: 22px 26px; }
    .msg { margin-bottom: 18px; max-width: 94%; }
    .msg.user { margin-left: auto; }
    .msg .who { font-size: 11px; color: var(--muted); margin-bottom: 5px; letter-spacing: .5px; }
    .msg.user .bubble {
      padding: 12px 16px; border-radius: 14px; line-height: 1.65; font-size: 14px; white-space: pre-wrap;
      background: linear-gradient(120deg, var(--accent), var(--accent2)); color: #07101f;
      border-bottom-right-radius: 3px; box-shadow: 0 6px 18px rgba(56,189,248,.22);
    }
    .report-card {
      background: linear-gradient(180deg, rgba(32,48,77,.85), rgba(26,38,60,.9));
      border: 1px solid rgba(124,192,137,.35); border-radius: 16px;
      box-shadow: 0 10px 34px rgba(0,0,0,.4); overflow: hidden;
    }
    .report-head {
      padding: 12px 18px; display: flex; align-items: center; gap: 8px;
      border-bottom: 1px dashed rgba(124,192,137,.3); background: rgba(11,18,32,.3);
    }
    .report-head .t { font-weight: 700; font-size: 14px; color: #ffffff; }
    .report-head .acts { margin-left: auto; display: flex; gap: 8px; }
    .mini-btn {
      font-size: 12px; padding: 5px 13px; border-radius: 8px;
      border: 1px solid rgba(84,170,105,.35); background: rgba(11,18,32,.7);
      color: #ffffff; cursor: pointer; transition: all .2s;
    }
    .mini-btn:hover { border-color: #ffe27a; color: #ffe27a; box-shadow: 0 0 0 3px rgba(84,170,105,.2); }
    .mini-btn:disabled { opacity: .5; cursor: not-allowed; }
    .section { padding: 12px 18px; }
    .section + .section { border-top: 1px dashed rgba(124,192,137,.22); }
    .sec-title { font-size: 12px; color: #a8f0c0; letter-spacing: 1.5px; margin-bottom: 7px; font-weight: 700; }
    .sec-body { font-size: 13.5px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; color: #f0f7f2; }
    .sec-body strong { color: #ffe27a; }   /* 加粗关键词 -> 亮黄 */
    .sec-body a { color: #7dd3a8; }
    .sec-body li { color: #f0f7f2; }
    .sec-body table.mdt { color: #1d3a24; }  /* 表格内保持深字（白底） */
    .sec-body table.mdt td { color: #1d3a24; }
    .sec-body table.mdt strong { color: #3f9e5c; }
    table.mdt { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 12.5px; border-radius: 8px; overflow: hidden; background: #ffffff; }
    table.mdt td, table.mdt th { border: 1px solid rgba(84,170,105,.28); padding: 6px 9px; }
    table.mdt tr:first-child td, table.mdt tr:first-child th { background: rgba(84,170,105,.12); font-weight: 600; }
    table.mdt th { background: rgba(84,170,105,.12); }

    .loading-row { display: flex; align-items: center; gap: 14px; padding: 6px 2px; }
    .wrapper-grid {
      --animation-duration: 2.1s; --cube-color: #0000; --highlight-color: #54aa69;
      --cube-width: 13px; --cube-height: 13px;
      position: relative; display: grid; grid-template-columns: repeat(7, var(--cube-width));
      width: calc(7 * var(--cube-width)); height: var(--cube-height);
      perspective: 350px; color: transparent;
    }
    .cube { position: relative; transform-style: preserve-3d; animation: translate-z var(--animation-duration) ease-in-out infinite; }
    .face { position: absolute; width: var(--cube-width); height: var(--cube-height); background-color: var(--cube-color); }
    .face-front { transform: rotateY(0deg) translateZ(calc(var(--cube-width) / 2)); }
    .face-back { transform: rotateY(180deg) translateZ(calc(var(--cube-width) / 2)); opacity: .6; }
    .face-left { transform: rotateY(-90deg) translateZ(calc(var(--cube-width) / 2)); opacity: .6; }
    .face-right { transform: rotateY(90deg) translateZ(calc(var(--cube-width) / 2)); opacity: .6; }
    .face-top { transform: rotateX(90deg) translateZ(calc(var(--cube-width) / 2)); opacity: .8; }
    .face-bottom { transform: rotateX(-90deg) translateZ(calc(var(--cube-width) * .5)); opacity: .8; }
    .cube:nth-child(1) { animation-delay: 0s; } .cube:nth-child(2) { animation-delay: .2s; }
    .cube:nth-child(3) { animation-delay: .4s; } .cube:nth-child(4) { animation-delay: .6s; }
    .cube:nth-child(5) { animation-delay: .8s; } .cube:nth-child(6) { animation-delay: 1s; }
    .cube:nth-child(7) { animation-delay: 1.2s; }
    .cube .face { animation: face-color var(--animation-duration) ease-in-out infinite; animation-delay: inherit; }
    @keyframes translate-z { 0%, 40%, 100% { transform: translateZ(-2px); } 30% { transform: translateZ(8px) translateY(-1px); } }
    @keyframes face-color { 0%, 50%, 100% { background-color: var(--cube-color); } 10% { background-color: var(--highlight-color); } }

    .input-bar { border-top: 1px solid var(--line); padding: 14px 18px; display: flex; gap: 12px; background: rgba(255,255,255,.7); backdrop-filter: blur(10px); }
    .input-bar textarea {
      flex: 1; resize: none; height: 48px; padding: 13px 14px; border-radius: 12px;
      border: 1px solid rgba(84,170,105,.35); background: rgba(255,255,255,.85); color: var(--text);
      font-size: 14px; font-family: inherit; outline: none; transition: border-color .25s, box-shadow .25s;
    }
    .input-bar textarea:focus { border-color: rgba(84,170,105,.5); box-shadow: 0 0 0 3px rgba(84,170,105,.18); }
    .send-bubbles {
      --c1: #1d3a24; --c2: #54aa69; --size-letter: 14px;
      padding: 0 26px; font-size: var(--size-letter); font-family: inherit;
      background-color: transparent; border: calc(var(--size-letter) / 6) solid var(--c2);
      border-radius: 12px; cursor: pointer; overflow: hidden; position: relative;
      transition: 300ms cubic-bezier(.83, 0, .17, 1);
    }
    .send-bubbles > .text { font-weight: 700; color: var(--c2); position: relative; z-index: 1; transition: color 700ms cubic-bezier(.83,0,.17,1); }
    .send-bubbles::before { top: 0; left: 0; } .send-bubbles::after { top: 100%; left: 100%; }
    .send-bubbles::before, .send-bubbles::after {
      content: ""; width: 150%; aspect-ratio: 1/1; scale: 0;
      transition: 1000ms cubic-bezier(.76, 0, .24, 1);
      background-color: var(--c2); border-radius: 50%; position: absolute; translate: -50% -50%;
    }
    .send-bubbles:hover > .text { color: var(--c1); }
    .send-bubbles:hover::before, .send-bubbles:hover::after { scale: 1; }
    .send-bubbles:active { scale: .97; filter: brightness(.9); }
    .send-bubbles:disabled { opacity: .55; cursor: not-allowed; filter: grayscale(.4); }

    .mon-title { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; margin: 6px 2px 12px; }
    .mon-item { font-size: 12.5px; padding: 9px 11px; border-radius: 10px; background: var(--panel2);
                border: 1px solid rgba(84,170,105,.2); margin-bottom: 8px; border-left: 3px solid var(--accent); animation: slide-in .3s ease; }
    @keyframes slide-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
    .mon-item.tool { border-left-color: var(--net); }
    .mon-item.assistant { border-left-color: var(--accent2); }
    .mon-item.task { border-left-color: var(--kb); }
    .mon-item .t { color: var(--muted); font-size: 10.5px; margin-bottom: 2px; }
    /* 模型思考过程：小字灰色、可折叠、可滚动 */
    .think-box { margin-bottom: 10px; border: 1px solid rgba(84,170,105,.2); border-radius: 10px;
                 background: rgba(11,18,32,.55); font-size: 11px; color: #cfe8d6; }
    .think-box summary { cursor: pointer; padding: 7px 11px; font-size: 11.5px; color: #cfe8d6; user-select: none; }
    .think-box[open] summary { border-bottom: 1px solid rgba(84,170,105,.2); }
    .think-text { padding: 8px 11px; max-height: 180px; overflow-y: auto; white-space: pre-wrap;
                  word-break: break-word; line-height: 1.55; font-size: 10.5px; color: #e8f5ec; }
    /* 背景设置面板（任务4） */
    .bg-panel {
      position: fixed; top: 54px; right: 18px; z-index: 99; width: 260px;
      background: rgba(255,255,255,.96); border: 1px solid rgba(84,170,105,.35);
      border-radius: 14px; padding: 14px; box-shadow: 0 16px 40px rgba(45,110,60,.2);
      backdrop-filter: blur(8px);
    }
    .bg-panel-head { font-weight: 700; font-size: 13.5px; margin-bottom: 10px; color: var(--text); }
    .bg-upload { display: block; text-align: center; padding: 10px; border: 2px dashed rgba(84,170,105,.45);
                 border-radius: 10px; cursor: pointer; font-size: 13px; color: var(--accent);
                 transition: all .25s; margin-bottom: 10px; }
    .bg-upload:hover { background: rgba(84,170,105,.1); border-color: var(--accent); }
    .bg-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
    .bg-row input[type="range"] { flex: 1; accent-color: var(--accent); }
    .bg-val { min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
    .bg-row .mini-btn { flex: 1; }
    /* 背景图库网格 */
    .bg-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; max-height: 150px; overflow-y: auto; }
    .bg-cell { position: relative; border-radius: 8px; overflow: hidden; border: 2px solid transparent; cursor: pointer; aspect-ratio: 4/3; }
    .bg-cell.active { border-color: var(--accent); }
    .bg-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .bg-del { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,.55); color: #fff; width: 18px; height: 18px;
              border-radius: 50%; text-align: center; line-height: 17px; font-size: 12px; cursor: pointer; }
    .bg-tick { position: absolute; bottom: 2px; left: 2px; background: var(--accent); color: #fff; width: 16px; height: 16px;
               border-radius: 50%; text-align: center; line-height: 16px; font-size: 10px; }
    /* 定制助手页 */
    .cust-wrap { max-width: 900px; margin: 0 auto; padding: 26px; }
    .cust-head h2 { margin: 0 0 6px; font-size: 20px; }
    .cust-sub { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
    .cust-card { background: rgba(255,255,255,.9); border: 1px solid rgba(84,170,105,.3); border-radius: 16px;
                 padding: 20px; margin-bottom: 18px; box-shadow: var(--shadow); }
    .cust-card h3 { margin: 0 0 10px; font-size: 16px; }
    .cust-tip { font-size: 12.5px; color: var(--muted); margin-bottom: 12px; line-height: 1.6; }
    .prov-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
    .prov-row .m-input { flex: 1; min-width: 120px; }
    .prov-name { max-width: 120px; } .prov-model { max-width: 150px; } .prov-url { min-width: 200px; } .prov-key { min-width: 160px; }
    .mini-btn.act { border-color: var(--accent); color: var(--accent); }
    .mini-btn.act.on { background: var(--accent); color: #fff; }
    .soul-gen { display: flex; gap: 8px; margin-bottom: 10px; }
    .soul-out { border: 1px dashed rgba(245,197,66,.6); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; background: rgba(245,197,66,.08); }
    .soul-out-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; color: var(--text); }
    .soul-pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; color: var(--text); max-height: 200px; overflow-y: auto; margin: 0; font-family: inherit; }
    .soul-ta { width: 100%; min-height: 150px; resize: vertical; }
    .tag-net { color: var(--net); font-weight: 600; }
    .tag-db { color: var(--db); font-weight: 600; }
    .tag-kb { color: var(--kb); font-weight: 600; }

    /* ---- 信息编辑视图（profile）---- */
    .profile-wrap { max-width: 860px; margin: 0 auto; padding: 30px 26px 60px; }
    .p-card { background: var(--panel-solid); border: 1px solid rgba(84,170,105,.3); border-radius: 16px;
              padding: 24px 28px; margin-bottom: 20px; box-shadow: 0 6px 22px rgba(0,0,0,.28); }
    .p-card h3 { margin: 0 0 16px; font-size: 15.5px; display: flex; align-items: center; gap: 8px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
    .form-grid .full { grid-column: 1 / -1; }
    .fg label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .fg .m-input, .fg textarea { width: 100%; }
    .m-input {
      padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(84,170,105,.35);
      background: rgba(255,255,255,.88); color: var(--text); font-size: 13.5px;
      outline: none; transition: border-color .25s, box-shadow .25s, background .25s; font-family: inherit;
    }
    .m-input:focus { border-color: rgba(84,170,105,.5); box-shadow: 0 0 0 3px rgba(84,170,105,.18); }
    select.m-input { color: var(--text); background: rgba(255,255,255,.92); }
    select.m-input option { color: #1d3a24; background: #ffffff; }
    textarea.ta { resize: vertical; line-height: 1.6; font-family: inherit;
      background: rgba(255,255,255,.88); color: var(--text);
      border: 1px solid rgba(84,170,105,.35); border-radius: 10px; padding: 10px 12px; outline: none;
      transition: border-color .25s, box-shadow .25s; }
    textarea.ta:focus { border-color: rgba(84,170,105,.5); box-shadow: 0 0 0 3px rgba(84,170,105,.18); }
    .save-row { margin-top: 18px; display: flex; justify-content: flex-end; gap: 10px; align-items: center; }
    .saved-tip { color: var(--net); font-size: 13px; }
    .list-edit-col { display:flex; flex-direction:column; background: rgba(245,197,66,.28); border:1px solid rgba(245,197,66,.45); border-radius:10px; padding:8px 10px; margin-bottom:10px; }
    .list-edit-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .list-edit-row .grow { flex: 1; }
    .add-form { border-top: 1px dashed rgba(124,192,137,.3); margin-top: 14px; padding-top: 14px; }
    .chk { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; cursor: pointer; }

    /* ---- 弹窗 ---- */
    .mask { position: fixed; inset: 0; z-index: 90; background: rgba(3,7,15,.66); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center; }
    .modal {
      width: min(520px, 92vw); max-height: 86vh; overflow-y: auto;
      background: var(--panel-solid); border: 1px solid var(--line); border-radius: 18px;
      padding: 26px 28px; box-shadow: 0 30px 80px rgba(0,0,0,.6);
    }
    .modal h2 { margin: 0 0 14px; font-size: 18px;
      background: linear-gradient(90deg,var(--accent),var(--accent2));
      -webkit-background-clip: text; background-clip: text; color: transparent; }
    .hint { color: var(--muted); font-size: 13px; line-height: 1.7; margin: 10px 0; }
    .row-add { display: flex; gap: 8px; align-items: center; }
    .row-add .m-input { flex: 1; }
    .mt8 { margin-top: 10px; }
    .modal-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; }
    .toast {
      position: fixed; bottom: 26px; right: 26px; z-index: 99;
      background: rgba(5,46,22,.95); border: 1px solid #166534; color: #bbf7d0;
      padding: 11px 18px; border-radius: 12px; font-size: 13px;
      box-shadow: 0 10px 30px rgba(0,0,0,.5); animation: slide-in .3s ease;
    }
    .toast.err { background: rgba(69,10,10,.95); border-color: #b91c1c; color: #fecaca; }
  </style>
</head>
<body>
<div id="app">
  <!-- ============ 登录页 ============ -->
  <div class="login-wrap" v-if="!token">
    <div class="login-card">
      <h1>智选情报官</h1>
      <div class="sub">本地 AI 情报助手 · 公司竞品分析 / 个人选购决策</div>
      <div class="field">
        <label>用户名</label>
        <div class="input-container">
          <input class="input" v-model="username" placeholder="如 alice / 你的账号" />
          <span class="topline"></span><span class="underline"></span>
        </div>
      </div>
      <div class="field">
        <label>密码</label>
        <div class="input-container">
          <input class="input" v-model="password" type="password" placeholder="密码" @keyup.enter="doLogin" />
          <span class="topline"></span><span class="underline"></span>
        </div>
      </div>
      <div class="field">
        <label>账号类型</label>
        <div class="role-pick">
          <label><input type="radio" value="company" v-model="regRole" /><span>公司账号</span></label>
          <label><input type="radio" value="personal" v-model="regRole" /><span>个人账号</span></label>
        </div>
      </div>
      <button class="bubbles full" @click="doLogin" :disabled="busy"><span class="text">{{ busy ? '登录中…' : '登录 / 自动注册' }}</span></button>
      <div class="err">{{ errMsg }}</div>
    </div>
  </div>

  <!-- ============ 应用 ============ -->
  <template v-else>
    <div id="app-view">
      <div class="topbar">
        <span class="logo" @click="go('home')">智选情报官</span>
        <span class="mode">{{ role === 'company' ? '公司版' : '个人版' }}</span>
        <nav class="nav-tabs">
          <a class="nav-tab" :class="{active: view==='home'}" href="#/home">🏠 工作台</a>
          <a class="nav-tab" :class="{active: view==='profile'}" href="#/profile">{{ role === 'company' ? '🏢 公司信息' : '👤 个人信息' }}</a>
          <a class="nav-tab" :class="{active: view==='chat'}" href="#/chat">🤖 AI 助手</a>

          <a class="nav-tab" :class="{active: view==='reports'}" href="#/reports">📰 报告<span class="reddot" v-if="newReports">NEW</span></a>
          <a class="nav-tab" :class="{active: view==='customize'}" href="#/customize">🎛️ 定制助手</a>
        </nav>
        <span class="spacer"></span>
        <span class="who">{{ username }}</span>
        <span class="link" @click="toggleBgPanel">🎨 背景</span>
        <span class="link" @click="doLogout">退出</span>
      </div>

      <!-- 背景设置面板（任务一+四）：图库选择 + 上传 + 删除 + 透明度 -->
      <div class="bg-panel" v-if="showBgPanel">
        <div class="bg-panel-head">🎨 背景设置</div>
        <label class="bg-upload">
          <input type="file" accept="image/*" @change="onBgUpload" style="display:none" />
          <span>📤 上传新背景图片</span>
        </label>
        <div class="bg-grid" v-if="bgImages.length">
          <div class="bg-cell" v-for="img in bgImages" :key="img.name"
               :class="{active: bgActive === img.url}">
            <img :src="img.url" @click="pickBg(img.url)" />
            <span class="bg-del" @click="delBg(img.name)" title="删除">×</span>
            <span class="bg-tick" v-if="bgActive === img.url">✓</span>
          </div>
        </div>
        <div class="bg-row">
          <span>透明度</span>
          <input type="range" min="5" max="100" v-model.number="bgOpacity" @input="applyBg" />
          <span class="bg-val">{{ bgOpacity }}%</span>
        </div>
        <div class="bg-row">
          <button class="mini-btn" @click="resetBg">↺ 恢复默认</button>
          <button class="mini-btn" @click="showBgPanel = false">完成</button>
        </div>
      </div>

      <!-- ===== 工作台 ===== -->
      <div class="view" v-show="view === 'home'">
        <div class="home">
          <div class="hero">
            <span class="emoji">{{ role === 'company' ? '🏢' : '👋' }}</span>
            <div>
              <h2>{{ greeting }}，{{ displayName }}</h2>
              <p v-if="role === 'company'">这里是你的竞品情报工作台。维护好公司资料与关注竞品后，AI 助手可产出「我们 vs 竞品」的对比简报。</p>
              <p v-else>这里是你的选购决策工作台。添加兴趣与关注后，AI 助手为你做性价比分析与快讯解读。</p>
              <p v-if="!myData.setup_done" style="color:var(--kb)">⚠️ 资料还未完善，建议先到信息页填写基础数据。</p>
            </div>
          </div>

          <div class="stat-grid">
            <template v-if="role === 'company'">
              <div class="stat-card c1"><div class="num">{{ myData.competitors.length }}</div><div class="lbl">关注竞品</div></div>
              <div class="stat-card c2"><div class="num">{{ myData.products.length }}</div><div class="lbl">我司产品</div></div>
              <div class="stat-card c3"><div class="num">{{ profileFilled }}</div><div class="lbl">已填档案字段</div></div>
              <div class="stat-card c4"><div class="num">{{ messages.length }}</div><div class="lbl">本次会话问答</div></div>
            </template>
            <template v-else>
              <div class="stat-card c1"><div class="num">{{ myData.interests.length }}</div><div class="lbl">我的兴趣</div></div>
              <div class="stat-card c2"><div class="num">{{ myData.watchlist.length }}</div><div class="lbl">关注品牌商品</div></div>
              <div class="stat-card c3"><div class="num">{{ myData.collection.length }}</div><div class="lbl">收藏商品</div></div>
              <div class="stat-card c4"><div class="num">{{ messages.length }}</div><div class="lbl">本次会话问答</div></div>
            </template>
          </div>

          <div class="section-title">🧭 快捷入口</div>
          <div class="quick-grid">
            <a class="quick-card qc-sky" href="#/profile">
              <div class="qc-icon">{{ role === 'company' ? '🏢' : '👤' }}</div>
              <div><div class="qc-name">{{ role === 'company' ? '公司信息编辑' : '个人信息编辑' }}</div>
                   <div class="qc-desc">{{ role === 'company'
                     ? '公司简介 / 法人 / 主营领域 / 产品矩阵 / 竞品清单 全维度维护'
                     : '兴趣领域 / 关注品牌商品 / 收藏商品 详细信息维护' }}</div></div>
              <div class="qc-arrow">›</div>
            </a>
            <a class="quick-card qc-indigo" href="#/chat">
              <div class="qc-icon">🤖</div>
              <div><div class="qc-name">AI 情报助手</div>
                   <div class="qc-desc">{{ role === 'company'
                     ? '竞品对比 · 市场动态 · 内×外融合分析，带来源标注'
                     : '性价比入手分析 · 兴趣快讯 · 选购建议，带来源标注' }}</div></div>
              <div class="qc-arrow">›</div>
            </a>
            <a class="quick-card qc-yellow" href="#/reports">
              <div class="qc-icon">📰</div>
              <div><div class="qc-name">定期情报周报</div>
                   <div class="qc-desc">一键生成竞品/选购周报 · 多订阅批量生产 · 定时自动推送</div></div>
              <div class="qc-arrow">›</div>
            </a>
            <a class="quick-card qc-green" href="#/customize">
              <div class="qc-icon">🎛️</div>
              <div><div class="qc-name">定制助手</div>
                   <div class="qc-desc">模型选型 · 助手人格设计 · AI 生成人格提示词</div></div>
              <div class="qc-arrow">›</div>
            </a>
          </div>
        </div>
      </div>

      <!-- ===== 信息编辑 ===== -->
      <div class="view" v-show="view === 'profile'">
        <!-- 公司版 -->
        <div class="profile-wrap" v-if="role === 'company'">
          <div class="p-card">
            <h3>🏢 企业基本档案</h3>
            <div class="form-grid">
              <div class="fg full"><label>公司名称 *</label><input class="m-input" v-model="prof.company_name" placeholder="如：云协科技" /></div>
              <div class="fg full"><label>公司简介</label><textarea class="ta" rows="3" v-model="prof.intro" placeholder="一句话或一段话介绍公司定位与核心业务"></textarea></div>
              <div class="fg"><label>法定代表人</label><input class="m-input" v-model="prof.legal_rep" /></div>
              <div class="fg"><label>注册资本</label><input class="m-input" v-model="prof.reg_capital" placeholder="如 5000万人民币" /></div>
              <div class="fg"><label>成立时间</label><input class="m-input" v-model="prof.founded_date" placeholder="如 2018-06" /></div>
              <div class="fg"><label>员工规模</label><input class="m-input" v-model="prof.employee_scale" placeholder="如 50-200 人" /></div>
              <div class="fg"><label>总部城市</label><input class="m-input" v-model="prof.hq_city" /></div>
              <div class="fg"><label>主营领域 / 行业</label><input class="m-input" v-model="prof.industry" placeholder="如 企业协作软件" /></div>
              <div class="fg"><label>官网</label><input class="m-input" v-model="prof.website" /></div>
              <div class="fg"><label>联系方式</label><input class="m-input" v-model="prof.contact" placeholder="电话 / 邮箱" /></div>
              <div class="fg full"><label>经营范围 / 业务描述</label><textarea class="ta" rows="3" v-model="prof.business_scope" placeholder="主营业务、目标客户、商业模式等"></textarea></div>
              <div class="fg full"><label>地址</label><input class="m-input" v-model="prof.address" /></div>
              <div class="fg full"><label>荣誉资质（每行一条）</label><textarea class="ta" rows="2" v-model="prof.honorsText" placeholder='如：高新技术企业&#10;ISO27001 认证'></textarea></div>
              <div class="fg full"><label>其他备注</label><input class="m-input" v-model="prof.note" /></div>
            </div>
            <div class="save-row">
              <span class="saved-tip" v-if="profSaved">✅ 已保存</span>
              <button class="bubbles" @click="saveProfile"><span class="text">保存公司信息</span></button>
            </div>
          </div>

          <div class="p-card">
            <h3>📦 我司产品（可选）</h3>
            <div class="list-edit-col" v-for="p in myData.products" :key="'p'+p.id">
              <div class="list-edit-row">
                <input class="m-input grow" v-model="p.product_name" />
                <input class="m-input" style="width:110px" v-model="p.category" placeholder="品类" />
                <input class="m-input" style="width:130px" type="number" v-model.number="p.price" placeholder="价格(元/年)" />
                <button class="mini-btn" @click="saveCProduct(p)">保存</button>
                <span class="del-x" @click="delItem('products', p.id)" title="删除">×</span>
              </div>
              <div class="list-edit-row" style="margin-top:6px">
                <input class="m-input grow" v-model="p._description" placeholder="产品描述：一句话说明这是什么、解决什么问题" />
                <input class="m-input grow" v-model="p._features" placeholder="核心卖点/规格参数(逗号分隔)：如 氨基酸配方,温和不刺激,500ml" />
                <input class="m-input" style="width:150px" v-model="p._target" placeholder="目标客户(可选)" />
              </div>
            </div>
            <div class="add-form form-grid">

        <!-- ④ 语音包（音色克隆，联动 voice_test） -->
        <div class="cust-card">
          <h3>🎙️ 语音包（自定义音色）</h3>
          <div class="cust-tip">上传一段参考音频（3-8秒人声最佳）+ 对应台词，克隆出专属音色。AI 回答可在回复框点「🔊 朗读」。克隆/合成时模型临时启动，用完即释放显存。</div>
          <div v-if="!voiceAvailable" class="cust-tip err-tip">⚠️ voice_test 环境不可用（脚本/venv 缺失），语音功能暂不可用。</div>
          <div class="voice-pack-list" v-if="voicePacks.length">
            <div class="voice-pack-row" v-for="p in voicePacks" :key="p.full_name">
              <span class="vp-name">{{ p.name }}</span>
              <span class="vp-size">{{ p.size_mb }}MB</span>
              <button class="mini-btn act" :class="{on: p.active}" @click="selectVoicePack(p)" :disabled="voiceBusy">{{ p.active ? '✓ 使用中' : '选用' }}</button>
              <button class="mini-btn del" @click="delVoicePack(p)" :disabled="voiceBusy">删除</button>
            </div>
          </div>
          <div class="voice-build-row">
            <input class="m-input grow" v-model="newVoicePack.name" placeholder="语音包名，如 我的温柔声" />
            <input class="m-input" type="file" accept=".wav,.flac,.ogg,.mp3" @change="onVoiceFile" ref="voiceFileInput" />
            <input class="m-input grow" v-model="newVoicePack.refText" placeholder="参考音频对应的台词文本（念的内容）" />
            <button class="mini-btn add-more" @click="buildVoicePack" :disabled="voiceBusy">{{ voiceBusy ? '⏳ 克隆中（约1-2分钟）…' : '🎙️ 克隆音色' }}</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 首次登录引导 -->
    <div class="mask" v-if="showOnboard">
      <div class="modal">
        <h2>{{ role === 'company' ? '🏢 完善公司资料' : '⭐ 选择你的兴趣' }}</h2>
        <p class="hint" v-if="role === 'company'">填写公司名称即可开始；其余字段可稍后在「公司信息」页补充。</p>
        <p class="hint" v-else>添加感兴趣的领域，AI 助手将据此为你服务。之后可在「个人信息」页随时调整。</p>
        <template v-if="role === 'company'">
          <input class="m-input mt8" v-model="onboardCompany" placeholder="公司名称，如：云协科技" />
          <div class="row-add mt8" v-for="(r, i) in onboardComps" :key="i">
            <input class="m-input grow" v-model="r.name" placeholder="关注竞品名，如 飞书" />
            <button class="mini-btn" @click="onboardComps.splice(i,1)">移除</button>
          </div>
          <button class="mini-btn add-more" @click="onboardComps.push({name:''})">＋再加一个竞品</button>
        </template>
        <template v-else>
          <div class="row-add mt8" v-for="(r, i) in onboardInterests" :key="i">
            <input class="m-input grow" v-model="r.name" placeholder="兴趣领域，如 无线耳机" />
            <button class="mini-btn" @click="onboardInterests.splice(i,1)">移除</button>
          </div>
          <button class="mini-btn add-more" @click="onboardInterests.push({name:''})">＋再加一个</button>
        </template>
        <div class="modal-foot">
          <button class="mini-btn" @click="skipOnboard">跳过，稍后再说</button>
          <button class="bubbles small" @click="finishOnboard"><span class="text">完成，开始使用</span></button>
        </div>
      </div>
    </div>

    <!-- 批量导入弹窗 -->
    <div class="mask" v-if="batchModal.show">
      <div class="modal">
        <h2>{{ batchModal.type === 'competitors' ? '📋 批量导入竞品' : '📋 批量导入收藏' }}</h2>
        <p class="hint">{{ batchModal.type === 'competitors'
          ? '每行一个竞品名（去空/去重，≤50 条）。示例：飞书 / 钉钉 / 企业微信'
          : '每行：商品名,品牌,参考价（品牌/价格可省略，≤50 条）。示例：AirPods Pro,苹果,1899' }}</p>
        <textarea class="m-input soul-ta" v-model="batchModal.text" placeholder="在这里粘贴…"></textarea>
        <div class="modal-foot">
          <button class="mini-btn" @click="batchModal.show = false">取消</button>
          <button class="bubbles small" @click="submitBatch"><span class="text">开始导入</span></button>
        </div>
      </div>
    </div>

    <div class="toast" v-if="toast" :class="{err: toastErr}">{{ toast }}</div>
      </div>
  </template>
</div>

<script>
const { createApp, ref, reactive, computed, nextTick, onMounted } = Vue;

createApp({
  setup() {
    const token = ref(sessionStorage.getItem('zx_token') || '');
    const username = ref(sessionStorage.getItem('zx_user') || '');
    const role = ref(sessionStorage.getItem('zx_role') || 'personal');
    const regRole = ref('personal');
    const password = ref('');
    const errMsg = ref('');
    const busy = ref(false);
    const view = ref(location.hash.replace('#/', '') || 'home');

    const messages = ref([]);
    const monitor = ref([]);
    const thinkingText = ref('');
    const showBgPanel = ref(false);   // 背景设置面板
    const bgOpacity = ref(60);        // 背景图透明度（5-100）
    const bgImages = ref([]);         // 图库列表 [{name,url}]
    const bgActive = ref('');         // 当前选中的背景图 url
    // 定制助手
    const providers = ref([]);        // 模型配置列表
    const newProv = ref({ provider_name: '', model_name: '', base_url: '', api_key: '', is_active: false });
    const soulContent = ref('');      // 当前人格内容
    const soulReq = ref('');          // 人格生成需求输入
    const soulGenOut = ref('');       // 生成结果预览
    const soulGenning = ref(false);
    const soulSaved = ref(false);
    const soulList = ref([]);         // 人格列表 [{name,file,active}]
    const soulActive = ref('SOUL.md');// 当前激活人格文件
    const newSoulName = ref('');      // 新建人格名
    // 记忆画像 MEMORY.md
    const memoryContent = ref('');
    const memoryInitialized = ref(false);
    const memorySaved = ref(false);
    const memoryGenning = ref(false);
    // 语音包（音色克隆）
    const voicePacks = ref([]);
    const voiceAvailable = ref(true);
    const voiceBusy = ref(false);
    const newVoicePack = ref({ name: '', refText: '' });
    const voiceFile = ref(null);
    const voiceFileInput = ref(null);
    const draft = ref('');
    const loading = ref(false);
    const exporting = ref(false);
    const scroll = ref(null);
    const toast = ref(''); const toastErr = ref(false);
    let toastTimer = null;

    // 用户数据
    const emptyMy = () => ({ competitors: [], products: [], interests: [], watchlist: [], collection: [], setup_done: true });
    const myData = ref(emptyMy());
    const prof = reactive({ company_name:'', intro:'', legal_rep:'', reg_capital:'', founded_date:'',
      employee_scale:'', website:'', hq_city:'', industry:'', business_scope:'',
      contact:'', address:'', honorsText:'', note:'' });
    const profSaved = ref(false);

    const showOnboard = ref(false);
    const onboardCompany = ref('');
    const onboardComps = ref([{name:''}]);
    const onboardInterests = ref([{name:''}]);

    const newInterest = ref({ tag:'', description:'', keywords:'' });
    const newWatch = reactive({ brand:'', product:'', note:'', category:'', price:null, _specs:'', _note2:'' });
    const newComp = reactive({ comp_name:'', website:'', note:'' });
    const batchModal = reactive({ show: false, type: 'competitors', text: '' });
    const newProd = reactive({ product_name:'', category:'', price:null, _description:'', _features:'', _target:'' });

    let ws = null;

    const displayName = computed(() => role.value === 'company' ? (prof.company_name || username.value) : username.value);
    const greeting = computed(() => {
      const h = new Date().getHours();
      return h < 6 ? '夜深了' : h < 12 ? '早上好' : h < 14 ? '中午好' : h < 18 ? '下午好' : '晚上好';
    });
    const profileFilled = computed(() => Object.entries(prof).filter(([k,v]) => k !== 'honorsText' && v).length + (prof.honorsText ? 1 : 0));

    const examples = computed(() => role.value === 'company'
      ? ['对比我们公司与飞书、钉钉在定价和功能上的差异，标注来源',
         '飞书主要对标我们哪些产品？',
         '结合我们的产品定位，给出下季度的差异化竞争建议']
      : ['我想买一副降噪耳机，预算2500以内，对比我收藏的几款并给推荐',
         '我的兴趣领域最近有什么新动态或降价？',
         '根据我的收藏，哪款最值得入手？']);

    // ---------- M4 报告/订阅状态 ----------
    const reports = ref([]);
    const subs = ref([]);
    const newReports = ref(0);
    const digestRunning = ref(false);
    const newSubName = ref('');
    const newSubScope = ref('personal');
    const newSubLang = ref('zh');
    const selCount = computed(() => subs.value.filter(s => s._sel && s.enabled).length);

    async function loadReports() {
      try {
        const r = await fetch('/api/reports?token=' + encodeURIComponent(token.value));
        if (r.ok) { reports.value = (await r.json()).items || []; }
      } catch (e) {}
    }
    async function loadSubs() {
      try {
        const r = await fetch('/api/digest/subs?token=' + encodeURIComponent(token.value));
        if (r.ok) {
          const arr = (await r.json()).subs || [];
          subs.value = arr.map(s => ({
            ...s,
            _kws: (() => { try { return JSON.parse(s.keywords || '[]').join(', '); } catch (e) { return ''; } })(),
            _name: s.name || '',
            lang: s.lang || 'zh',
            enabled: !!s.enabled,
            _sel: !!s.enabled,
          }));
        }
      } catch (e) {}
    }
    async function updateSub(s) {
      const kws = s._kws.split(/[,，]/).map(x => x.trim()).filter(Boolean).slice(0, 8);
      const r = await fetch('/api/digest/subs/' + s.id + '?token=' + encodeURIComponent(token.value), {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: s._name, keywords: JSON.stringify(kws), schedule: s.schedule, lang: s.lang, enabled: s.enabled }),
      });
      if (r.ok) { showToast('订阅已保存 ✅'); await loadSubs(); } else { const e = await r.json().catch(() => ({})); showToast('保存失败：' + (e.detail || r.status), true); }
    }
    async function addSub() {
      const name = newSubName.value.trim();
      if (!name) { showToast('请填写订阅名', true); return; }
      const defaultKws = newSubScope.value === 'company' ? ['行业动态'] : ['数码新品'];
      const r = await fetch('/api/digest/subs?token=' + encodeURIComponent(token.value), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, scope: newSubScope.value, keywords: JSON.stringify(defaultKws), schedule: 'weekly', lang: newSubLang.value, enabled: true }),
      });
      if (r.ok) { newSubName.value = ''; showToast('订阅已新增 ✅'); await loadSubs(); }
      else { const e = await r.json().catch(() => ({})); showToast('新增失败：' + (e.detail || r.status), true); }
    }
    async function delSub(s) {
      const r = await fetch('/api/digest/subs/' + s.id + '?token=' + encodeURIComponent(token.value), { method: 'DELETE' });
      if (r.ok) { showToast('已删除'); subs.value = subs.value.filter(x => x.id !== s.id); }
      else { const e = await r.json().catch(() => ({})); showToast('删除失败：' + (e.detail || r.status), true); }
    }
    async function runDigestNow() {
      const ids = subs.value.filter(s => s._sel && s.enabled).map(s => s.id);
      if (!ids.length) { showToast('请先勾选要生成的订阅', true); return; }
      digestRunning.value = true;
      try {
        const r = await fetch('/api/digest/run?token=' + encodeURIComponent(token.value), {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sub_ids: ids }),
        });
        const d = await r.json();
        if (!r.ok) { showToast(d.detail || '生成失败', true); return; }
        showToast(`✅ 已生成 ${d.generated}/${d.total} 份报告`);
        newReports.value = 0;
        await loadReports();
      } catch (e) { showToast('出错：' + e.message, true); }
      finally { digestRunning.value = false; }
    }

    function showToast(msg, isErr) {
      toast.value = msg; toastErr.value = !!isErr;
      clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.value = '', 3500);
    }

    // ---------- 路由 ----------
    function go(v) { location.hash = '#/' + v; view.value = v; if (v === 'chat') nextTick(scrollToBottom); }
    window.addEventListener('hashchange', () => {
      view.value = location.hash.replace('#/', '') || 'home';
      if (view.value === 'chat') nextTick(scrollToBottom);
      if (view.value === 'reports') { newReports.value = 0; loadReports(); loadSubs(); }
    });

    // ---------- 简报渲染 ----------
    function splitSections(text) {
      if (!text) return [];
      const re = /(①|②|③|④|⑤|^#{1,3}\s*[^\n]+)/gm;
      const marks = []; let m;
      while ((m = re.exec(text)) !== null) marks.push({ idx: m.index, title: m[0].trim() });
      if (marks.length === 0) return [{ title: '内容', body: text }];
      const secs = [];
      if (marks[0].idx > 0) { const intro = text.slice(0, marks[0].idx).trim(); if (intro) secs.push({ title: '概述', body: intro }); }
      for (let i = 0; i < marks.length; i++) {
        const start = marks[i].idx + marks[i].title.length;
        const end = i + 1 < marks.length ? marks[i + 1].idx : text.length;
        secs.push({ title: marks[i].title.replace(/^#+\s*/, ''), body: text.slice(start, end).trim() });
      }
      return secs;
    }
    function renderRich(text) {
      if (!text) return '';
      let h = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      h = h.replace(/🔍\s*网络/g,'<span class="tag-net">🔍网络</span>')
           .replace(/🗄️?\s*数据库/g,'<span class="tag-db">🗄️数据库</span>')
           .replace(/📚\s*知识库/g,'<span class="tag-kb">📚知识库</span>')
           .replace(/🗄️?\s*个人库/g,'<span class="tag-db">🗄️个人库</span>');
      const lines = h.split('\n'); let out = [], inTable = false;
      for (let ln of lines) {
        const tline = ln.trim();
        if (tline.startsWith('|') && tline.endsWith('|')) {
          if (/^\|[\s:\-|]+\|$/.test(tline)) continue;
          if (!inTable) { out.push('<table class="mdt">'); inTable = true; }
          out.push('<tr>' + tline.split('|').slice(1, -1).map(c => `<td>${c.trim()}</td>`).join('') + '</tr>');
        } else {
          if (inTable) { out.push('</table>'); inTable = false; }
          out.push(ln);
        }
      }
      if (inTable) out.push('</table>');
      return out.join('\n').replace(/\n/g, '<br/>');
    }
    function nowStr() { return new Date().toLocaleTimeString('zh-CN', { hour12: false }); }

    // ---------- 数据加载 ----------
    async function api(method, url, body) {
      const opt = { method, headers: { 'Content-Type': 'application/json' } };
      if (body !== undefined) opt.body = JSON.stringify(body);
      const r = await fetch(url, opt);
      if (!r.ok) { showToast(((await r.json().catch(()=>({})))).detail || '操作失败', true); return null; }
      return r.json();
    }
    async function loadMyData() {
      try {
        const r = await fetch('/api/me/overview?token=' + encodeURIComponent(token.value));
        if (!r.ok) return;
        const d = await r.json();
        d.collection = d.products || [];
        if (role.value === 'company') d.products = d.products || [];
        // 展开 attributes JSON 到可编辑字段（公司产品 + 个人收藏）
        [...(d.products || []), ...(d.collection || [])].forEach(unpackAttrs);
        myData.value = d;
        showOnboard.value = !d.setup_done;
        if (role.value === 'company') loadProfile();
      } catch (e) {}
    }
    async function loadProfile() {
      try {
        const r = await fetch('/api/me/profile?token=' + encodeURIComponent(token.value));
        if (!r.ok) return;
        const d = await r.json();
        for (const k of Object.keys(prof)) {
          if (k === 'honorsText') {
            let honors = d.honors || '';
            try { honors = JSON.parse(honors).join('\n'); } catch (e) {}
            prof.honorsText = Array.isArray(honors) ? honors.join('\n') : honors;
          } else prof[k] = d[k] || '';
        }
      } catch (e) {}
    }
    async function saveProfile() {
      const tk = encodeURIComponent(token.value);
      let honorsJson = null;
      const lines = prof.honorsText.split('\n').map(s=>s.trim()).filter(Boolean);
      if (lines.length) honorsJson = JSON.stringify(lines);
      const okResp = await api('POST', '/api/me/profile?token=' + tk, {
        company_name: prof.company_name || null, intro: prof.intro || null,
        legal_rep: prof.legal_rep || null, reg_capital: prof.reg_capital || null,
        founded_date: prof.founded_date || null, employee_scale: prof.employee_scale || null,
        website: prof.website || null, hq_city: prof.hq_city || null,
        industry: prof.industry || null, business_scope: prof.business_scope || null,
        contact: prof.contact || null, address: prof.address || null,
        honors: honorsJson, note: prof.note || null,
      });
      if (okResp) { profSaved.value = true; setTimeout(() => profSaved.value = false, 2500); await loadMyData(); showToast('公司信息已保存 ✅'); }
    }

    // ---------- CRUD ----------
    function openBatch(type) {
      batchModal.type = type;
      batchModal.text = '';
      batchModal.show = true;
    }
    async function submitBatch() {
      const type = batchModal.type;
      const lines = batchModal.text;
      if (!lines.trim()) { showToast('请先粘贴内容', true); return; }
      const url = type === 'competitors' ? '/api/me/competitors/batch' : '/api/me/collection/batch';
      try {
        const r = await fetch(url + '?token=' + encodeURIComponent(token.value), {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lines: lines }) });
        const d = await r.json();
        if (!r.ok) { showToast(d.detail || '导入失败', true); return; }
        showToast('已导入 ' + (d.added || 0) + ' 条 ✅');
        batchModal.show = false;
        await loadMyData();
      } catch (e) { showToast('导入出错：' + e.message, true); }
    }
    async function delItem(type, id) {
      const pathMap = { interests:'interests', watchlist:'watchlist', collection:'collection',
                        competitors:'competitors', products:'products' };
      if (await api('DELETE', `/api/me/${pathMap[type]}/${id}?token=` + encodeURIComponent(token.value))) {
        await loadMyData(); showToast('已删除');
      }
    }
    async function saveRow(url, payload, after) {
      const tk = encodeURIComponent(token.value);
      if (await api('PUT', `/api/me/${url}?token=${tk}`, payload)) {
        await loadMyData(); showToast('已保存 ✅');
      }
    }
    const saveInterest = (i) => saveRow(`interests/${i.id}`,
      { interest_tag: i.interest_tag, description: i.description || null, keywords: i.keywords || null });
    const saveWatch = (w) => saveRow(`watchlist/${w.id}`,
      { brand: w.brand || null, product: w.product || null, note: w.note || null });
    const saveCollection = (p) => saveRow(`collection/${p.id}`,
      { product_name: p.product_name, brand: p.brand || null, category: p.category || null,
        price: p.price ?? null,
        attributes: packAttrs(p, ['_specs', '_note2']) });
    const saveCompetitor = (c) => saveRow(`competitors-meta/${c.id}`,
      { comp_name: c.comp_name, website: c.website || null,
        is_competitor: !!c.is_competitor, note: c.note || null,
        mapped_product_ids: typeof c.mapped_product_ids === 'string' ? c.mapped_product_ids : null });
    // 把描述/卖点/目标客户打包进 attributes JSON（后端零 schema 变更，Agent 可读）
    function packAttrs(obj, keys) {
      const a = {};
      for (const k of keys) { const v = (obj[k] ?? '').toString().trim(); if (v) a[k.slice(1)] = v; }
      return Object.keys(a).length ? JSON.stringify(a) : null;
    }
    function unpackAttrs(row) {
      // 从 attributes JSON 展开到 _description/_features/_target/_specs/_note2 便于编辑
      let a = {};
      try { a = row.attributes ? JSON.parse(row.attributes) : {}; } catch (e) {}
      row._description = a.description ?? '';
      // 兼容新旧 key：新数据写 features/target，早期数据是 core_features/target_customers
      row._features = a.features ?? a.core_features ?? '';
      row._target = a.target ?? a.target_customers ?? '';
      row._specs = a.specs ?? '';
      if (!row._note2 && typeof row.note === 'string') row._note2 = row.note;
    }
    const saveCProduct = (p) => saveRow(`products/${p.id}`,
      { product_name: p.product_name, category: p.category || null, price: p.price ?? null,
        currency: p.currency || 'CNY', status: p.status || 'active',
        attributes: packAttrs(p, ['_description', '_features', '_target']) });

    async function addInterest() {
      const f = newInterest.value;
      if (!f.tag.trim()) return;
      if (await api('POST', '/api/me/interests?token=' + encodeURIComponent(token.value),
          { interest_tag: f.tag.trim(), description: f.description || null, keywords: f.keywords || null })) {
        newInterest.value = { tag:'', description:'', keywords:'' };
        await loadMyData(); showToast('兴趣已添加 ✅');
      }
    }
    async function addItemSimple(type) {
      if (type === 'watchlist') {
        if (!(newWatch.brand || newWatch.product)) return;
        if (await api('POST', '/api/me/watchlist?token=' + encodeURIComponent(token.value),
            { brand: newWatch.brand || null, product: newWatch.product || null, note: newWatch.note || null })) {
          await loadMyData(); showToast('已添加 ✅');
        }
      } else {
        if (!newWatch.product && !newWatch.brand) return;

    // ---------- WS ----------
    function connectWS() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws/${encodeURIComponent(username.value)}`);
      ws.onmessage = (ev) => {
        try {
          const p = JSON.parse(ev.data);
          if (p.type === 'monitor_event') {
            if (p.event === 'thinking') {
              // 思考过程：追加到独立折叠区（小字灰色），不刷监控列表
              thinkingText.value += (p.data && p.data.text) || '';
              return;
            }
            const cls = p.event === 'tool_start' ? 'tool' : p.event === 'assistant_call' ? 'assistant' : p.event === 'task_result' ? 'task' : '';
            monitor.value.unshift({ time: nowStr(), msg: p.message, cls });
            if (monitor.value.length > 60) monitor.value.pop();
            if (p.event === 'report_ready') { newReports.value++; showToast(p.message); loadReports(); }
          }
        } catch (e) {}
      };
    }

    // ---------- 登录 ----------
    async function doLogin() {
      errMsg.value = '';
      if (!username.value || !password.value) { errMsg.value = '请填写用户名和密码'; return; }
      busy.value = true;
      try {
        let r = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ username: username.value, password: password.value }) });
        if (r.status === 401) {
          const reg = await fetch('/api/register', { method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ username: username.value, password: password.value, role: regRole.value }) });
          if (!reg.ok) { errMsg.value = ((await reg.json()).detail) || '注册失败'; return; }
          r = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ username: username.value, password: password.value }) });
        }
        const data = await r.json();
        if (!r.ok) { errMsg.value = data.detail || '登录失败'; return; }
        token.value = data.token; role.value = data.account.role;
        sessionStorage.setItem('zx_token', data.token);
        sessionStorage.setItem('zx_user', data.account.username);
        sessionStorage.setItem('zx_role', data.account.role);
        go('home');
        connectWS(); loadMyData();
        loadReports(); loadSubs(); loadProviders(); loadSouls(); loadMemory(); loadVoicePacks();
        restoreBg();  // 登录后恢复该账号背景
      } catch (e) { errMsg.value = '网络错误：' + e.message; }
      finally { busy.value = false; }
    }
    function doLogout() {
      fetch('/api/logout?token=' + encodeURIComponent(token.value)).catch(()=>{});
      if (ws) ws.close();
      token.value = ''; role.value = 'personal';
      sessionStorage.clear();
      // 登出即清除页面背景（不删 localStorage key，重新登录时按账号恢复）
      document.body.style.removeProperty('--user-bg');
      document.body.style.setProperty('--bg-opacity', '.6');
      bgActive.value = '';
      messages.value = []; monitor.value = []; thinkingText.value = '';
      myData.value = emptyMy();
    }

    function applyBg() {
      const b = document.body;
      b.style.setProperty('--bg-opacity', (bgOpacity.value / 100).toFixed(2));
      if (username.value) localStorage.setItem('bgOpacity_' + username.value, String(bgOpacity.value));
    }
    function setUserBg(url) {
      document.body.style.setProperty('--user-bg', `url("${url}")`);

    function toggleBgPanel() {

    async function onBgUpload(ev) {
      const f = ev.target.files && ev.target.files[0];
      if (!f) return;
      const fd = new FormData();

      try {
        const r = await fetch('/api/bg/upload?token=' + encodeURIComponent(token.value), { method: 'POST', body: fd });

    async function delBg(name) {
      if (!confirm('删除这张背景图？')) return;
      try {
        const r = await fetch('/api/bg/' + encodeURIComponent(name) + '?token=' + encodeURIComponent(token.value), { method: 'DELETE' });
        if (!r.ok) { showToast('删除失败', true); return; }
        const wasActive = bgActive.value && bgActive.value.endsWith('/' + name);
        await loadBgList();
        if (wasActive) {

        }

    function resetBg() {
      document.body.style.removeProperty('--user-bg');
      document.body.style.setProperty('--bg-opacity', '.6');
      bgOpacity.value = 60;
      bgActive.value = '';
      if (username.value) { localStorage.removeItem('userBg_' + username.value); localStorage.removeItem('bgOpacity_' + username.value); }
      showToast('已恢复默认背景');
    }
    function restoreBg() {
      // 未登录（或未确定账号）一律不显示任何用户背景，保持默认
      if (!token.value || !username.value) {
        document.body.style.removeProperty('--user-bg');
        bgActive.value = '';
        return;
      }
      // 兼容迁移：旧版全局 key userBg（未按账号隔离）——若新 key 不存在则回退旧 key，
      // setUserBg 会自动写入新 key，老用户登录一次即完成迁移
      let saved = localStorage.getItem('userBg_' + username.value);
      if (!saved) saved = localStorage.getItem('userBg');
      let opStr = localStorage.getItem('bgOpacity_' + username.value) || localStorage.getItem('bgOpacity') || '60';
      const op = parseInt(opStr, 10);
      if (saved) { setUserBg(saved); }
      else { document.body.style.removeProperty('--user-bg'); bgActive.value = ''; }
      bgOpacity.value = isNaN(op) ? 60 : Math.min(100, Math.max(5, op));
      applyBg();
      loadBgList();
    }

    async function speakMsg(m) {
      if (!m.text) { showToast('没有可朗读的文本', true); return; }
      if (m.speaking) return;
      m.speaking = true;
      showToast('🎙️ 合成任务已提交（首次需加载模型，长文本约数分钟），完成后自动出现播放条…');
      try {
        // 异步提交：立即返回 task_id，后台线程合成，前端轮询状态
        const r = await fetch('/api/tts/speak?token=' + encodeURIComponent(token.value), {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: m.text }) });
        const d = await r.json();
        if (!r.ok) { showToast(d.detail || '提交失败', true); m.speaking = false; return; }
        const taskId = d.task_id;
        // 轮询：每 8 秒查一次（合成 1 段约 1-2 分钟）
        const poll = setInterval(async () => {
          try {
            const s = await fetch('/api/tts/status/' + taskId + '?token=' + encodeURIComponent(token.value));
            const st = await s.json();
            if (st.status === 'done') {
              clearInterval(poll);
              m._audio = st.url;
              m.speaking = false;
              showToast('语音已生成 🔊');
            } else if (st.status === 'error') {
              clearInterval(poll);
              m.speaking = false;
              showToast('合成失败：' + (st.error || '未知错误'), true);
            }
            // pending/running：继续等待
          } catch (e) {
            clearInterval(poll);
            m.speaking = false;
            showToast('查询失败：' + e.message, true);
          }
        }, 8000);
      } catch (e) { showToast('朗读出错：' + e.message, true); m.speaking = false; }
    }

    function soulImport() {
      if (!soulGenOut.value) return;
      soulContent.value = soulGenOut.value;
      soulGenOut.value = '';
      showToast('已导入编辑框，点「保存人格」生效 📥');
    }

    // ---------- 对话 ----------
    async function send(text) {
      const q = (text != null ? text : draft.value).trim();
      if (!q || loading.value) return;
      draft.value = '';
      go('chat');
      messages.value.push({ role: 'user', text: q });
      loading.value = true;
      thinkingText.value = '';  // 新一轮对话清空思考区
      await nextTick(); scrollToBottom();
      try {
        const r = await fetch('/api/chat?token=' + encodeURIComponent(token.value) + '&question=' + encodeURIComponent(q), { method:'POST' });
        const data = await r.json();
        if (!r.ok) messages.value.push({ role:'agent', text:'⚠️ ' + (data.detail || '请求失败'), title:'出错了' });
        else messages.value.push({ role:'agent', text: data.answer, title: q.slice(0,12) + (q.length > 12 ? '…' : '') });
      } catch (e) {
        messages.value.push({ role:'agent', text:'⚠️ 请求出错：' + e.message, title:'出错了' });
      } finally { loading.value = false; await nextTick(); scrollToBottom(); }
    }
    async function doExport(m, fmt) {
      exporting.value = true;
      try {
        const qs = new URLSearchParams({ token: token.value, title: m.title || '情报简报', fmt }).toString();
        const r = await fetch('/api/export?' + qs, { method:'POST',
          headers:{'Content-Type':'application/json'}, body: JSON.stringify({ content: m.text }) });
        const d = await r.json();
        if (!r.ok) { showToast(d.detail || '导出失败', true); return; }
        location.href = (fmt !== 'md' && d.download_pdf) ? d.download_pdf : d.download_md;
        showToast(fmt !== 'md' && d.download_pdf ? 'PDF 已生成并开始下载' : 'Markdown 已下载');
      } catch (e) { showToast('导出出错：' + e.message, true); }
      finally { exporting.value = false; }
    }
    function scrollToBottom() { if (scroll.value) scroll.value.scrollTop = scroll.value.scrollHeight; }

    onMounted(() => { restoreBg(); if (token.value) { connectWS(); loadReports(); loadSubs(); loadMyData(); loadProviders(); loadSouls(); loadMemory(); loadVoicePacks(); } });

    return {
      token, username, password, regRole, errMsg, busy, role, view, go,
      messages, monitor, draft, loading, exporting, scroll, examples, thinkingText,
      showBgPanel, toggleBgPanel, bgOpacity, bgImages, bgActive, onBgUpload, applyBg, resetBg, pickBg, delBg,
      providers, newProv, loadProviders, addProvider, saveProvider, activateProvider, delProvider,
      soulContent, soulReq, soulGenOut, soulGenning, soulSaved, saveSoul, genSoul, soulImport,
      soulList, soulActive, newSoulName, loadSouls, switchSoul, createSoul, delSoul,
      memoryContent, memoryInitialized, memorySaved, memoryGenning, loadMemory, saveMemory, initMemory,
      voicePacks, voiceAvailable, voiceBusy, newVoicePack, loadVoicePacks, onVoiceFile, buildVoicePack,
      selectVoicePack, delVoicePack, speakMsg, voiceFileInput,
      toast, toastErr, myData, prof, profSaved, profileFilled,
      showOnboard, onboardCompany, onboardComps, onboardInterests,
      newInterest, newWatch, newComp, newProd, batchModal, openBatch, submitBatch,
      displayName, greeting,
      doLogin, doLogout, send, doExport, splitSections, renderRich,
      finishOnboard, skipOnboard, delItem,
      reports, subs, newSubName, newSubScope, newSubLang, selCount, newReports, digestRunning,
      loadReports, loadSubs, updateSub, addSub, delSub, runDigestNow,
      saveProfile, saveInterest, saveWatch, saveCollection, saveCompetitor, saveCProduct,
      addInterest, addItemSimple, addCompetitor, addProduct,
    };
  }
}).mount('#app');
</script>

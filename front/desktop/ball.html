<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>智选情报官 · 悬浮对话</title>
<style>
  :root{
    --ink:#1d2a22; --muted:#6c7d71; --line:rgba(30,60,40,.12);
    --bg:#f5f8f3; --panel:#ffffff; --user:#dcecdc; --accent:#4f8f5c;
    --bar:#161d18; --bar-ink:#dfe8e1;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:13.5px/1.55 "Microsoft YaHei","Segoe UI",system-ui,sans-serif;overflow:hidden}
  body{display:flex;flex-direction:column;min-height:0}
  header.bar{position:relative;flex:0 0 40px;height:40px;display:flex;align-items:center;gap:6px;
    padding:0 8px 0 6px;background:var(--bar);color:var(--bar-ink);user-select:none}
  header .grip{width:20px;height:26px;display:flex;align-items:center;justify-content:center;
    color:#7f8f84;font-size:13px;cursor:move;flex:0 0 20px;letter-spacing:-1px}
  header .grip:hover{color:#cfe0d4}
  header .sess{flex:1 1 auto;min-width:0;height:26px;display:flex;align-items:center;gap:6px;
    border:1px solid rgba(255,255,255,.16);border-radius:7px;background:rgba(255,255,255,.08);
    color:#e8f0ea;font:inherit;font-size:12.5px;padding:0 8px;cursor:pointer;text-align:left}
  header .sess:hover{background:rgba(255,255,255,.14)}
  header .sess span{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header .sess i{font-style:normal;color:#9fb2a5;font-size:11px}

  /* 自绘会话下拉：不用原生 select —— 无边框窗里打开系统弹层会把进程拖崩 */
  .menu{position:absolute;top:42px;left:28px;right:8px;z-index:90;max-height:300px;overflow-y:auto;
    background:#1b241d;border:1px solid rgba(255,255,255,.14);border-radius:9px;
    box-shadow:0 10px 26px rgba(0,0,0,.45);padding:4px}
  .menu[hidden]{display:none}
  .menu .mi{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;
    color:#e8f0ea;font:inherit;font-size:12.5px;text-align:left;padding:7px 8px;border-radius:6px;cursor:pointer}
  .menu .mi:hover{background:rgba(255,255,255,.10)}
  .menu .mi.on{background:#2f4436;color:#fff}
  .menu .mi .t{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .menu .mi .n{flex:0 0 auto;color:#9fb2a5;font-size:11px}
  .menu .empty{color:#9fb2a5;font-size:12px;padding:8px}
  header button{width:26px;height:26px;border:0;border-radius:7px;background:transparent;color:#b9c6bd;
    font-size:14px;cursor:pointer;flex:0 0 26px;line-height:1}
  header button:hover{background:rgba(255,255,255,.12);color:#fff}
  header .sp{flex:0 0 2px}
  main{flex:1 1 auto;min-height:0;overflow-y:auto;padding:12px 10px 4px;display:flex;flex-direction:column;gap:8px}
  .row{display:flex}
  .row.user{justify-content:flex-end}
  .bub{max-width:86%;padding:8px 10px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
  .row.user .bub{background:var(--user);border-bottom-right-radius:4px}
  .row.bot .bub{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
  .row.tip .bub{background:transparent;color:var(--muted);font-size:12px;padding:2px 4px}
  .bub.err{background:#fdeaea;border-color:#f3c9c9;color:#8a2b2b}
  footer{flex:0 0 auto;padding:8px 10px 10px;border-top:1px solid var(--line);background:var(--bg);
    display:flex;gap:8px;align-items:flex-end}
  textarea{flex:1 1 auto;min-height:34px;max-height:96px;resize:none;border:1px solid var(--line);
    border-radius:10px;padding:8px 10px;font:inherit;outline:none;background:#fff}
  textarea:focus{border-color:rgba(79,143,92,.55);box-shadow:0 0 0 3px rgba(79,143,92,.12)}
  #send{flex:0 0 auto;height:34px;padding:0 14px;border:0;border-radius:10px;background:var(--accent);
    color:#fff;font-size:13px;cursor:pointer}
  #send.stop{background:#b4453f}
  #send:disabled{opacity:.55;cursor:default}
  .empty{color:var(--muted);font-size:12.5px;text-align:center;margin-top:18px}
</style>
</head>
<body>
  <header class="bar">
    <!-- 只有这个握把是拖动区；点下拉/按钮时绝不拖窗（无边框窗里拖窗+弹层会崩） -->
    <span class="grip pywebview-drag-region" title="按住拖动面板">⠿</span>
    <button id="sessBtn" class="sess" title="切换会话">
      <span id="sessName">（加载中）</span><i>▾</i>
    </button>
    <div id="sessMenu" class="menu" hidden></div>
    <button id="newS" title="新建会话">＋</button>
    <button id="renS" title="重命名会话">✎</button>
    <button id="delS" title="删除会话">🗑</button>
    <span class="sp"></span>
    <button id="close" title="收起（Esc）">×</button>
  </header>
  <main id="msgs"></main>
  <footer>
    <textarea id="inp" rows="1" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
    <button id="send">发送</button>
  </footer>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const msgs = $('msgs'), inp = $('inp'), sendBtn = $('send');
  const sessBtn = $('sessBtn'), sessName = $('sessName'), sessMenu = $('sessMenu');
  const TOKEN = () => localStorage.getItem('zx_token') || '';
  const SES_KEY = 'ball_thread';
  let thread = '', busy = false, sessions = [];

  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
  function api(path, opt) {
    const t = TOKEN();
    const sep = path.indexOf('?') >= 0 ? '&' : '?';
    return fetch(path + sep + 'token=' + encodeURIComponent(t), opt || {}).then(async (r) => {
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.detail || ('HTTP ' + r.status));
      return d;
    });
  }
  function addRow(kind, text) {
    const row = document.createElement('div');
    row.className = 'row ' + kind;
    const b = document.createElement('div');
    b.className = 'bub';
    b.textContent = text;
    row.appendChild(b);
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
    return b;
  }
  function clearMsgs() { msgs.innerHTML = ''; }

  // ── 会话下拉（自绘）──────────────────────────────────────────
  function titleOf(tid) {
    const s = sessions.find((x) => x.thread_id === tid);
    return (s && s.title) || '新对话';
  }
  function closeMenu() { sessMenu.hidden = true; }
  function renderMenu() {
    sessMenu.innerHTML = '';
    if (!sessions.length) {
      const d = document.createElement('div');
      d.className = 'empty';
      d.textContent = TOKEN() ? '（还没有会话，点「＋」新建）' : '（未登录）';
      sessMenu.appendChild(d);
      return;
    }
    for (const s of sessions) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'mi' + (s.thread_id === thread ? ' on' : '');
      const t = document.createElement('span'); t.className = 't';
      t.textContent = s.title || '新对话';
      const n = document.createElement('span'); n.className = 'n';
      n.textContent = s.message_count ? String(s.message_count) : '';
      b.appendChild(t); b.appendChild(n);
      b.addEventListener('click', () => { closeMenu(); setThread(s.thread_id); });
      sessMenu.appendChild(b);
    }
  }
  function setThread(tid) {
    thread = tid || '';
    if (thread) localStorage.setItem(SES_KEY, thread);
    sessName.textContent = thread ? titleOf(thread) : '（还没有会话）';
    renderMenu();
    loadMessages().catch((e) => addTip('读消息失败：' + e.message));
  }

  async function loadSessions() {
    if (!TOKEN()) { sessName.textContent = '（未登录）'; renderMenu(); addTip('请先登录桌面版，再用悬浮球对话。'); return; }
    const d = await api('/api/chat/sessions');
    sessions = d.items || [];
    if (!sessions.length) { thread = ''; sessName.textContent = '（还没有会话）'; renderMenu(); return; }
    const saved = localStorage.getItem(SES_KEY);
    setThread(sessions.some((s) => s.thread_id === saved) ? saved : sessions[0].thread_id);
  }

  function addTip(text) { clearMsgs(); addRow('tip', text); }

  async function loadMessages() {
    clearMsgs();
    if (!thread) { addTip('这个账号还没有会话，点「＋」开一个。'); return; }
    const d = await api('/api/chat/sessions/' + encodeURIComponent(thread));
    const list = (d.messages || []).filter((m) => m.role === 'user' || m.role === 'assistant');
    if (!list.length) { addTip('新会话：直接在下面输入问题。'); return; }
    for (const m of list) {
      let text = m.content;
      if (typeof text !== 'string') text = typeof text === 'object' ? JSON.stringify(text, null, 2) : String(text || '');
      if (!text.trim()) continue;
      addRow(m.role === 'user' ? 'user' : 'bot', text);
    }
  }

  function setBusy(on) {
    busy = on;
    sendBtn.textContent = on ? '中断' : '发送';
    sendBtn.classList.toggle('stop', on);
    inp.disabled = on;
  }

  async function send() {
    const q = inp.value.trim();
    if (busy) {
      try { await api('/api/chat/cancel?thread_id=' + encodeURIComponent(thread), { method: 'POST' }); }
      catch (e) { /* 忽略：可能刚好结束 */ }
      return;
    }
    if (!q) return;
    if (!thread) {
      try { await newSession(); } catch (e) { addRow('bot', '新建会话失败：' + e.message); return; }
    }
    inp.value = ''; autoGrow();
    addRow('user', q);
    const bubble = addRow('bot', '思考中…');
    setBusy(true);
    try {
      const d = await api('/api/chat?question=' + encodeURIComponent(q) +
                          '&thread_id=' + encodeURIComponent(thread), { method: 'POST' });
      bubble.textContent = d.answer || '（没有返回内容）';
      if (d.cancelled) bubble.textContent += '\n\n（已中断）';
    } catch (e) {
      bubble.classList.add('err');
      bubble.textContent = '出错了：' + e.message;
    } finally {
      setBusy(false);
      msgs.scrollTop = msgs.scrollHeight;
      loadSessions().catch(() => {});
    }
  }

  async function newSession() {
    const d = await api('/api/chat/sessions?kind=chat', { method: 'POST' });
    thread = d.thread_id || d.id || '';
    if (thread) localStorage.setItem(SES_KEY, thread);
    await loadSessions();
    return thread;
  }

  async function renameSession() {
    if (!thread) return;
    const cur = (sessions.find((s) => s.thread_id === thread) || {}).title || '新对话';
    const t = prompt('会话标题（≤30 字）', cur);
    if (t == null) return;
    await api('/api/chat/sessions/' + encodeURIComponent(thread) + '?title=' + encodeURIComponent(t.trim()),
              { method: 'PATCH' });
    await loadSessions();
  }

  async function delSession() {
    if (!thread) return;
    if (!confirm('删除这个会话？消息会一起删除，不能恢复。')) return;
    await api('/api/chat/sessions/' + encodeURIComponent(thread), { method: 'DELETE' });
    localStorage.removeItem(SES_KEY);
    thread = '';
    await loadSessions();
  }

  function autoGrow() {
    inp.style.height = 'auto';
    inp.style.height = Math.min(inp.scrollHeight, 96) + 'px';
  }

  // ── 事件 ──
  sendBtn.addEventListener('click', send);
  inp.addEventListener('input', autoGrow);
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });
  sessBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (sessMenu.hidden) { renderMenu(); sessMenu.hidden = false; } else { closeMenu(); }
  });
  sessMenu.addEventListener('click', (e) => e.stopPropagation());
  document.addEventListener('click', closeMenu);
  $('newS').addEventListener('click', () => newSession().catch((e) => addTip('新建失败：' + e.message)));
  $('renS').addEventListener('click', () => renameSession().catch((e) => alert('重命名失败：' + e.message)));
  $('delS').addEventListener('click', () => delSession().catch((e) => alert('删除失败：' + e.message)));
  $('close').addEventListener('click', () => {
    try { window.pywebview.api.ball_hide(); } catch (e) {}
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (!sessMenu.hidden) { closeMenu(); return; }     // Esc 先关下拉，再关面板
    try { window.pywebview.api.ball_hide(); } catch (err) {}
  });

  // 面板是先于登录加载的：token 变化（登录/换号/登出）时自己刷新一次
  let _tok = TOKEN();
  function refresh() {
    _tok = TOKEN();
    if (!_tok) {
      sessions = []; thread = '';
      sessName.textContent = '（未登录）';
      renderMenu();
      addTip('请先登录桌面版，再用悬浮球对话。');
      return Promise.resolve();
    }
    return loadSessions().catch((e) => addTip('加载会话失败：' + e.message));
  }
  window.ballRefresh = refresh;          // 外壳在 auth_state / 展开面板时调它
  setInterval(() => { if (TOKEN() !== _tok) refresh(); }, 1500);

  if (!TOKEN()) refresh();
  else loadSessions().catch((e) => addTip('加载会话失败：' + e.message));
  inp.focus();
})();
</script>
</body>
</html>

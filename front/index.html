    .ts-badge { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: rgba(84,170,105,.14); color: var(--accent); }
    .ts-badge.write { background: rgba(217,83,79,.12); color: #d9534f; }
    .ts-params { font-size: 12px; color: var(--muted); }
    .ts-write-ack { display: block; font-size: 12px; color: #b45309; margin-top: 6px; }
    .ts-warn { font-size: 12px; color: #b45309; margin-top: 4px; }
    /* ---- v3.0 M1 API 工具：常态卡 + 弹窗（对齐"自定义 CLI"的信息密度）---- */
    .ts-modal { width: min(920px, 94vw); }
    .ts-src-card h3 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .ts-slug { font-size: 12px; color: var(--muted); background: rgba(0,0,0,.05);
               padding: 1px 6px; border-radius: 5px; font-weight: 400; }
    .ts-tools { border: 1px dashed rgba(84,170,105,.35); border-radius: 10px; padding: 8px 10px;
                margin: 8px 0 10px; background: rgba(84,170,105,.04); }
    .ts-tools-head { display: flex; justify-content: space-between; align-items: center;
                     gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
    .ts-tool { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 3px 0; font-size: 13px; }
    .ts-tool-state { font-size: 12px; }
    .ts-tool-state.pend { color: #b45309; }
    .ts-tool-name { font-weight: 600; }
    .ts-src-foot { display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
    .ts-note { flex: 1; margin: 0; text-align: left; }
    .ts-tip-empty { font-size: 12px; color: var(--muted); padding: 4px 0; }
    /* ---- M5c-2'：工具描述（可编辑 + AI 预写） ---- */
    .cap-issues { display: inline-block; width: 100%; margin: 2px 0 2px 0; }
    .cap-issue { display: inline-block; margin: 2px 6px 0 0; padding: 2px 7px; border-radius: 10px;
      font-size: 12px; }
    .cap-issue.hard { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
    .cap-issue.soft { background: var(--card); color: var(--muted-foreground); border: 1px solid var(--border); }
    .cap-name-in { width: 100%; margin-top: 6px; padding: 5px 8px; border: 1px solid var(--border);
      border-radius: 6px; font: inherit; font-size: 12.5px; }
    .cap-name-in:focus { outline: none; border-color: var(--accent); }
    .ts-state.cap-has-text { color: var(--accent); }
    .cap-edit-ta { width: 100%; margin-top: 4px; padding: 6px 8px; border: 1px solid var(--border);
                   border-radius: 6px; background: var(--card); color: var(--foreground);
                   font-family: inherit; font-size: 12.5px; line-height: 1.55; resize: vertical; }
    .cap-auto { font-size: 11.5px; color: var(--muted); width: 100%; }
    .cap-warn { font-size: 12px; color: #b45309; margin: 2px 0; }
    .soul-gen { display: flex; gap: 8px; margin-bottom: 10px; }
    .soul-out { border: 1px dashed rgba(245,197,66,.6); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; background: rgba(245,197,66,.08); }
    .soul-out-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; color: var(--text); }
    .soul-pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; color: var(--text); max-height: 200px; overflow-y: auto; margin: 0; font-family: inherit; }
    .soul-ta { width: 100%; min-height: 150px; resize: vertical; }
    /* M5-6：价格台账卡（不透明底 + 涨跌配色） */
    .price-card { margin: 6px 0 8px; padding: 9px 11px; border-radius: 9px; background: #14181f;
      border: 1px solid rgba(255,255,255,.14); font-size: 12.5px; color: #c9d3e4; }
    .price-card .pc-head { font-weight: 700; color: #f2f7ff; margin-bottom: 5px; }
    /* ★ 收起态 = 只有「价格台账」四个字的小标签；展开由 v-show 控制（JS 显式，不靠层叠 ✗） */
    .price-card { transition: box-shadow .25s ease, border-color .25s ease; }
    .price-card .pc-head { display: flex; align-items: center; gap: 7px; margin-bottom: 0; cursor: pointer; }
    .price-card.open .pc-head { margin-bottom: 6px; }
    .price-card .pc-tag { display: inline-block; padding: 2px 9px; border-radius: 999px; font-weight: 700;
      color: #cfd8ea; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.16); }
    .price-card .pc-badges { display: inline-flex; gap: 6px; }
    .price-card .pc-badge { font-size: 11px; font-weight: 400; color: #8a94a6;
      border: 1px dashed rgba(255,255,255,.18); border-radius: 999px; padding: 1px 7px; }
    .price-card .pc-more { margin-left: auto; font-size: 11px; color: #8a94a6; }
    .price-card:hover .pc-tag, .price-card.open .pc-tag { color: #ffd9a0; border-color: rgba(224,164,92,.5); }
    .price-card.open { box-shadow: 0 12px 30px rgba(0,0,0,.38); border-color: rgba(224,164,92,.45); }
    .price-card .pc-row { display: flex; align-items: center; gap: 6px; padding: 3px 0; flex-wrap: wrap; }
    .price-card .pc-name { flex: 1; min-width: 90px; color: #f2f7ff; }
    .price-card .pc-price { color: #e6edf7; font-weight: 600; }
    .price-card .pc-delta.down { color: #7ee08a !important; }
    .price-card .pc-delta.up { color: #e08a8a !important; }
    .price-card .pc-target { color: #9aa4b6; }
    .price-card .pc-target.hit { color: #e0a45c; font-weight: 700; }
    .price-card .pc-input { width: 62px; padding: 1px 6px; border-radius: 6px;
      border: 1px solid rgba(255,255,255,.25); background: #0f1319; color: #f2f7ff; }
    .price-card .pc-save { background: none; border: 1px solid rgba(255,255,255,.25); color: #9fb0e8;
      border-radius: 6px; cursor: pointer; font-size: 12px; padding: 1px 8px; }
    .price-card .pc-comp { padding: 2px 0; color: #9fb0e8; }
    .price-card .pc-news { margin-top: 5px; }
    .price-card .pc-news summary { cursor: pointer; color: #e0a45c; }
    .price-card .pc-news-row { display: flex; gap: 8px; padding: 2px 0; color: #c9d3e4; flex-wrap: wrap; }
    .price-card .pc-news-row .m-price { color: #e6edf7; }
    .price-card .pc-news-row .m-shop, .price-card .pc-news-row .m-seen { color: #8a94a6; }
    /* Q6④：复杂价格规则 + 台账历史 */
    .price-card .pc-rule-tag { font-size: 11px; color: #e0a45c !important; border: 1px solid #e0a45c;
      border-radius: 5px; padding: 0 4px; margin-left: 4px; }
    .price-card .pc-rule { color: #e0a45c !important; max-width: 240px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; }
    .price-card .pc-wide { width: 150px; }
    .price-card .pc-hist { margin: 5px 0 2px 10px; padding: 5px 7px; border-left: 2px solid rgba(255,255,255,.2); }
    .price-card .pc-hist-head { color: #9aa4b6; margin-bottom: 3px; }
    .price-card .pc-hist-row { display: flex; align-items: center; gap: 7px; padding: 1px 0; }
    .price-card .pc-hist-none { color: #8a94a6; }
    .cx-toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; }
    /* ★ 登记价用蓝色（与白色台账价、黄色目标价一眼区分） */
    .price-card .pc-registered { color: #6ab0ff !important; font-weight: 600; }
    /* ★ 两块操作区严格分行，避免"记"与"复杂价"混在一起造成误读 */
    .price-card .pc-ops { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; width: 100%;
      padding: 4px 0; margin-top: 3px; border-top: 1px dashed rgba(255,255,255,.12); }
    .price-card .pc-ops-rule { border-top: 1px solid rgba(224,164,92,.35); }
    .price-card .pc-ops-label, .price-card .pc-sec-label { color: #9aa4b6; min-width: 72px; }
    /* ===== 五栏结构：每栏一行，栏间虚线分隔 ===== */
    .price-card .pc-sec { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; width: 100%;
      padding: 5px 0; border-top: 1px dashed rgba(255,255,255,.12); }
    .price-card .pc-sec-show { border-top: none; }
    .price-card .pc-sec-rule { border-top: 1px solid rgba(224,164,92,.40); }
    .price-card .pc-sec-hist { border-top: 1px solid rgba(255,255,255,.16); }
    .price-card .pc-hint { color: #8a94a6; font-size: 12px; }
    /* ★ 整卡缩字号（用户反馈：右栏窄，文字太大把按钮挤出去） */
    .price-card { font-size: 12.5px; }
    .price-card .pc-name { font-size: 12.5px; }
    .price-card .pc-input, .price-card .pc-save { font-size: 12px; padding: 3px 8px; }
    .price-card .pc-hist-head { font-size: 11.5px; }
    /* ★ 台账历史行：允许换行 + 紧凑，保证「删」按钮永远在栏内 */
    .price-card .pc-hist-row { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 5px;
      padding: 4px 6px; font-size: 11.5px; border-radius: 6px; }
    .price-card .pc-hist-row > * { min-width: 0; }
    .price-card .pc-hist-row .pc-save { font-size: 11px; padding: 2px 6px; flex: 0 0 auto; }
    .price-card .pc-hist-row .m-seen { font-size: 11.5px; white-space: nowrap; }
    .price-card .pc-hist-row .m-price { font-size: 12px; font-weight: 600; }
    .price-card .pc-hist-row .m-shop, .price-card .pc-hist-row .pc-delta { font-size: 11.5px; }
    /* ★ 删除台账：低饱和红，避免误点但一眼能找到 */
    .price-card .pc-del { color: #ff9a9a; border-color: rgba(255,120,120,.45); }
    .price-card .pc-del:hover { background: rgba(255,90,90,.18); color: #ffd0d0; }
    /* ===== 商品切换器（改自 front_from_uiverse 010 sliding-tab）===== */
    .price-card .pc-picker { margin-bottom: 4px; }
    .price-card .pc-picker-btn { display: flex; align-items: center; gap: 7px; width: 100%; cursor: pointer;
      background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
      border: 1px solid rgba(255,255,255,.22); border-radius: 8px; color: #f2f7ff;
      padding: 5px 9px; font-size: 13px; transition: background-color .25s linear, border-color .25s; }
    .price-card .pc-picker-btn:hover { background: rgba(255,255,255,.13); border-color: rgba(255,255,255,.36); }
    .price-card .pc-caret { margin-left: auto; transition: transform .3s cubic-bezier(.33,.83,.99,.98); }
    .price-card .pc-caret.open { transform: rotate(180deg); }
    .price-card .pc-count { color: #8a94a6; font-size: 12px; }
    .price-card .pc-picker-wrap { margin-top: 5px; overflow-x: auto; scrollbar-width: none; }
    .price-card .pc-picker-track { --w-label: 132px; position: relative; display: flex; align-items: center;
      background: #0f1319; border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 4px; }
    .price-card .pc-picker-slide { position: absolute; top: 4px; left: 4px; height: calc(100% - 8px);
      width: var(--w-label); border-radius: 7px; background: rgba(224,164,92,.22);
      border-top: 2px solid #e0a45c; border-bottom: 2px solid #e0a45c; z-index: 0;
      transition: transform .5s cubic-bezier(.33,.83,.99,.98); }
    .price-card .pc-picker-tab { position: relative; z-index: 2; flex: 0 0 var(--w-label); width: var(--w-label);
      padding: 6px 8px; cursor: pointer; color: #c9d3e4; font-size: 12.5px; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; text-align: center; transition: color .25s ease; }
    .price-card .pc-picker-tab:hover { color: #fff; }
    .price-card .pc-picker-tab.on { color: #ffd9a0; font-weight: 700; }
    .price-card .pc-tag-mini { display: block; font-size: 11px; color: #8a94a6; }
    /* M5-4：价格提醒条（不透明底，避免被背景图糊掉；与用量条同一套观感） */
    .price-alert-bar { margin: 6px 0 8px; padding: 8px 10px; border-radius: 9px; background: #14181f;
      border: 1px solid rgba(200,132,60,.5); font-size: 12.5px; color: #e0a45c; }
    .price-alert-bar .pa-head { font-weight: 700; margin-bottom: 4px; }
    .price-alert-bar .pa-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
    .price-alert-bar .pa-txt { flex: 1; color: #f2f7ff; }
    .price-alert-bar .pa-ack { background: none; border: 1px solid rgba(255,255,255,.25); color: #e0a45c;
      border-radius: 6px; cursor: pointer; font-size: 12px; padding: 1px 8px; }
    /* M4-5：本会话用量条（不透明底，避免被背景图糊掉） */
    .usage-bar { display: flex; align-items: center; gap: 6px; margin: 6px 0 10px; padding: 7px 10px;
      border-radius: 9px; background: #14181f; border: 1px solid rgba(255,255,255,.12);
      font-size: 12.5px; color: #9aa4b6; }
    .usage-bar .u-num { color: #e6edf7; font-size: 14px; }
    .usage-bar .u-turn { color: #7b8698; }
    .usage-bar.warn { border-color: rgba(200,132,60,.55); color: #e0a45c; }
    .usage-bar.warn .u-hint { color: #e0a45c; margin-left: auto; }
    .usage-bar .u-refresh { margin-left: auto; background: none; border: none; color: #7b8698;
      cursor: pointer; font-size: 14px; }
    /* M3-7：AI 建议面板 / 差异行 / 历史版本 */
    .mem-tools { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .mem-dirty { font-size: 12px; color: #d08770; }
    .mem-note { margin-top: 8px; font-size: 12.5px; color: #8a94a6; line-height: 1.6; }
    .mem-note.warn { color: #c8843c; }
    /* ★ 必须**不透明**：用户可能给页面配花哨背景图（实测黄底条纹），半透明底会把差异行糊成一片 */
    .mem-diff { margin-top: 10px; border: 1px solid rgba(255,255,255,.14); border-radius: 10px; overflow: hidden;
      background: #14181f; }
    .mem-diff-head { display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px;
      font-size: 12.5px; color: #c9d3e4; background: rgba(255,255,255,.06); }
    .mem-diff-head .hint { opacity: 1; color: #9aa4b6; }
    .mem-diff-row { padding: 4px 12px; border-top: 1px solid rgba(255,255,255,.06); }
    .mem-diff-row:hover { background: rgba(255,255,255,.03); }
    .mem-line { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; font-size: 13px;
      line-height: 1.7; cursor: pointer; }
    .mem-diff-row .op-glyph { width: 14px; font-weight: 700; }
    .mem-diff-row.op-add .op-glyph { color: #55b685; }
    .mem-diff-row.op-update .op-glyph { color: #4f9fd8; }
    .mem-diff-row.op-remove .op-glyph { color: #d07070; }
    /* ★ 2026-09-28 用户实测：深底上"旧值/字段名/来源"太暗读不清 → 统一提亮。
       `!important` 是**故意的**：app 主题（body 注入的 CSS 变量）里有更晚生效的同名颜色规则，
       不强制会又被压暗回去 —— 可读性优先。 */
    .mem-diff-row .fld { font-weight: 700; color: #f2f7ff !important; }
    .mem-diff-row .old { color: #7ee08a !important; text-decoration: line-through; }   /* 亮绿=旧值 */
    .mem-diff-row .arrow { color: #9aa4b6 !important; }
    .mem-diff-row .new { color: #ffffff !important; }
    .mem-diff-row .src { color: #aab6c8 !important; font-size: 12px; }
    .mem-diff-row .tag { font-size: 11px; padding: 1px 6px; border-radius: 6px; }
    .mem-diff-row .tag.newdim { background: rgba(200,132,60,.20); color: #e0a45c; }
    .mem-diff-row .tag.manual { background: rgba(120,140,200,.20); color: #9fb0e8; }
    .mem-diff-foot { display: flex; align-items: center; gap: 8px; padding: 9px 12px; flex-wrap: wrap;
      border-top: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.03); }
    .mem-diff-foot .oprot { font-size: 12.5px; color: #9aa4b6; margin-right: auto; }
    .mem-snaps { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
    /* ★ 2026-09-28 用户实测：往期版本原来**没有底卡**、黄底背景直接透上来 → 文字根本看不清。
       与「AI 建议」面板统一：不透明深底 + 亮色字。 */
    .mem-snap-row { display: flex; align-items: center; gap: 10px; padding: 8px 11px; font-size: 12.5px;
      background: #14181f; border: 1px solid rgba(255,255,255,.14); border-radius: 9px; }
    .mem-snap-row .when { color: #f2f7ff !important; white-space: nowrap; font-weight: 600; }
    .mem-snap-row .why { color: #9fb0e8 !important; white-space: nowrap; }
    .mem-snap-row .prev { flex: 1; color: #c9d3e4 !important; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; cursor: pointer; }
    /* 展开全文时换行显示、不截断（用户实测：只给 120 字预览看不全） */
    .mem-snap-row .prev.open { white-space: pre-wrap; word-break: break-all; overflow: visible;
      max-height: 260px; overflow-y: auto; color: #eef4ff !important; }
    .tag-net { color: var(--net); font-weight: 600; }
    .tag-db { color: var(--db); font-weight: 600; }
    .tag-kb { color: var(--kb); font-weight: 600; }

    /* ---- 信息编辑视图（profile）---- */
    .profile-wrap { max-width: 860px; margin: 0 auto; padding: 30px 26px 60px; }
    .p-card { background: var(--panel-solid); border: 1px solid rgba(84,170,105,.3); border-radius: 16px;
              padding: 24px 28px; margin-bottom: 20px; box-shadow: 0 6px 22px rgba(0,0,0,.28); }
    .p-card h3 { margin: 0 0 16px; font-size: 15.5px; display: flex; align-items: center; gap: 8px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
    .form-grid .full { grid-column: 1 / -1; }
    .fg label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .fg .m-input, .fg textarea { width: 100%; }
    .m-input {
      padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(84,170,105,.35);
      background: rgba(255,255,255,.88); color: var(--text); font-size: 13.5px;
      outline: none; transition: border-color .25s, box-shadow .25s, background .25s; font-family: inherit;
    }
    .m-input:focus { border-color: rgba(84,170,105,.5); box-shadow: 0 0 0 3px rgba(84,170,105,.18); }
    select.m-input { color: var(--text); background: rgba(255,255,255,.92); }
    select.m-input option { color: #1d3a24; background: #ffffff; }
    textarea.ta { resize: vertical; line-height: 1.6; font-family: inherit;
      background: rgba(255,255,255,.88); color: var(--text);
      border: 1px solid rgba(84,170,105,.35); border-radius: 10px; padding: 10px 12px; outline: none;
      transition: border-color .25s, box-shadow .25s; }
    textarea.ta:focus { border-color: rgba(84,170,105,.5); box-shadow: 0 0 0 3px rgba(84,170,105,.18); }
    .save-row { margin-top: 18px; display: flex; justify-content: flex-end; gap: 10px; align-items: center; }
    .saved-tip { color: var(--net); font-size: 13px; }
    .list-edit-col { display:flex; flex-direction:column; background: rgba(245,197,66,.28); border:1px solid rgba(245,197,66,.45); border-radius:10px; padding:8px 10px; margin-bottom:10px; }
    .list-edit-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .list-edit-row .grow { flex: 1; }
    .add-form { border-top: 1px dashed rgba(124,192,137,.3); margin-top: 14px; padding-top: 14px; }
    .chk { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; cursor: pointer; }

    /* ---- 弹窗 ---- */
    .mask { position: fixed; inset: 0; z-index: 90; background: rgba(3,7,15,.66); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center; }
    .modal {
      width: min(520px, 92vw); max-height: 86vh; overflow-y: auto;
      background: var(--panel-solid); border: 1px solid var(--line); border-radius: 18px;
      padding: 26px 28px; box-shadow: 0 30px 80px rgba(0,0,0,.6);
    }
    .modal h2 { margin: 0 0 14px; font-size: 18px;
      background: linear-gradient(90deg,var(--accent),var(--accent2));
      -webkit-background-clip: text; background-clip: text; color: transparent; }
    .hint { color: var(--muted); font-size: 13px; line-height: 1.7; margin: 10px 0; }
    .row-add { display: flex; gap: 8px; align-items: center; }
    .row-add .m-input { flex: 1; }
    .mt8 { margin-top: 10px; }
    .modal-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; }
    .toast {
      position: fixed; bottom: 26px; right: 26px; z-index: 99;
      background: rgba(5,46,22,.95); border: 1px solid #166534; color: #bbf7d0;
      padding: 11px 18px; border-radius: 12px; font-size: 13px;
      box-shadow: 0 10px 30px rgba(0,0,0,.5); animation: slide-in .3s ease;
    }
    .toast.err { background: rgba(69,10,10,.95); border-color: #b91c1c; color: #fecaca; }


    /* ============================================================================
       015 号设计：表单「色块跟踪」体系（理念派生自 014 purple-slide-login）
       ---------------------------------------------------------------------------
       核心三条（与 014 同源，只是把「纵向滑落的紫带」改造成「横向滑过来的绿块」）：
         ① 一块跟踪色块：谁被悬停/聚焦，绿块就从左侧滑过来吞掉那一段（纯 CSS，零 JS）；
            机制同 014：色块是**负数 z-index 的伪元素**，会盖住宿主自己的背景
            （CSS 绘制顺序里 negative-z 子元素在元素背景之后绘制），所以输入框一旦透明化
            绿块就直接透出来——这就是「反相」的实现。
         ② 反相是唯一反馈语言：被跟踪时输入框让位给绿块、文字/下划线转墨色、硬投影收掉。
         ③ 表单面是「纸片」：墨色硬边 + 对角切角（左上/右下小圆角、右上/左下大圆角）+ 左侧实心硬边。
       配色（用户指定）：表单基色 #FFF81F ／ 跟踪色块 #88F529
       作用范围：个人信息表单、报告（Digest 订阅）、定制助手三处的表单卡片与「行」；
                 默认输入框组件（.m-input / textarea.ta）全局替换为 004 neon-shadow 的
                 **无包裹层版**（原组件靠 topline/underline 两个 span，这里改用 background-image
                 渐变做同一件事，不必给项目里 80+ 个输入框加 DOM）。
       ============================================================================ */
    :root {
      --form-base: #FFF81F;      /* 表单基色（淡黄） */
      --form-track: #88F529;     /* 跟踪色块（绿） */
      --form-ink: #111a06;       /* 黄/绿底上的墨色（与 #FFF81F 对比度 ≈ 16:1） */
      --form-ink-soft: rgba(17, 26, 6, .74);
      --form-paper: #FFFDF2;     /* 输入框纸面 */
    }

    /* ---------- ① 表单面：黄底 + 极淡斜纹 + 顶部高光 + 墨色硬边/对角切角 ---------- */
    .p-card, .cust-card, .sub-card {
      position: relative;
      background-color: var(--form-base);
      background-image:
        repeating-linear-gradient(135deg, rgba(17, 26, 6, .045) 0 2px, transparent 2px 9px),
        linear-gradient(180deg, #FFFBA6 0%, #FFF81F 46%, #FFEE55 100%);
      border: 2px solid var(--form-ink);
      border-radius: 4px 18px 4px 18px;
      box-shadow: -9px 0 0 0 var(--form-ink), -9px 6px 6px rgba(0, 0, 0, .18),
                  inset 0 2px 0 rgba(255, 255, 255, .5);
      color: var(--form-ink);
    }
    .p-card h3, .cust-card h3 { color: var(--form-ink); }
    /* 小标题前的绿色标签（黄底上的绿，呼应跟踪色） */
    .p-card h3::before, .cust-card h3::before {
      content: ""; width: 10px; height: 10px; border-radius: 2px;
      background: var(--form-track); border: 2px solid var(--form-ink);
      box-shadow: 2px 2px 0 0 var(--form-ink);
      flex: 0 0 auto;
    }
    /* 黄底上次级文字要加深，否则发灰看不清 */
    .cust-tip, .fg label, .list-edit-row + .add-form label, .p-card .muted, .cust-card .muted,
    .sub-card .muted, .p-card .hint, .cust-card .hint {
      color: var(--form-ink-soft);
    }
    /* 订阅卡的结构行在项目里**本来没有 CSS**（靠输入框默认 inline-block 偶然对齐）→ 顺手写实 */
    .sub-list { display: flex; flex-direction: column; }
    .sub-card { display: flex; gap: 12px; align-items: flex-start; }
    .sub-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 9px; }
    .sub-row1, .sub-row2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .sub-card .sub-ck { margin-top: 2px; }
    /* 「个人选购 / 公司竞品」由淡灰小字改成墨边小胶囊（黄底上才立得住） */
    .sub-scope {
      flex: 0 0 auto; padding: 4px 9px; border: 2px solid var(--form-ink); border-radius: 3px;
      background: var(--form-paper); color: var(--form-ink); font-weight: 700; font-size: 11.5px;
    }
    .sub-en { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--form-ink); }

    /* ---------- ② 跟踪色块：从左侧滑过来吞掉「你正在操作的那一段」 ---------- */
    .list-edit-row, .list-edit-col, .prov-row, .sub-card, .add-form .fg, .soul-switch {
      position: relative;
      isolation: isolate;
      border-radius: 8px;
    }
    .list-edit-row::before, .list-edit-col::before, .prov-row::before,
    .add-form .fg::before, .soul-switch::before {
      content: ""; position: absolute; inset: -5px; z-index: -1; border-radius: 8px;
      background: var(--form-track); box-shadow: inset 0 0 0 2px var(--form-ink);
      transform: scaleX(.02); transform-origin: left center; opacity: 0;
      transition: transform .30s cubic-bezier(.22, 1, .36, 1), opacity .18s ease;
    }
    /* 订阅卡的跟踪块沿用卡片的对角切角，避免绿块与纸片边缘错位 */
    .sub-card::before {
      content: ""; position: absolute; inset: -2px; z-index: -1; border-radius: 14px 4px 14px 4px;
      background: var(--form-track); box-shadow: inset 0 0 0 2px var(--form-ink);
      transform: scaleX(.02); transform-origin: left center; opacity: 0;
      transition: transform .34s cubic-bezier(.22, 1, .36, 1), opacity .2s ease;
    }
    .list-edit-row:hover::before, .list-edit-row:focus-within::before,
    .list-edit-col:hover::before, .list-edit-col:focus-within::before,
    .prov-row:hover::before, .prov-row:focus-within::before,
    .add-form .fg:hover::before, .add-form .fg:focus-within::before,
    .soul-switch:hover::before, .soul-switch:focus-within::before,
    .sub-card:hover::before, .sub-card:focus-within::before {
      transform: scaleX(1);
      opacity: 1;
    }

    /* ---------- ③ 反相：被跟踪时输入框让位给绿块，文字与下划线转墨色 ---------- */
    .list-edit-row:hover .m-input, .list-edit-row:focus-within .m-input,
    .list-edit-col:hover .m-input, .list-edit-col:focus-within .m-input,
    .prov-row:hover .m-input, .prov-row:focus-within .m-input,
    .add-form .fg:hover .m-input, .add-form .fg:focus-within .m-input,
    .soul-switch:hover .m-input, .soul-switch:focus-within .m-input,
    .sub-card:hover .m-input, .sub-card:focus-within .m-input {
      background-color: transparent;
      box-shadow: none;
      border-color: var(--form-ink);
      background-image: linear-gradient(var(--form-ink), var(--form-ink));
      background-size: 100% 3px;
      color: var(--form-ink);
    }
    .sub-card:hover select.m-input, .sub-card:focus-within select.m-input,
    .prov-row:hover select.m-input {
      background-image: linear-gradient(var(--form-ink), var(--form-ink)),
                        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23111a06' stroke-width='2.2' stroke-linecap='square'/></svg>");
    }
    .list-edit-row:hover .m-input::placeholder, .prov-row:hover .m-input::placeholder,
    .sub-card:hover .m-input::placeholder, .add-form .fg:hover .m-input::placeholder {
      color: rgba(17, 26, 6, .58);
    }

    /* ---------- ④ 默认输入框组件（004 neon-shadow 的无包裹层版） ---------- */
    .m-input, .fg .m-input, select.m-input, textarea.ta, textarea.m-input {
      border: 2px solid var(--form-ink);
      border-top: none;
      border-bottom: none;
      border-radius: 3px;
      padding: 8px 10px 9px;
      background-color: var(--form-paper);
      color: var(--form-ink);
      font-family: inherit;
      box-shadow: 3px 3px 0 0 var(--form-ink);
      background-image: linear-gradient(var(--form-track), var(--form-track));
      background-repeat: no-repeat;
      background-position: left bottom;
      background-size: 0% 3px;
      outline: none;
      transition: box-shadow .26s ease, background-size .45s cubic-bezier(.22, 1, .36, 1),
                  background-color .26s ease, border-color .26s ease, color .26s ease;
    }
    .m-input::placeholder, textarea.ta::placeholder { color: var(--form-ink-soft); }
    /* 聚焦：硬投影收掉（004 的标志性动作）+ 绿色下划线从左展开 */
    .m-input:focus, textarea.ta:focus {
      box-shadow: none;
      background-color: #FFFFFF;
      background-size: 100% 4px;
      border-color: var(--form-ink);
    }
    /* 下拉框：去掉原生外观换成墨色雪佛龙（否则 background-image 会吃掉原生箭头） */
    select.m-input {
      appearance: none; -webkit-appearance: none; padding-right: 30px;
      background-image: linear-gradient(var(--form-track), var(--form-track)),
                        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23111a06' stroke-width='2.2' stroke-linecap='square'/></svg>");
      background-repeat: no-repeat, no-repeat;
      background-position: left bottom, right 9px center;
      background-size: 0% 3px, 12px 8px;
    }
    select.m-input:focus { background-size: 100% 3px, 12px 8px; }
    select.m-input option { color: var(--form-ink); background: var(--form-paper); }
    /* 多行文本：块状元素保留上下描边（开口形态只适合单行输入） */
    textarea.ta, textarea.m-input {
      border-top: 2px solid var(--form-ink); border-bottom: 2px solid var(--form-ink);
    }

    /* ---------- ⑤ 表单内的按钮：同一套硬投影，悬停/按下时「压下去」 ---------- */
    .p-card .mini-btn, .cust-card .mini-btn, .sub-card .mini-btn {
      border: 2px solid var(--form-ink); border-radius: 3px;
      padding: 7px 12px; font-size: 12.5px; font-weight: 700;
      background: var(--form-paper); color: var(--form-ink);
      box-shadow: 3px 3px 0 0 var(--form-ink);
      transition: box-shadow .22s ease, transform .14s ease, background .22s ease, color .22s ease;
    }
    .p-card .mini-btn:hover, .cust-card .mini-btn:hover, .sub-card .mini-btn:hover {
      background: var(--form-ink); color: var(--form-base);
      transform: translate(2px, 2px); box-shadow: 1px 1px 0 0 var(--form-ink);
    }
    .p-card .mini-btn:active, .cust-card .mini-btn:active, .sub-card .mini-btn:active {
      transform: translate(3px, 3px); box-shadow: none;
    }
    /* 危险按钮：投影改红（黄底上仍看得清），悬停反相成红底黄字 */
    .p-card .mini-btn.danger, .p-card .mini-btn.del,
    .cust-card .mini-btn.del, .sub-card .mini-btn.del {
      border-color: #A8220F; color: #A8220F; box-shadow: 3px 3px 0 0 #A8220F;
    }
    .p-card .mini-btn.danger:hover, .p-card .mini-btn.del:hover,
    .cust-card .mini-btn.del:hover, .sub-card .mini-btn.del:hover {
      background: #A8220F; color: var(--form-base); box-shadow: 1px 1px 0 0 #A8220F;
    }
    /* 「使用中 / 启用」：绿色实心（跟踪色的静态用法） */
    .cust-card .mini-btn.act.on, .sub-card .mini-btn.act.on {
      background: var(--form-track); color: var(--form-ink); box-shadow: 3px 3px 0 0 var(--form-ink);
    }
    .p-card .del-x, .cust-card .del-x { color: var(--form-ink-soft); font-size: 17px; line-height: 1; }
    .p-card .del-x:hover, .cust-card .del-x:hover { color: #A8220F; }

    /* ---------- ⑥ 勾选标记跟着跟踪色 ---------- */
    .sub-card .brut-mark, .p-card .brut-mark { border-color: var(--form-ink); }
    .sub-card input:checked ~ .brut-mark, .p-card input:checked ~ .brut-mark {
      background: var(--form-track); border-color: var(--form-ink);
    }

    /* ---------- ⑦ 新增行/区域的虚线分隔：黄底上用墨色虚点更干净 ---------- */
    .add-form { border-top: 2px dashed rgba(17, 26, 6, .3); }
    .prov-row, .list-edit-row { row-gap: 10px; }
    .prov-row .m-input { min-width: 96px; }
    .prov-row .prov-key { min-width: 130px; }
    /* ★ 2026-09-30（用户实测反馈）：市面上 key/base_url 都很长，四个输入挤一行会让它们"看着被截断"✗。
       放开宽度并允许换行——注意：**这不是长度限制问题**，key 一直是整条保存的（无 maxlength、后端无切片）✓ */
    .prov-row .prov-name { max-width: 150px; }
    .prov-row .prov-model { flex: 1 1 170px; min-width: 150px; }
    .prov-row .prov-url { flex: 2 1 260px; min-width: 210px; }
    .prov-row .prov-key { flex: 2 1 300px; min-width: 240px; font-family: ui-monospace, Consolas, monospace; }
    .prov-row .key-eye { flex: 0 0 auto; }
  </style>
</head>
<body>
<div id="app">
  <!-- 全局提示条：必须放在 #app 根层、且在 login-wrap 的 v-if 之前（原来在 <template v-else> 里，登录页看不到 -> 注册成功提示消失；夹在 v-if 与 v-else 之间会编译报错） -->
    <div class="toast" v-if="toast" :class="{err: toastErr}">{{ toast }}</div>
  <!-- ============ 登录页 ============ -->
  <div class="login-wrap" v-if="!token">
    <div class="login-decor">
      <div class="float-emoji">🔍</div>
      <div class="float-emoji">📊</div>
      <div class="float-emoji">💡</div>
      <div class="float-emoji">🚀</div>
      <div class="float-emoji">📈</div>
      <div class="float-emoji">🎯</div>
      <div class="float-emoji">💬</div>
      <div class="float-emoji">✨</div>
      <div class="welcome-text">
        <div class="main">智选情报官</div>
        <div class="sub">本地 AI 情报助手 · 让信息为你所用</div>
      </div>
      <span class="kaomoji k1">(≧∇≦)ﾉ</span>
      <span class="kaomoji k2">♪(´▽｀)</span>
      <span class="kaomoji k3">ヾ(•ω•`)o</span>
      <span class="kaomoji k4">٩(◕‿◕｡)۶</span>
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
    </div>
        <!-- Typography Vortex 背景（Canvas 2D 复刻；threeui.com/text-animation/typography-vortex 的效果契约：
             预渲染环带 + 漂移字形 + 指针消散 + 粒子尘 + 点击吸入）—— 纯本地、零依赖 ✓ -->
        <canvas id="login-vortex" class="login-vortex" aria-hidden="true"></canvas>
    <div class="login-container" :class="authMode === 'register' ? 'auth-reg' : ''">
      <div class="login-card">
        <div class="login-title">
          <span class="login-text">登录</span>
        </div>
        <div class="login-form">
          <!-- 2026-09-16 收尾：登录卡与注册卡彻底分开。
               旧版是「输入不存在就直接注册」，错别字会静默建成账号（如「尼姑喵喵」）——已移除该逻辑。 -->
          <div class="auth-tabs">
            <button class="auth-tab" :class="{ on: authMode === 'login' }" @click="switchAuth('login')">登录</button>
            <button class="auth-tab" :class="{ on: authMode === 'register' }" @click="switchAuth('register')">注册</button>
          </div>

          <!-- ① 登录卡（只认已存在的账号） -->
          <template v-if="authMode === 'login'">
            <div class="field">
              <label>用户名</label>
              <div class="input-container">
                <input class="input" v-model="username" placeholder="如 alice / 你的账号" @keyup.enter="doLogin" />
              </div>
            </div>
            <div class="field">
              <label>密码</label>
              <div class="input-container">
                <input class="input" v-model="password" type="password" placeholder="密码" @keyup.enter="doLogin" />
              </div>
            </div>
            <button class="bubbles full" @click="doLogin" :disabled="busy"><span class="text">{{ busy ? '登录中…' : '登录' }}</span></button>
            <div class="err">{{ errMsg }}</div>
            <div class="auth-switch" v-if="notExist">
              <button class="link-btn" @click="goRegister">没有「{{ (username || '').trim() }}」这个账号？去注册 →</button>
            </div>
            <div class="auth-switch" v-else>
              <span>还没有账号？</span><button class="link-btn" @click="goRegister">注册新账号</button>
            </div>
          </template>

          <!-- ② 注册卡（要填确认密码 + 账号类型，且实时回显「即将创建」） -->
          <template v-if="authMode === 'register'">
            <div class="field">
              <label>用户名</label>
              <div class="input-container">
                <input class="input" v-model="username" placeholder="给自己起个账号名（别写错别字）" />
              </div>
            </div>
            <div class="field">
              <label>密码</label>
              <div class="input-container">
                <input class="input" v-model="password" type="password" placeholder="至少 6 位" />
              </div>
            </div>
            <div class="field">
              <label>确认密码</label>
              <div class="input-container">
                <input class="input" v-model="regPwd2" type="password" placeholder="再输一次" @keyup.enter="doRegister" />
              </div>
            </div>
            <div class="field">
              <label>账号类型</label>
              <div class="role-pick">
                <label :class="{ on: regRole === 'personal' }"><input type="radio" value="personal" v-model="regRole" /><span>个人账号</span></label>
                <label :class="{ on: regRole === 'company' }"><input type="radio" value="company" v-model="regRole" /><span>公司账号</span></label>
              </div>
            </div>
            <div class="reg-hint" :class="{ ready: regReady }">{{ regHint }}</div>
            <button class="bubbles full" @click="doRegister" :disabled="busy"><span class="text">{{ busy ? '创建中…' : '创建账号' }}</span></button>
            <div class="err">{{ errMsg }}</div>
            <div class="auth-switch"><span>已有账号？</span><button class="link-btn" @click="switchAuth('login')">去登录</button></div>
          </template>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 应用 ============ -->
  <template v-else>
    <div id="app-view">
      <div class="topbar">
        <span class="logo" @click="go('home')">智选情报官</span>
        <span class="mode">{{ role === 'company' ? '公司版' : '个人版' }}</span>
        <nav class="nav-tabs">
          <a class="nav-tab" :class="{active: view==='home'}" href="#/home">🏠 工作台</a>
          <a class="nav-tab" :class="{active: view==='profile'}" href="#/profile">{{ role === 'company' ? '🏢 公司信息' : '👤 个人信息' }}</a>
          <a class="nav-tab" :class="{active: view==='chat'}" href="#/chat">🤖 AI 助手</a>
          <a class="nav-tab" :class="{active: view==='kb'}" href="#/kb">📚 知识库</a>

          <a class="nav-tab" :class="{active: view==='reports'}" href="#/reports">📰 报告<span class="reddot" v-if="newReports">NEW</span></a>
          <a class="nav-tab" :class="{active: view==='customize'}" href="#/customize">🎛️ 定制助手</a>
          <a class="nav-tab" :class="{active: view==='skills'}" href="#/skills">🧩 技能与工具</a>
        </nav>
        <span class="spacer"></span>
        <span class="who">{{ username }}</span>
        <span class="link" @click="toggleBgPanel">🎨 背景</span>
        <span class="link" @click="doLogout">退出</span>
      </div>

      <!-- 背景设置面板（任务一+四）：图库选择 + 上传 + 删除 + 透明度 -->
      <div class="bg-panel" v-if="showBgPanel">
        <div class="bg-panel-head">🎨 背景设置</div>
        <label class="bg-upload">
          <input type="file" accept="image/*" @change="onBgUpload" style="display:none" />
          <span>📤 上传新背景图片</span>
        </label>
        <div class="bg-grid" v-if="bgImages.length">
          <div class="bg-cell" v-for="img in bgImages" :key="img.name"
               :class="{active: bgActive === img.url}">
            <img :src="img.url" @click="pickBg(img.url)" />
            <span class="bg-del" @click="delBg(img.name)" title="删除">×</span>
            <span class="bg-tick" v-if="bgActive === img.url">✓</span>
          </div>
        </div>
        <div class="bg-row">
          <span>透明度</span>
          <input type="range" min="5" max="100" v-model.number="bgOpacity" @input="applyBg" />

<script>
const { createApp, ref, reactive, computed, nextTick, onMounted, watch } = Vue;

createApp({
  setup() {
    // ---------- 桌面版适配（P0）----------
    // 桌面外壳加载页面时带 ?desktop=1。**用 URL 判断而不是 window.pywebview**：
    // URL 在 setup 阶段同步可读，而 pywebview 是页面加载后才异步注入的（时序坑）。
    const IS_DESKTOP = /[?&]desktop=1/.test(location.search);
    // 桌面版用 localStorage（关窗后登录态还在）；网页版保持原样用 sessionStorage（行为不变）
    const _store = (() => {
      try { return IS_DESKTOP ? window.localStorage : window.sessionStorage; }
      catch (e) { return window.sessionStorage; }
    })();
    const _USES_LOCAL_STORAGE = IS_DESKTOP;
    function storeGet(k) { try { return _store.getItem(k) || ''; } catch (e) { return ''; } }
    function storeSet(k, v) { try { _store.setItem(k, v); } catch (e) {} }
    function storeClear() { try { _store.clear(); } catch (e) {} }
    // 取原生能力：浏览器里返回 null，调用处一律 if (api && ...) 兜底
    function desktopApi() {
      return (IS_DESKTOP && window.pywebview && window.pywebview.api) ? window.pywebview.api : null;
    }

    // ★ 统一的「把某个 URL 保存成文件」入口（全站导出/下载都走它）
    //   桌面版：fetch 回字节 → base64 → 原生「另存为」（**WebView2 不支持浏览器式下载，
    //           直接给 <a href> 会静默丢弃，文件哪都找不到** —— 实测踩过）
    //   网页版：<a download> 触发浏览器下载（不再用 location.href，避免整页跳转）
    async function saveFromUrl(fileUrl, filename) {
      const api = desktopApi();
      if (api && api.save_binary_b64) {
        const resp = await fetch(fileUrl);
        if (!resp.ok) {
          const msg = '取回文件失败：HTTP ' + resp.status;
          showToast(msg, true);
          return { ok: false, error: msg, native: true };
        }
        const buf = new Uint8Array(await resp.arrayBuffer());
        let bin = ''; const CH = 0x8000;   // 分块拼接，避免超长参数一次性 apply 爆栈
        for (let i = 0; i < buf.length; i += CH) bin += String.fromCharCode.apply(null, buf.subarray(i, i + CH));
        const res = await api.save_binary_b64(filename || '导出.md', btoa(bin));
        if (res && res.ok) { showToast('已保存到：' + res.path); return { ok: true, path: res.path, native: true }; }
        if (res && res.cancelled) { return { ok: false, cancelled: true, native: true }; }   // 用户取消，不打扰
        const emsg = (res && res.error) || '未知错误';
        showToast('保存失败：' + emsg, true);
        return { ok: false, error: emsg, native: true };
      }
      const a = document.createElement('a');
      a.href = fileUrl;
      if (filename) a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      showToast('已开始下载：' + (filename || '文件'));
      return { ok: true, native: false };
    }

    // 从下载 URL 里取文件名（后端给的 download_md/download_pdf 带 ?name=xxx）
    function nameFromUrl(fileUrl, fallback) {
      try {
        const m = /[?&]name=([^&]+)/.exec(fileUrl || '');
        if (m) return decodeURIComponent(m[1]);
      } catch (e) {}
      return fallback || '导出.md';
    }

    // 桌面版：把「正在忙什么」写到托盘提示（空串=回到空闲）。网页版是空操作。
    // 用途：周报要生成几十秒~几分钟，用户多半已把窗口收进托盘/最小化——托盘上能看到进度，
    // 就不用盯着窗口猜"它到底在干活吗"。
    function desktopStatus(text) {
      const api = desktopApi();
      if (api && api.set_status) { try { api.set_status(text || ''); } catch (e) {} }
    }

    // ★ 登录态失效处理（2026-09-23 用户报障修）：清掉本地登录态、回登录页并说明原因。
    //   背景：token 存在 localStorage（桌面版「记住登录」），但后端重启会让旧 token 失效。
    //   老代码只判"token 非空"就渲染工作台，各接口 401 又被静默吞掉（loadMyData 里
    //   `if (!r.ok) return;`）→ 用户看到「已登录、但兴趣/关注/收藏全是 0、天气卡报未登录或登录已失效」。
    //   注意：只清**鉴权相关的键**，不要 storeClear()——那会把背景图等偏好一起清掉。
    function forceLogout(msg) {
      try {
        ['zx_token', 'zx_user', 'zx_role'].forEach(k => _store.removeItem(k));
      } catch (e) {}
      if (ws) { try { ws.close(); } catch (e) {} wsTarget = ''; }
      token.value = ''; username.value = ''; password.value = '';
      resetPriceState();            // ★ 注销：清掉上一个账号的价格缓存
      errMsg.value = msg || '';
      authMode.value = 'login';
      if (msg) showToast(msg, true);
    }

    // 启动时验一次登录态：只有后端认这个 token，才算真登录（返回 true=有效）
    async function verifySession() {
      try {
        const r = await fetch('/api/me/overview?token=' + encodeURIComponent(token.value));
        if (r.status === 401) { forceLogout('登录已失效，请重新登录'); return false; }
        return r.ok;
      } catch (e) {
        return true;   // 网络抖动不当作失效，避免把能用的登录态误踢掉
      }
    }

    const token = ref(storeGet('zx_token'));
    const username = ref(storeGet('zx_user'));
    const role = ref(storeGet('zx_role') || 'personal');
    const regRole = ref('personal');
    const password = ref('');
    const errMsg = ref('');
    const busy = ref(false);
    const _initHash = location.hash.replace('#/', '') || 'home';   // #/shell 直达 CLI 面板
    const view = ref(_initHash === 'shell' ? 'skills' : _initHash);

    const messages = ref([]);
    const sessions = ref([]);         // M1 会话列表 [{thread_id,title,message_count,updated_at}]
    const activeThread = ref('');     // M1 当前会话 thread_id（空=旧版直接发问，自动归档）
    const monitor = ref([]);
    const thinkingText = ref('');
    const showBgPanel = ref(false);   // 背景设置面板
    const bgOpacity = ref(60);        // 背景图透明度（5-100）
    const bgImages = ref([]);         // 图库列表 [{name,url}]
    const bgActive = ref('');         // 当前选中的背景图 url
    // 定制助手
    const providers = ref([]);        // 模型配置列表
    const newProv = ref({ provider_name: '', model_name: '', base_url: '', api_key: '', is_active: false });
    const soulContent = ref('');      // 当前人格内容
    const soulReq = ref('');          // 人格生成需求输入
    const soulGenOut = ref('');       // 生成结果预览
    const soulGenning = ref(false);
    const soulSaved = ref(false);
    const soulList = ref([]);         // 人格列表 [{name,file,active}]
    const soulActive = ref('SOUL.md');// 当前激活人格文件
    const newSoulName = ref('');      // 新建人格名
    // 记忆画像 MEMORY.md
    const memoryContent = ref('');
    // M3-7：建议/历史（ref 必须出现在 setup 的 return 里，否则模板静默失效）
    const memSuggestions = ref([]);
    const memSnapshots = ref([]);
    const memBusy = ref(false);
    const memProtectManual = ref(true);      // D8 默认：保护人工行
    const memEvidence = ref('');
    const memSkipped = ref('');
    const memChanged = ref(false);
    const memCheckedCount = computed(function () {
      return memSuggestions.value.filter(function (s) { return s.checked; }).length;
    });
    const memoryInitialized = ref(false);
    const memorySaved = ref(false);
    const memoryGenning = ref(false);
    // 语音包（音色克隆）
    const voicePacks = ref([]);
    const voiceAvailable = ref(true);
    const voiceBusy = ref(false);
    const newVoicePack = ref({ name: '', refText: '' });
    const voiceFile = ref(null);
    const voiceFileInput = ref(null);
    // M3 知识库
    const kbStatus = ref(null);        // {exists, doc_count, docs}
    const kbBusy = ref(false);
    // 通用入库预览弹窗（M3 三条路共用：粘贴 / 上传 / 导出）
    const kbIngestShow = ref(false);
    const kbIngestCtx = ref({});        // {title, source_kind, source_kind_label, content, title_input, title_editable, apply_clean_default, is_binary_upload}
    const kbIngestTitle = ref('');      // 仅 title_editable 时可改
    const kbIngestRaw = ref('');         // 原文（评估后才知道是否清洗）
    const kbEvalDone = ref(false);
    const kbEval = ref({});
    const kbUseClean = ref(true);
    const kbFileInput = ref(null);
    const kbQueryText = ref('');
    const kbQueryHits = ref([]);
    // 旧 kbExportCandidate/kbExportShow 留作 v1 退路（实际改走 kbIngestOpenWith）
    const draft = ref('');
    const loading = ref(false);
    const stopping = ref(false);   // 已点「中断」，等后端在下一个检查点停下
    let chatAbort = null;          // 当前 /api/chat 的 AbortController（中断兜底用）
    const exporting = ref(false);
    const scroll = ref(null);
    const toast = ref(''); const toastErr = ref(false);

    // 用户数据
    const emptyMy = () => ({ competitors: [], products: [], interests: [], watchlist: [], collection: [], setup_done: true });
    const myData = ref(emptyMy());
    const prof = reactive({ company_name:'', intro:'', legal_rep:'', reg_capital:'', founded_date:'',

    const showOnboard = ref(false);

    const newInterest = ref({ tag:'', description:'', keywords:'' });
    const newWatch = reactive({ brand:'', product:'', note:'', category:'', price:null, _specs:'', _note2:'' });
    const newComp = reactive({ comp_name:'', website:'', note:'' });
    const batchModal = reactive({ show: false, type: 'competitors', text: '' });
    const newProd = reactive({ product_name:'', category:'', price:null, _description:'', _features:'', _target:'' });

    let ws = null;

    const displayName = computed(() => role.value === 'company' ? (prof.company_name || username.value) : username.value);
    const greeting = computed(() => {
      const h = new Date().getHours();
      return h < 6 ? '夜深了' : h < 12 ? '早上好' : h < 14 ? '中午好' : h < 18 ? '下午好' : '晚上好';
    });
    const profileFilled = computed(() => Object.entries(prof).filter(([k,v]) => k !== 'honorsText' && v).length + (prof.honorsText ? 1 : 0));

    const examples = computed(() => role.value === 'company'
      ? ['对比我们公司与主要竞品在定价和功能上的差异，标注来源',
         '分析我们所在行业的竞争格局，找出我们的差异化机会',
         '结合我们的产品定位，给出下季度的差异化竞争建议']
      : ['帮我看看我关注的产品最近有没有降价或新品发布',
         '我的兴趣领域最近有什么新动态或降价？',
         '根据我的收藏，哪款最值得入手？']);

    // ---------- 情报面板 ----------
    const kbPercent = computed(() => {
      const c = kbStatus.value ? kbStatus.value.doc_count : 0;
      return Math.min(Math.round((c / 100) * 100), 100);

    const activityTrend = computed(() => {
      const days = ['日', '一', '二', '三', '四', '五', '六'];
      const today = new Date().getDay();
      return Array.from({ length: 7 }, (_, i) => {
        const d = (today - 6 + i + 7) % 7;
        return { lbl: days[d], h: 20 + Math.random() * 60 + (i > 4 ? 15 : 0) };
      });
    });
    const recentActivity = computed(() => {
      const out = [];
      if (kbStatus.value && kbStatus.value.doc_count > 0) {
        out.push({ text: `知识库已有 ${kbStatus.value.doc_count} 篇文档`, time: '刚刚', cls: 'kb' });
      }
      if (subs.value.length > 0) {
        out.push({ text: `${subs.value.length} 个订阅运行中`, time: '今天', cls: 'report' });
      }
      if (messages.value.length > 0) {
        out.push({ text: `本次会话 ${messages.value.length} 条对话`, time: '本次', cls: '' });
      }
      return out.slice(0, 4);
    });

    // ---------- M4 报告/订阅状态 ----------
    const reports = ref([]);
    const subs = ref([]);
    const newReports = ref(0);
    const digestRunning = ref(false);
    const newSubName = ref('');
    const newSubScope = ref('personal');
    const newSubLang = ref('zh');
    const selCount = computed(() => subs.value.filter(s => s._sel && s.enabled).length);

    async function loadReports() {
      try {
        const r = await fetch('/api/reports?token=' + encodeURIComponent(token.value));
        if (r.ok) { reports.value = (await r.json()).items || []; }
      } catch (e) {}
    }
    async function loadSubs() {
      try {
        const r = await fetch('/api/digest/subs?token=' + encodeURIComponent(token.value));
        if (r.ok) {
          const arr = (await r.json()).subs || [];
          subs.value = arr.map(s => ({
            ...s,
            _kws: (() => { try { return JSON.parse(s.keywords || '[]').join(', '); } catch (e) { return ''; } })(),
            _name: s.name || '',
            lang: s.lang || 'zh',
            enabled: !!s.enabled,
            _sel: !!s.enabled,
          }));
        }
      } catch (e) {}
    }
    async function updateSub(s) {
      const kws = s._kws.split(/[,，]/).map(x => x.trim()).filter(Boolean).slice(0, 8);
      const r = await fetch('/api/digest/subs/' + s.id + '?token=' + encodeURIComponent(token.value), {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },

    // ---------- 简报渲染 ----------
    function splitSections(text) {
      if (!text) return [];
      const re = /(①|②|③|④|⑤|^#{1,3}\s*[^\n]+)/gm;
      const marks = []; let m;
      while ((m = re.exec(text)) !== null) marks.push({ idx: m.index, title: m[0].trim() });
      if (marks.length === 0) return [{ title: '内容', body: text }];
      const secs = [];
      if (marks[0].idx > 0) { const intro = text.slice(0, marks[0].idx).trim(); if (intro) secs.push({ title: '概述', body: intro }); }
      for (let i = 0; i < marks.length; i++) {
        const start = marks[i].idx + marks[i].title.length;
        const end = i + 1 < marks.length ? marks[i + 1].idx : text.length;
        secs.push({ title: marks[i].title.replace(/^#+\s*/, ''), body: text.slice(start, end).trim() });
      }
      return secs;
    }
    function renderRich(text) {
      if (!text) return '';
      let h = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      h = h.replace(/🔍\s*网络/g,'<span class="tag-net">🔍网络</span>')
           .replace(/🗄️?\s*数据库/g,'<span class="tag-db">🗄️数据库</span>')
           .replace(/📚\s*知识库/g,'<span class="tag-kb">📚知识库</span>')
           .replace(/🗄️?\s*个人库/g,'<span class="tag-db">🗄️个人库</span>');
      const lines = h.split('\n'); let out = [], inTable = false;
      for (let ln of lines) {
        const tline = ln.trim();
        if (tline.startsWith('|') && tline.endsWith('|')) {
          if (/^\|[\s:\-|]+\|$/.test(tline)) continue;
          if (!inTable) { out.push('<table class="mdt">'); inTable = true; }
          out.push('<tr>' + tline.split('|').slice(1, -1).map(c => `<td>${c.trim()}</td>`).join('') + '</tr>');
        } else {
          if (inTable) { out.push('</table>'); inTable = false; }
          out.push(ln);
        }
      }
      if (inTable) out.push('</table>');
      return out.join('\n').replace(/\n/g, '<br/>');
    }

      return r.json();

    let wsTarget = '';  // 当前 WS 连接的 thread_id（用于会话切换时判断是否需要重连）
    function connectWS(threadId) {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const target = threadId || username.value;  // 缺省=username（v1.0 兼容：直发走用户会话）
      if (ws && wsTarget === target && ws.readyState === WebSocket.OPEN) return;  // 已连对目标
      if (ws) { try { ws.close(); } catch (e) {} }
      wsTarget = target;
      ws = new WebSocket(`${proto}://${location.host}/ws/${encodeURIComponent(target)}`);
      ws.onmessage = (ev) => {
        try {
          const p = JSON.parse(ev.data);
          if (p.type === 'monitor_event') {
            // ★ v3.1 流式：正文/思考的逐段增量（先分流，别落进下面的进度列表 ✓）
            if (p.event === 'delta') { applyStreamDelta(p.data || {}); return; }
            if (p.event === 'tool_start') scheduleUsageRefresh();   // M4-5：工具一开跑就安排刷新
            if (p.event === 'thinking') {
              // 思考过程：追加到独立折叠区（小字灰色），不刷监控列表
              thinkingText.value += (p.data && p.data.text) || '';
              return;
            }
            const cls = p.event === 'tool_start' ? 'tool' : p.event === 'assistant_call' ? 'assistant' : p.event === 'task_result' ? 'task' : '';
            monitor.value.unshift({ time: nowStr(), msg: p.message, cls });
            if (monitor.value.length > 60) monitor.value.pop();
            if (p.event === 'report_ready') {
              newReports.value++; showToast(p.message); loadReports();
              desktopStatus('');            // 托盘进度收回空闲（定时/手动生成完成都走这里）

              const _api = desktopApi();

          }
        } catch (e) {}

    async function doLogin() {

        // 这里**只提示，绝不自动注册**——旧版就是在这里自动建号，错别字会静默变成账号。
        if (r.status === 404) {
          notExist.value = true;

          return;

        if (!r.ok) { errMsg.value = data.detail || '登录失败'; return; }
        token.value = data.token; role.value = data.account.role;

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智选情报官</title>
  <script src="/front/vendor/vue.global.prod.js"></script>
  <style>
    :root {
      /* 浅绿 70% / 白 20% / 黄 10% 色系（明亮工作台风格） */
      --bg0: #eef7ef; --bg1: #e2f0e4;
      --panel: rgba(255, 255, 255, .82); --panel-solid: #ffffff;
      --panel2: rgba(240, 248, 241, .9); --line: rgba(84, 170, 105, .28);
      --accent: #54aa69; --accent2: #7cc089;
      --text: #1d3a24; --muted: #5d7a64;
      --net: #3f9e5c; --db: #67b26f; --kb: #f5c542; --warn: #e0653f;
      --shadow: 0 8px 26px rgba(45, 110, 60, .12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      color: var(--text); height: 100vh; overflow: hidden;
      background:
        radial-gradient(1100px 500px at 85% -10%, rgba(245,197,66,.22), transparent 60%),
        radial-gradient(900px 480px at -10% 110%, rgba(84,170,105,.16), transparent 60%),
        linear-gradient(160deg, var(--bg1), var(--bg0));
      background-attachment: fixed;
    }
    /* 用户自定义背景图（任务4）：默认无，导入后覆盖在渐变之上，透明度可调 */
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1;
      background-image: var(--user-bg, none);
      background-size: cover; background-position: center; background-repeat: no-repeat;
      opacity: var(--bg-opacity, .6); pointer-events: none;
      transition: opacity .3s;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.25); border-radius: 8px; }

    /* ================= 登录页（007 brutalist-login 适配） ================= */
    .login-wrap { height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    /* 背景装饰层 */
    .login-decor { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .login-decor .float-emoji {
      position: absolute; font-size: 40px; opacity: .18;
      animation: floatUp 12s ease-in-out infinite;
    }
    .login-decor .float-emoji:nth-child(1) { left: 8%; bottom: -50px; animation-delay: 0s; font-size: 50px; }
    .login-decor .float-emoji:nth-child(2) { left: 18%; bottom: -50px; animation-delay: 2s; font-size: 35px; }
    .login-decor .float-emoji:nth-child(3) { left: 30%; bottom: -50px; animation-delay: 4s; font-size: 45px; }
    .login-decor .float-emoji:nth-child(4) { left: 45%; bottom: -50px; animation-delay: 1s; font-size: 38px; }
    .login-decor .float-emoji:nth-child(5) { left: 58%; bottom: -50px; animation-delay: 3s; font-size: 42px; }
    .login-decor .float-emoji:nth-child(6) { left: 70%; bottom: -50px; animation-delay: 5s; font-size: 36px; }
    .login-decor .float-emoji:nth-child(7) { left: 82%; bottom: -50px; animation-delay: 2.5s; font-size: 48px; }
    .login-decor .float-emoji:nth-child(8) { left: 92%; bottom: -50px; animation-delay: 4.5s; font-size: 32px; }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      10% { opacity: .18; }
      90% { opacity: .18; }
      100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
    }
    .login-decor .welcome-text {
      position: absolute; top: 12%; left: 50%; transform: translateX(-50%);
      text-align: center; color: var(--text);
    }
    .login-decor .welcome-text .main {
      font-size: 28px; font-weight: 800; letter-spacing: 2px;
      background: linear-gradient(90deg, var(--accent), #f5c542);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .login-decor .welcome-text .sub {
      font-size: 14px; color: var(--muted); margin-top: 8px; letter-spacing: 1px;
    }
    .login-decor .kaomoji { position: absolute; font-size: 24px; color: var(--muted); opacity: .6; }
    .login-decor .kaomoji.k1 { top: 22%; left: 15%; }
    .login-decor .kaomoji.k2 { top: 35%; right: 12%; font-size: 20px; }
    .login-decor .kaomoji.k3 { bottom: 25%; left: 20%; font-size: 22px; }
    .login-decor .kaomoji.k4 { bottom: 18%; right: 18%; font-size: 26px; }
    /* SVG 装饰圆环 */
    .login-decor .ring {
      position: absolute; border-radius: 50%; border: 2px solid rgba(84,170,105,.12);
      animation: ringPulse 8s ease-in-out infinite;
    }
    .login-decor .ring:nth-child(7) { width: 300px; height: 300px; top: -80px; right: -80px; animation-delay: 0s; }
    .login-decor .ring:nth-child(8) { width: 200px; height: 200px; bottom: -60px; left: -60px; animation-delay: 2s; }
    .login-decor .ring:nth-child(9) { width: 150px; height: 150px; top: 40%; right: 8%; animation-delay: 4s; border-color: rgba(245,197,66,.15); }
    @keyframes ringPulse {
      0%, 100% { transform: scale(1); opacity: .5; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    /* 卡片容器 */
    /* ★ 登录页背景（Typography Vortex 复刻）：铺满、位于卡片之下；卡片是 z-index:1 → 点击照常落在卡片上 ✓ */
    .login-vortex { position: fixed; inset: 0; width: 100%; height: 100%; display: block;
      z-index: 0; pointer-events: auto; }
    /* 底色由 CSS 兜：canvas 未挂载/降级时也不会白屏 ✓ */
    .login-page { background: radial-gradient(120% 90% at 50% 40%, #121821 0%, #0b0f14 60%, #080b0f 100%); }
        .login-container { position: relative; perspective: 1000px; width: 380px; z-index: 1; }
    /* 悬浮热区：收起时=卡片本身（80px），展开后=展开足迹（380px）。
       卡片 height 是带动画生长的，若热区跟着卡片走，鼠标下移快于生长速度就会掉 hover → 卡片缩回，
       够不到表单。热区改成「瞬时到位」（无过渡）+ 由容器承载，鼠标就能安全下移。 */
    .login-container::after {
      content: ""; position: absolute; left: -14px; right: -14px; top: 0; height: 80px; z-index: -1;
    }
    .login-container:hover::after { height: 460px; }
    /* 注册卡字段更多，展开足迹要更高（两张卡共用同一元素，用容器类区分高度） */
    .login-container.auth-reg::after { height: 580px; }
    .login-container.auth-reg:hover .login-card,
    .login-container.auth-reg .login-card:hover { height: 580px; }
    .login-container:hover .login-card {
      height: 460px;
      transform: translateZ(20px) rotateX(3deg) rotateY(-3deg);
      box-shadow: 0 20px 60px rgba(84,170,105,.25), 0 8px 24px rgba(0,0,0,.12);
      border-color: var(--accent);
    }
    .login-container:hover .login-text { opacity: 0; transform: translateY(-20px) scale(.8); }
    .login-container:hover .login-form { opacity: 1; transform: translateY(0) scale(1); }
    .login-card {
      position: relative; width: 100%; height: 80px;
      background: linear-gradient(135deg, #fefefe, #f0f8f0);
      border: 2px solid rgba(84,170,105,.3); border-radius: 16px;
      box-shadow: 0 8px 32px rgba(84,170,105,.15), 0 2px 8px rgba(0,0,0,.08);
      cursor: pointer; overflow: hidden;
      transition: all .5s cubic-bezier(.68,-.55,.265,1.55);
    }
    .login-card:hover {
      height: 460px;
      transform: translateZ(20px) rotateX(3deg) rotateY(-3deg);
      box-shadow: 0 20px 60px rgba(84,170,105,.25), 0 8px 24px rgba(0,0,0,.12);
      border-color: var(--accent);
    }
    /* 登录 / 注册 两个 tab（卡片顶部） */
    .auth-tabs { display: flex; gap: 8px; width: 100%; margin-bottom: 18px; }
    .auth-tab {
      flex: 1; padding: 8px 0; border-radius: 10px; cursor: pointer;
      font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: 1px;
      border: 2px solid rgba(84,170,105,.25); background: rgba(255,255,255,.7);
      color: var(--muted); transition: all .25s;
    }
    .auth-tab:hover { border-color: var(--accent); color: var(--text); }
    .auth-tab.on { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 4px 14px rgba(84,170,105,.35); }
    .auth-switch {
      display: flex; gap: 6px; align-items: center; justify-content: center; flex-wrap: wrap;
      font-size: 12.5px; color: var(--muted); margin-top: 12px;
    }
    .auth-switch .link-btn {
      background: none; border: none; padding: 0; cursor: pointer;
      font-family: inherit; font-size: 12.5px; font-weight: 600; color: var(--accent);
      text-decoration: underline; text-underline-offset: 3px;
    }
    .auth-switch .link-btn:hover { color: #3d8a52; }
    /* 注册卡的「即将创建」实时回显（专治错别字账号） */
    .reg-hint { width: 100%; font-size: 12px; color: var(--muted); margin: -6px 0 12px; min-height: 17px; line-height: 1.4; }
    .reg-hint.ready { color: var(--accent); font-weight: 600; }
    .role-pick label.on { border-color: var(--accent); color: var(--text); background: rgba(84,170,105,.12); }
    .login-title {
      position: absolute; top: 0; left: 0; width: 100%; height: 80px;
      display: flex; align-items: center; justify-content: center;
      background: inherit; transition: all .4s ease;
    }
    .login-text {
      color: var(--accent); font-weight: 700; font-size: 18px;
      letter-spacing: 4px; text-transform: uppercase;
      transition: all .4s ease;
    }
    .login-card:hover .login-text { opacity: 0; transform: translateY(-20px) scale(.8); }
    .login-form {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 30px 40px; box-sizing: border-box;
      opacity: 0; transform: translateY(20px) scale(.95);
      transition: all .5s cubic-bezier(.175,.885,.32,1.275);
    }
    .login-card:hover .login-form { opacity: 1; transform: translateY(0) scale(1); }
    .field { position: relative; width: 100%; margin-bottom: 16px; }
    .field > label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; letter-spacing: 1px; font-weight: 600; }
    .input-container { position: relative; }
    .login-card .input {
      width: 100%; padding: 10px 14px; height: 42px;
      border: 2px solid rgba(84,170,105,.3); border-radius: 10px;
      font-size: 14px; font-family: inherit; background: rgba(255,255,255,.85); color: var(--text);
      outline: none; box-shadow: 0 2px 8px rgba(0,0,0,.04); transition: all .3s;
    }
    .login-card .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(84,170,105,.15); }
    .login-card .input::placeholder { color: #999; }
    .role-pick { display: flex; gap: 10px; }
    .role-pick label {
      flex: 1; text-align: center; padding: 8px 0; border-radius: 8px; cursor: pointer;
      border: 2px solid rgba(84,170,105,.25); color: var(--muted);
      transition: all .25s; background: rgba(255,255,255,.7);
      font-size: 13px;
    }
    .role-pick input { display: none; }
    .role-pick label:hover { border-color: var(--accent); color: var(--text); }
    .role-pick input:checked + span { color: var(--accent); font-weight: 700; }
    .role-pick label:has(input:checked) {
      background: rgba(84,170,105,.1); border-color: var(--accent);
    }
    .login-card .bubbles { --c1: #fff; --c2: var(--accent); --size-letter: 14px; padding: .7em 1em; }
    .login-card .bubbles > .text { color: var(--accent); }
    .login-card .bubbles:hover > .text { color: #fff; }
    .err { color: var(--warn); font-size: 13px; margin-top: 10px; min-height: 18px; }
    /* 卡片顶部渐变条 */
    .login-card::before {
      content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
      background: linear-gradient(90deg, var(--accent), #f5c542, var(--accent));
      background-size: 200% 100%; animation: gradientSlide 3s ease infinite;
    }
    @keyframes gradientSlide {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    /* 卡片底部装饰 */
    .login-card::after {
      content: ""; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0; transition: opacity .4s;
    }
    .login-card:hover::after { opacity: .5; }
    .bubbles {
      --c1: #1d3a24; --c2: #54aa69; --size-letter: 15px;
      padding: .7em 1em; font-size: var(--size-letter); font-family: inherit;
      background-color: transparent; border: calc(var(--size-letter) / 6) solid var(--c2);
      border-radius: .35em; cursor: pointer; overflow: hidden; position: relative;
      transition: 300ms cubic-bezier(.83, 0, .17, 1);
    }
    .bubbles.full { width: 100%; }
    .bubbles > .text { font-weight: 700; color: var(--c2); position: relative; z-index: 1; transition: color 700ms cubic-bezier(.83,0,.17,1); }
    .bubbles::before { top: 0; left: 0; } .bubbles::after { top: 100%; left: 100%; }
    .bubbles::before, .bubbles::after {
      content: ""; width: 150%; aspect-ratio: 1/1; scale: 0;
      transition: 1000ms cubic-bezier(.76, 0, .24, 1);
      background-color: var(--c2); border-radius: 50%;
      position: absolute; translate: -50% -50%;
    }
    .bubbles:hover > .text { color: var(--c1); }
    .bubbles:hover::before, .bubbles:hover::after { scale: 1; }
    .bubbles:active { scale: .98; filter: brightness(.9); }
    .bubbles:disabled { opacity: .55; cursor: not-allowed; filter: grayscale(.4); }
    .login-card .bubbles { --c1: #f5c542; --c2: #1a1a1a; }
    .login-card .bubbles > .text { color: #f5c542; }
    .login-card .bubbles:hover > .text { color: #f5c542; }
    /* ================= 006 下载按钮（快报下载） ================= */
    .dl-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 50px; cursor: pointer;
      border: 2px solid var(--accent); background: transparent;
      color: var(--accent); font-size: 13px; font-weight: 600;
      position: relative; overflow: hidden;
      transition: all .4s ease;
      text-decoration: none;
      font-family: inherit;            /* ↓ 三行：让 <button> 版和原来的 <a> 版长得一模一样 */
      appearance: none; -webkit-appearance: none;
      line-height: 1.2;
    }
    .dl-btn::before {
      content: ""; position: absolute; inset: 0;
      background: var(--accent); border-radius: 50%;
      transform: scale(0); transition: transform .4s ease;
    }
    .dl-btn:hover::before { transform: scale(1); }
    .dl-btn:hover { color: #fff; box-shadow: 0 0 12px rgba(84,170,105,.4); }
    .dl-btn .dl-text { position: relative; z-index: 1; }
    .dl-btn .dl-icon {
      width: 18px; height: 18px; position: relative; z-index: 1;
      transition: transform .4s ease;
    }
    .dl-btn:hover .dl-icon { transform: translateY(2px); }
    .dl-btn .dl-circle {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      width: 22px; height: 22px; border-radius: 50%;
      background: rgba(84,170,105,.15);
      animation: dlPulse 2s infinite;
    }
    @keyframes dlPulse {
      0% { box-shadow: 0 0 0 0 rgba(84,170,105,.4); }
      70% { box-shadow: 0 0 0 8px rgba(84,170,105,0); }
      100% { box-shadow: 0 0 0 0 rgba(84,170,105,0); }
    }

    /* ================= 008 Brutalist 勾选框 ================= */
    .brut-chk {
      display: inline-flex; align-items: center; cursor: pointer;
      user-select: none; position: relative;
      width: 1.4em; height: 1.4em; font-size: 16px;
    }
    .brut-chk input {
      position: absolute; opacity: 0; cursor: pointer; width: 0; height: 0;
    }
    .brut-chk .brut-mark {
      position: absolute; top: 0; left: 0;
      height: 1.4em; width: 1.4em;
      background-color: #fdfcf0;
      border: 3px solid #1a1a1a;
      border-radius: 8% 92% 12% 88% / 87% 11% 89% 13%;
      box-shadow: 4px 4px 0 #1a1a1a;
      transition: transform .2s cubic-bezier(.175,.885,.32,1.275), box-shadow .2s, background-color .2s;
    }
    .brut-chk:hover .brut-mark {
      transform: scale(1.05) rotate(2deg);
    }
    .brut-chk input:checked ~ .brut-mark {
      background-color: #54aa69;
      border-radius: 92% 8% 88% 12% / 11% 87% 13% 89%;
      transform: scale(1.1) rotate(-2deg);
    }
    .brut-chk .brut-mark::after {
      content: ""; position: absolute; display: none;
      left: 0.32em; top: 0.06em;
      width: 0.28em; height: 0.65em;
      border: solid #1a1a1a; border-width: 0 0.22em 0.22em 0;
      border-radius: 2px;
      transform: rotate(40deg);
    }
    .brut-chk input:checked ~ .brut-mark::after {
      display: block; animation: brutSplash .3s forwards;
    }
    .brut-chk:active .brut-mark {
      transform: scale(.9) translateY(3px);
      box-shadow: 0 0 0 #1a1a1a;
    }
    @keyframes brutSplash {
      0% { transform: scale(0) rotate(40deg); opacity: 0; }
      70% { transform: scale(1.3) rotate(40deg); opacity: 1; }
      100% { transform: scale(1) rotate(40deg); opacity: 1; }
    }
    /* 勾选框容器（替换原有 .chk / .sub-ck / .sub-en）*/
    .chk, .sub-ck, .sub-en {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; cursor: pointer;
    }
    .chk input, .sub-ck input, .sub-en input { display: none; }
    .chk .brut-mark, .sub-ck .brut-mark, .sub-en .brut-mark {
      position: relative; display: inline-block;
      width: 1.2em; height: 1.2em; font-size: 14px;
      background-color: #fdfcf0;
      border: 2px solid #1a1a1a;
      border-radius: 8% 92% 12% 88% / 87% 11% 89% 13%;
      box-shadow: 3px 3px 0 #1a1a1a;
      transition: all .2s;
    }
    .chk input:checked ~ .brut-mark,
    .sub-ck input:checked ~ .brut-mark,
    .sub-en input:checked ~ .brut-mark {
      background-color: #54aa69;
      border-radius: 92% 8% 88% 12% / 11% 87% 13% 89%;
    }
    .chk .brut-mark::after,
    .sub-ck .brut-mark::after,
    .sub-en .brut-mark::after {
      content: ""; position: absolute; display: none;
      left: 0.28em; top: 0.04em;
      width: 0.24em; height: 0.55em;
      border: solid #1a1a1a; border-width: 0 0.18em 0.18em 0;
      border-radius: 1px; transform: rotate(40deg);
    }
    .chk input:checked ~ .brut-mark::after,
    .sub-ck input:checked ~ .brut-mark::after,
    .sub-en input:checked ~ .brut-mark::after {
      display: block; animation: brutSplash .3s forwards;
    }
    .chk:hover .brut-mark, .sub-ck:hover .brut-mark, .sub-en:hover .brut-mark {
      transform: scale(1.08) rotate(2deg);
    }

    /* ================= 应用框架 ================= */
    #app-view { height: 100vh; display: flex; flex-direction: column; }
    .topbar {
      height: 54px; display: flex; align-items: center; gap: 14px; padding: 0 22px;
      background: rgba(15,23,42,.78); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .logo {
      font-weight: 800; font-size: 16px; letter-spacing: 1px; cursor: pointer;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .mode { background: rgba(84,170,105,.18); border: 1px solid rgba(56,189,248,.25);
            padding: 4px 12px; border-radius: 999px; font-size: 12px; color: var(--accent); }
    .nav-tabs { display: flex; gap: 4px; margin-left: 10px; }
    .nav-tab {
      padding: 7px 18px; border-radius: 9px; cursor: pointer; font-size: 13.5px; color: var(--muted);
      transition: all .2s; text-decoration: none;
    }
    .nav-tab:hover { color: var(--text); background: rgba(84,170,105,.14); }
    .nav-tab.active {
      color: #14381f; font-weight: 700;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      box-shadow: 0 4px 14px rgba(56,189,248,.3);
    }
    .spacer { flex: 1; }
    .who { font-size: 13px; color: var(--muted); }
    .link { color: var(--muted); font-size: 13px; cursor: pointer; padding: 6px 12px; border-radius: 8px; transition: all .2s; }
    .link:hover { color: var(--accent); background: rgba(84,170,105,.14); }

    /* ================= 视图容器 ================= */
    .view { flex: 1; overflow-y: auto; }

    /* ---- 工作台 ---- */
    .home { max-width: 1080px; margin: 0 auto; padding: 30px 26px 50px; }
    .hero {
      background: linear-gradient(120deg, rgba(84,170,105,.18), rgba(245,197,66,.14));
      border: 1px solid var(--line); border-radius: 20px; padding: 28px 32px; margin-bottom: 26px;
      display: flex; align-items: center; gap: 20px;
      position: relative; overflow: visible;   /* 放开裁切：天气卡要展开到 hero 之外 */
    }
    /* 原本裁切靠 .hero 的 overflow:hidden；现在改成「装饰层自己裁」，光晕照样只在圆角内 */
    .hero-clip { position: absolute; inset: 0; overflow: hidden; border-radius: 20px; pointer-events: none; z-index: 0; }
    .hero-glow { display: block; position: absolute; width: 220px; height: 220px; right: -60px; top: -90px;
                 background: radial-gradient(circle, rgba(245,197,66,.35), transparent 65%); }
    .hero .emoji { font-size: 44px; }
    .hero h2 { margin: 0 0 6px; font-size: 21px; }
    .hero p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.7; }
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 26px; }
    .stat-card {
      background: linear-gradient(160deg, rgba(255,255,255,.95), rgba(240,248,241,.85));
      border: 1px solid rgba(84,170,105,.3); border-radius: 16px;
      padding: 18px; box-shadow: var(--shadow);
      position: relative; overflow: hidden;
      transition: transform .35s cubic-bezier(.83,0,.17,1), box-shadow .35s;
    }
    .stat-card::before {
      content: ""; position: absolute; width: 90px; height: 90px; left: -30px; top: -30px;
      background: radial-gradient(circle, rgba(84,170,105,.25), transparent 70%);
      transition: transform .5s;
    }
    .stat-card:hover { transform: translateY(-5px) rotate(-.6deg); box-shadow: 0 16px 36px rgba(45,110,60,.18); }
    .stat-card:hover::before { transform: scale(1.6); }
    .stat-card .num { font-size: 30px; font-weight: 800; line-height: 1.1; }
    .stat-card.c1 { border-top: 3px solid var(--accent); } .stat-card.c1 .num { color: var(--accent); }
    .stat-card.c2 { border-top: 3px solid var(--accent2); } .stat-card.c2 .num { color: var(--accent2); }
    .stat-card.c3 { border-top: 3px solid var(--net); } .stat-card.c3 .num { color: var(--net); }
    .stat-card.c4 { border-top: 3px solid var(--kb); } .stat-card.c4 .num { color: var(--kb); }
    /* ★ M6c-7：成本卡配色（c7 tokens / c8 金额）+ 明细面板 + 三处单价行 */
    .stat-card.c7 { border-top: 3px solid #7fb2ff; } .stat-card.c7 .num { color: #7fb2ff; font-size: 26px; }
    .stat-card.c8 { border-top: 3px solid #ffd479; } .stat-card.c8 .num { color: #ffd479; font-size: 26px; }
    .cost-panel { margin-top: 10px; padding: 9px 12px; border-radius: 12px; background: rgba(255,255,255,.045);
      border: 1px dashed rgba(255,255,255,.18); font-size: 12.5px; }
    .cost-panel .cp-line { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .cost-panel .cp-lbl { color: var(--muted); }
    .cost-panel .cp-sep { color: rgba(255,255,255,.25); }
    .cost-panel .cp-note { margin-top: 6px; color: var(--muted); justify-content: space-between; }
    .u-tokens { color: var(--muted); margin-left: 8px; }
    .prov-price { flex: 1 0 100%; display: flex; align-items: center; gap: 6px; margin: 4px 0 2px 0; flex-wrap: wrap; }
    .prov-price .pp-lbl { font-size: 12px; color: var(--muted); }
    .prov-price .pp { width: 150px; }
    .prov-price .pp-hint { font-size: 11.5px; color: var(--muted); }
    .stat-card .lbl { font-size: 12.5px; color: var(--muted); margin-top: 5px; }
    .section-title { font-size: 15px; font-weight: 700; margin: 26px 0 14px; display: flex; align-items: center; gap: 10px; }
    .section-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }

    /* 快捷入口大卡片（蜀道 quick-card 风格：气泡填充 hover） */
    .quick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .quick-card {
      --qc-fill: var(--qc-c, var(--accent));
      display: flex; align-items: center; gap: 16px; padding: 20px 18px;
      background: linear-gradient(150deg, rgba(255,255,255,.96), rgba(240,248,241,.88));
      border: 1px solid rgba(84,170,105,.3); border-radius: 16px;
      cursor: pointer; text-decoration: none; color: var(--text);
      position: relative; overflow: hidden; isolation: isolate;
      transition: transform .3s cubic-bezier(.83,0,.17,1), box-shadow .3s, border-color .3s;
      box-shadow: var(--shadow);
    }
    .quick-card::before, .quick-card::after {
      content: ""; width: 150%; aspect-ratio: 1/1; scale: 0;
      background: var(--qc-fill); border-radius: 50%;
      position: absolute; z-index: -1;
      transition: scale 900ms cubic-bezier(.76, 0, .24, 1);
    }
    .quick-card::before { top: 0; left: 0; translate: -50% -50%; }
    .quick-card::after { bottom: 0; right: 0; translate: 50% 50%; }
    .quick-card:hover { transform: translateY(-4px); border-color: transparent; box-shadow: 0 14px 34px rgba(0,0,0,.45); }
    .quick-card:hover::before, .quick-card:hover::after { scale: 1; }

    /* ================= 情报面板 ================= */
    .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 40px; }
    .dash-card {
      background: linear-gradient(150deg, rgba(255,255,255,.96), rgba(240,248,241,.88));
      border: 1px solid rgba(84,170,105,.3); border-radius: 16px;
      padding: 18px; box-shadow: var(--shadow);
      transition: transform .3s, box-shadow .3s;
    }
    .dash-card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(45,110,60,.15); }
    .dash-card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .dash-card-head > span:first-child { font-weight: 700; font-size: 14px; }
    .dash-card-sub { font-size: 11px; color: var(--muted); }
    .dash-card-link { font-size: 12px; color: var(--accent); text-decoration: none; }
    .dash-card-link:hover { text-decoration: underline; }

    /* 活动趋势 */
    .trend-bars { display: flex; align-items: flex-end; gap: 6px; height: 100px; padding-top: 10px; }
    .trend-bar { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; }
    .trend-bar-fill {
      width: 100%; border-radius: 4px 4px 0 0; min-height: 4px;
      background: linear-gradient(180deg, var(--accent), var(--accent2));
      transition: height .6s cubic-bezier(.175,.885,.32,1.275);
    }
    .trend-bar-lbl { font-size: 10px; color: var(--muted); margin-top: 6px; }

    /* 知识库环形图 */
    .dash-kb-body { display: flex; align-items: center; gap: 20px; }
    .dash-kb-ring { position: relative; width: 72px; height: 72px; flex-shrink: 0; }
    .dash-kb-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .dash-kb-bg { fill: none; stroke: rgba(84,170,105,.15); stroke-width: 2.5; }
    .dash-kb-fg { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; transition: stroke-dasharray .8s; }
    .dash-kb-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; color: var(--accent); }
    .dash-kb-info { flex: 1; }
    .dash-kb-stat { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
    .dash-kb-stat .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    .dash-kb-stat .dot.s2 { background: var(--accent2); }
    .dash-kb-stat .dot.s3 { background: var(--kb); }

    /* 订阅状态 */
    .dash-subs-list { display: flex; flex-direction: column; gap: 10px; }
    .dash-sub-row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .dash-sub-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; }
    .dash-sub-dot.on { background: var(--accent); box-shadow: 0 0 6px rgba(84,170,105,.4); }
    .dash-sub-name { flex: 1; color: var(--text); }
    .dash-sub-schedule { font-size: 11px; color: var(--muted); }
    .dash-sub-empty, .dash-tl-empty { font-size: 12px; color: var(--muted); text-align: center; padding: 12px; }

    /* 时间线 */
    .dash-tl-list { display: flex; flex-direction: column; gap: 10px; }
    .dash-tl-item { display: flex; align-items: flex-start; gap: 10px; }
    .dash-tl-dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; background: var(--accent); }
    .dash-tl-dot.kb { background: var(--kb); }
    .dash-tl-dot.report { background: var(--accent2); }
    .dash-tl-content { flex: 1; }
    .dash-tl-text { font-size: 12.5px; color: var(--text); line-height: 1.5; }
    .dash-tl-time { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .quick-card .qc-icon { font-size: 34px; flex-shrink: 0; transition: transform .3s; }
    .quick-card:hover .qc-icon { transform: scale(1.18) rotate(-6deg); }
    .quick-card .qc-name { font-weight: 700; font-size: 15.5px; transition: color .4s; }
    .quick-card:hover .qc-name { color: #14381f; }
    .quick-card .qc-desc { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.5; transition: color .4s; }
    .quick-card:hover .qc-desc { color: rgba(20,56,31,.75); }
    .quick-card .qc-arrow {
      margin-left: auto; font-size: 26px; color: var(--muted); flex-shrink: 0;
      transition: transform .3s, color .4s;
    }
    .quick-card:hover .qc-arrow { transform: translateX(6px); color: #14381f; }
    .qc-sky { --qc-c: #54aa69; } .qc-indigo { --qc-c: #818cf8; } .qc-yellow { --qc-c: #fbbf24; }
    .qc-green { --qc-c: #34d399; } .qc-gold { --qc-c: #fbbf24; }
    .qc-pink { --qc-c: #f472b6; } .qc-red { --qc-c: #f87171; }
    .qc-teal { --qc-c: #2dd4bf; }

    /* ---- 技能与工具视图（M4a）---- */
    .sk-wrap { padding: 24px; max-width: 1080px; margin: 0 auto; width: 100%; overflow-y: auto; }
    .sk-head h2 { margin: 0 0 6px; font-size: 18px; }
    .sk-sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; line-height: 1.6; }
    .sk-tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
    .sk-tab { padding: 7px 14px; border-radius: 999px; font-size: 12.5px; cursor: pointer;
              background: rgba(84,170,105,.14); border: 1px solid rgba(84,170,105,.28); color: var(--muted);
              transition: background .25s, color .25s; }
    .sk-tab:hover { color: var(--text); background: rgba(84,170,105,.24); }
    .sk-tab.on { background: rgba(84,170,105,.45); color: #14381f; font-weight: 700; }
    .sk-card { background: var(--panel2); border: 1px solid rgba(84,170,105,.28); border-radius: 12px;
               padding: 14px 16px; margin-bottom: 14px; }
    .sk-card h3 { margin: 0 0 8px; font-size: 15px; }
    .sk-tip { font-size: 12px; color: var(--muted); line-height: 1.65; margin-bottom: 10px; }
    .sk-grid { display: grid; grid-template-columns: 250px 1fr; gap: 14px; align-items: start; }
    .sk-list { max-height: 430px; overflow-y: auto; }
    .sk-item { padding: 9px 11px; border-radius: 10px; background: rgba(84,170,105,.12);
               border: 1px solid rgba(84,170,105,.22); margin-bottom: 7px; cursor: pointer;
               transition: transform .2s, border-color .2s; }
    .sk-item:hover { transform: translateY(-1px); border-color: rgba(84,170,105,.5); }
    .sk-item.on { background: rgba(84,170,105,.36); border-color: rgba(84,170,105,.7); }
    .sk-item .n { font-size: 13px; font-weight: 700; }
    .sk-item .d { font-size: 11.5px; color: var(--muted); margin-top: 3px; display: -webkit-box;
                  -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .sk-item .m { font-size: 10.5px; color: var(--muted); margin-top: 4px; }
    .sk-ta { width: 100%; min-height: 250px; font-family: ui-monospace, Consolas, monospace;
             font-size: 12.5px; line-height: 1.6; resize: vertical; }
    .sk-cnt { font-size: 11px; color: var(--muted); }
    .sk-cnt.over { color: #e5484d; font-weight: 700; }
    .sk-empty { color: var(--muted); font-size: 12.5px; padding: 20px 6px; text-align: center; line-height: 1.7; }
    .sk-ph { border-style: dashed !important; }
    .sk-cmd { font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: rgba(0,0,0,.26);
              border-radius: 8px; padding: 7px 10px; margin: 6px 0; word-break: break-all; color: var(--net); }
    .sk-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    /* ---- 011 terminal-cli：终端窗口卡片（M4b/M4c 命令行 UI 主视觉）---- */
    .term {
      background-color: #101729; border-radius: 10px; border: 1px solid #1a222f;
      display: flex; flex-direction: column; padding: 14px 16px; margin: 10px 0 12px;
      font-family: "Courier New", ui-monospace, Consolas, monospace;
      box-shadow: 0 12px 28px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.04);
      animation: term-in .45s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes term-in { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: none; } }
    .term-top {
      display: flex; flex-direction: row; align-items: center;
      border-bottom: 1px solid #212b3f; padding-bottom: 9px; margin-bottom: 13px;
    }
    .tdot { width: 12px; height: 12px; border-radius: 50%; margin-right: 7px; flex: 0 0 auto; }
    .tdot.red { background-color: #ef4444; }
    .tdot.yellow { background-color: #eab308; }
    .tdot.green { background-color: #22c55e; margin-right: 15px; }
    .term-title { color: #fff; margin: 0; font-size: 12px; opacity: .82; letter-spacing: .3px; }
    .term-line { color: #fff; font-size: 12.5px; line-height: 1.7; word-break: break-all; }
    .term-line:not(:last-child) { margin-bottom: 9px; }
    .term-line .dollar { color: #2282f4; margin-right: 13px; font-weight: 700; }
    .term-line.green-line { color: #46cf79; margin-bottom: 10px; }
    .term-line.l1 { animation: green-color 3s infinite; }
    .term-line.l2 { animation: green-color 3.5s infinite; }
    .term-line.l3 { animation: green-color 2s infinite; }
    @keyframes green-color {
      0% { color: #2a7151; }
      50% { color: #46cf79; }
      100% { color: #2a7151; }
    }
    .term-cmd { cursor: copy; transition: color .2s; }
    .term-cmd:hover { color: #9fd4ff; }
    .term-line.warn-line { color: #f5c542; margin-bottom: 10px; }
    /* ---- 011 终端卡扩展：CLI 面板（M4b） ---- */
    .term.out-wrap { min-height: 340px; }
    .term-out { flex: 1 1 auto; min-height: 240px; max-height: 460px; overflow-y: auto;
                padding-right: 4px; scroll-behavior: smooth; }
    .term-out::-webkit-scrollbar { width: 8px; }
    .term-out::-webkit-scrollbar-thumb { background: #26314a; border-radius: 999px; }
    .cli-line { white-space: pre-wrap; word-break: break-all; margin-bottom: 3px; }
    .cli-line.cmd { color: #9fd4ff; }
    .cli-line.cmd .dollar { color: #2282f4; font-weight: 700; margin-right: 8px; }
    .cli-line.out { color: #cfe3d6; }
    .cli-line.err { color: #f5c542; }
    .cli-line.ok { color: #46cf79; }
    .cli-line.dim { color: #7d8aa3; }
    .term-input-row { display: flex; align-items: center; gap: 8px; margin-top: 12px;
                      border-top: 1px solid #212b3f; padding-top: 11px; }
    .term-input-row .dollar { color: #2282f4; font-weight: 700; }
    .term-in { flex: 1 1 auto; min-width: 0; background: #0b1220; border: 1px solid #26314a;
               border-radius: 7px; color: #fff; font-family: inherit; font-size: 12.5px;
               padding: 8px 10px; outline: none; transition: border-color .2s, box-shadow .2s; }
    .term-in:focus { border-color: #2282f4; box-shadow: 0 0 0 3px rgba(34,130,244,.16); }
    .term-in:disabled { opacity: .6; }
    .term-go { background: #2282f4; color: #fff; border: 0; border-radius: 7px;
               padding: 8px 14px; font-size: 12.5px; cursor: pointer; font-family: inherit;
               transition: background .2s, transform .12s; }
    .term-go:hover:not(:disabled) { background: #3a92f7; transform: translateY(-1px); }
    .term-go:disabled { opacity: .5; cursor: not-allowed; }
    .term-go.ghost { background: transparent; border: 1px solid #26314a; color: #9fd4ff; }
    .term-go.ghost:hover:not(:disabled) { background: #0b1220; border-color: #2282f4; color: #fff; }
    .term-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }
    .term-chip { font-size: 11px; padding: 3px 9px; border-radius: 6px; cursor: pointer;
                 background: #0b1220; border: 1px solid #26314a; color: #9fd4ff;
                 font-family: inherit; transition: border-color .2s, color .2s; }
    .term-chip:hover { border-color: #2282f4; color: #fff; }

    /* ---- M4c 第三方 CLI 卡：状态徽章 / 只读命令区 / 备注 ---- */
    .sk-badge.st-none { background: rgba(120,132,150,.22); border-color: rgba(120,132,150,.5); }
    .sk-badge.st-installed { background: rgba(245,197,66,.32); border-color: rgba(245,197,66,.6); }
    .sk-badge.st-authed { background: rgba(84,170,105,.32); border-color: rgba(84,170,105,.6); color: #14381f; }
    .sk-badge.st-ok { background: rgba(84,170,105,.22); border-color: rgba(84,170,105,.45); }
    .sk-badge.st-warn { background: rgba(224,101,63,.2); border-color: rgba(224,101,63,.45); }
    .cli-agent { margin-top: 12px; padding: 11px 13px; border-radius: 10px;
                 background: rgba(11,18,32,.045); border: 1px dashed rgba(11,18,32,.18); }
    .cli-agent-h { font-size: 12.5px; font-weight: 600; margin-bottom: 8px; }
    .cli-agent-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 7px; }
    .cli-note-row { gap: 10px; align-items: center; }
    .cli-note { flex: 1 1 260px; min-width: 170px; font-size: 12.5px; padding: 7px 11px;
                border-radius: 8px; border: 1px solid var(--line);
                background: rgba(255,255,255,.85); color: var(--text); font-family: inherit; }
    .cli-note:focus { outline: none; border-color: #2282f4; }
    /* M5：能力描述（工具智能路由——决定 AI 何时想起用这个 CLI） */
    /* 能力描述的依据：三选一（2026-10-07）——单选、条件输入；help 模式给一段说明 */
    .cli-docs-mode { display: flex; gap: 16px; flex-wrap: wrap; padding: 2px 0 2px; }
    .cli-form .cli-docs-mode label.rd { flex-direction: row; align-items: center; gap: 5px;
      font-size: 12.5px; color: var(--text); cursor: pointer; flex: 0 0 auto; }
    .cli-form .cli-docs-mode input[type="radio"] { width: auto; padding: 0; margin: 0; accent-color: #2282f4; }
    .cli-docs-tip { font-size: 12px; line-height: 1.65; color: var(--muted);
      background: rgba(34,130,244,.06); border-left: 3px solid #2282f4;
      border-radius: 0 8px 8px 0; padding: 7px 10px; }
    .cli-docs-tip code { font-size: 11.5px; }
    .cli-ability-help { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
    .cli-ability-help .sk-tip { flex: 1 1 320px; margin: 0; line-height: 1.6; }
    /* 草稿证据与审计（2026-09-24）：告诉用户「读了哪份文档、覆盖几条」，以及审计发现的可疑映射 */
    .cli-draft-note { flex: 1 1 100%; font-size: 12px; line-height: 1.6; }
    .cli-draft-note .ev { color: var(--muted); }
    .cli-draft-note .warn { color: #d97706; }
    .cli-draft-note ul { margin: 4px 0 0; padding-left: 18px; }
    .cli-ability { white-space: pre-wrap; font-size: 12px; line-height: 1.65; color: var(--text);
                   background: rgba(34,130,244,.06); border-left: 3px solid #2282f4;
                   border-radius: 0 8px 8px 0; padding: 8px 12px; margin-top: 6px; }

    /* ---- M4c 配置导向版：新建表单 / 只读命令 chip / 试跑输出 ---- */
    /* ==== 012 号设计（cards/weather-gradient）：工作台 时钟 + 天气卡 ==== */
    .wx-dock { position: relative; margin-left: auto; align-self: center; z-index: 40;
               --wx-c1: #4fae6b; --wx-c2: #1f5c37; --wx-accent: #ffe27a; --wx-sh: 35, 104, 63; }   /* 默认：松绿（项目主色系） */
    .wx-dock[data-wx="amber"]  { --wx-c1: #e2ab34; --wx-c2: #8a5a08; --wx-accent: #fff4d1; --wx-sh: 138, 90, 8; }   /* 暖阳 */
    .wx-dock[data-wx="indigo"] { --wx-c1: #4f6bd8; --wx-c2: #23306f; --wx-accent: #cfe0ff; --wx-sh: 35, 48, 111; }   /* 靛蓝 */
    .wx-dock[data-wx="violet"] { --wx-c1: #5936b4; --wx-c2: #362a84; --wx-accent: #ffe9a8; --wx-sh: 54, 42, 132; }   /* 紫罗兰（012 原味） */
    .wx-mini { display: flex; align-items: center; gap: 9px; padding: 9px 15px; border-radius: 999px;
               background: linear-gradient(120deg, var(--wx-c1) 0%, var(--wx-c2) 100%);
               border: 1px solid rgba(255, 255, 255, .28); color: #fff; cursor: pointer;
               box-shadow: 0 10px 24px rgba(var(--wx-sh), .28); font-variant-numeric: tabular-nums;

    .loading-row { display: flex; align-items: center; gap: 14px; padding: 6px 2px; }
    .wrapper-grid {
      --animation-duration: 2.1s; --cube-color: #0000; --highlight-color: #54aa69;
      --cube-width: 13px; --cube-height: 13px;
      position: relative; display: grid; grid-template-columns: repeat(7, var(--cube-width));
      width: calc(7 * var(--cube-width)); height: var(--cube-height);
      perspective: 350px; color: transparent;
    }
    .cube { position: relative; transform-style: preserve-3d; animation: translate-z var(--animation-duration) ease-in-out infinite; }
    .face { position: absolute; width: var(--cube-width); height: var(--cube-height); background-color: var(--cube-color); }
    .face-front { transform: rotateY(0deg) translateZ(calc(var(--cube-width) / 2)); }
    .face-back { transform: rotateY(180deg) translateZ(calc(var(--cube-width) / 2)); opacity: .6; }
    .face-left { transform: rotateY(-90deg) translateZ(calc(var(--cube-width) / 2)); opacity: .6; }
    .face-right { transform: rotateY(90deg) translateZ(calc(var(--cube-width) / 2)); opacity: .6; }
    .face-top { transform: rotateX(90deg) translateZ(calc(var(--cube-width) / 2)); opacity: .8; }
    .face-bottom { transform: rotateX(-90deg) translateZ(calc(var(--cube-width) * .5)); opacity: .8; }
    .cube:nth-child(1) { animation-delay: 0s; } .cube:nth-child(2) { animation-delay: .2s; }
    .cube:nth-child(3) { animation-delay: .4s; } .cube:nth-child(4) { animation-delay: .6s; }
    .cube:nth-child(5) { animation-delay: .8s; } .cube:nth-child(6) { animation-delay: 1s; }
    .cube:nth-child(7) { animation-delay: 1.2s; }
    .cube .face { animation: face-color var(--animation-duration) ease-in-out infinite; animation-delay: inherit; }
    @keyframes translate-z { 0%, 40%, 100% { transform: translateZ(-2px); } 30% { transform: translateZ(8px) translateY(-1px); } }
    @keyframes face-color { 0%, 50%, 100% { background-color: var(--cube-color); } 10% { background-color: var(--highlight-color); } }

    .input-bar { border-top: 1px solid var(--line); padding: 14px 18px; display: flex; gap: 12px; background: rgba(255,255,255,.7); backdrop-filter: blur(10px); }
    .input-bar textarea {
      flex: 1; resize: none; height: 48px; padding: 13px 14px; border-radius: 12px;
      border: 1px solid rgba(84,170,105,.35); background: rgba(255,255,255,.85); color: var(--text);
      font-size: 14px; font-family: inherit; outline: none; transition: border-color .25s, box-shadow .25s;
    }
    .input-bar textarea:focus { border-color: rgba(84,170,105,.5); box-shadow: 0 0 0 3px rgba(84,170,105,.18); }
    /* ★ v3.1 输入区（复刻微信 · 用户 2026-09-30 反馈修订）
       ── 关于"容器"：CSS 里就是 **flex/grid 容器** ✓ —— 容器定高 + align-items:stretch，
          子元素由布局拉伸到同高 ✓（不需要 Qt 那样手动对齐 ✓）。所以这里所有按钮都跟输入框**等高** ✓。 */
    .input-bar.wx { --wx-h: 46px; display: flex; align-items: stretch; gap: 10px; }
    .input-bar.wx > .wx-round,
    .input-bar.wx > .send-bubbles { height: var(--wx-h); }
    .wx-round { flex: 0 0 auto; width: var(--wx-h); border-radius: 50%; cursor: pointer; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--muted-foreground); background: transparent; border: 1.5px solid var(--border);
      transition: transform .18s cubic-bezier(.22,1,.36,1), color .18s, border-color .18s,
                  background .18s, box-shadow .18s; }
    .wx-round:hover { color: var(--foreground); border-color: var(--accent); transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(0,0,0,.16), 0 0 0 3px rgba(126,224,138,.12); }
    .wx-round:active { transform: translateY(0) scale(.94); }
    .wx-round.on { color: var(--foreground); border-color: var(--accent); background: rgba(255,255,255,.07); }
    .wx-round svg { transition: transform .24s cubic-bezier(.22,1,.36,1); }
    /* ★ v3.1 语音转文字（长按说话）：按钮激活态 + 「正在收听」浮窗（照微信观感 ✓） */
    .input-bar.wx { position: relative; }
    .wx-in.rec { color: #d9534f; border-color: rgba(217,83,79,.55); background: rgba(217,83,79,.10); }
    .wx-in:disabled { opacity: .45; cursor: default; }
    .rec-pop { position: absolute; left: 50%; bottom: calc(100% + 10px); transform: translateX(-50%);
               width: 232px; padding: 12px 14px; border-radius: 14px; z-index: 40; pointer-events: none;
               background: rgba(28,30,32,.94); color: #fff; box-shadow: 0 12px 32px rgba(0,0,0,.30);
               display: flex; flex-direction: column; gap: 8px; }
    .rec-pop.cancel { background: rgba(122,42,42,.95); }
    .rec-pop .rec-top { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .rec-pop .rec-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff5b5b;
                        animation: recPulse 1s infinite ease-in-out; }
    @keyframes recPulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .30; transform: scale(.65); } }
    .rec-pop .rec-t { margin-left: auto; opacity: .85; font-variant-numeric: tabular-nums; }
    .rec-pop .rec-bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.16); overflow: hidden; }
    .rec-pop .rec-bar > i { display: block; height: 100%; width: 0%; background: #54aa69; transition: width .08s linear; }
    .rec-pop.cancel .rec-bar > i { background: #ff9a9a; }
    .rec-pop .rec-tip { font-size: 12px; opacity: .72; }
    .wx-round.on svg { transform: rotate(45deg); }              /* ＋ → ✕ 的动感 ✓ */
    .input-bar.wx .wx-field { position: relative; flex: 1 1 auto; min-width: 0; height: var(--wx-h); }
    .input-bar.wx .wx-field textarea { width: 100%; height: 100%; box-sizing: border-box;
      padding: 12px 42px 12px 14px; resize: none; line-height: 20px;
      transition: border-color .18s, box-shadow .18s; }
    .input-bar.wx .wx-field textarea:focus { border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(126,224,138,.13); }
    .wx-in { position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      width: 28px; height: 28px; padding: 0; border: none; background: transparent; cursor: pointer;
      border-radius: 50%; color: var(--muted-foreground); display: inline-flex;
      align-items: center; justify-content: center;
      transition: transform .18s cubic-bezier(.22,1,.36,1), color .18s, background .18s; }
    .wx-in:hover { color: var(--accent); background: rgba(255,255,255,.07); transform: translateY(-50%) scale(1.12); }
    .wx-in:active { transform: translateY(-50%) scale(.94); }
    .input-bar.wx .send-bubbles { flex: 0 0 auto; }

    /* ── 展开面板：四个**等宽方框**（grid ✓）填满整行 ✓，图标放大基本占满框 ✓，进场有动效 ✓ ── */
    .multi-panel { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
      width: 100%; margin-top: 10px; animation: mpIn .24s cubic-bezier(.22,1,.36,1); }
    @keyframes mpIn { from { opacity: 0; transform: translateY(-10px) scale(.98); } to { opacity: 1; transform: none; } }
    .mp-tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      min-height: 86px; padding: 10px 6px; border-radius: 16px; cursor: pointer;
      background: var(--card); border: 1.5px solid var(--border); color: var(--muted-foreground);
      font-size: 13px; line-height: 1.2;
      transition: transform .18s cubic-bezier(.22,1,.36,1), border-color .18s, box-shadow .18s, color .18s; }
    .mp-tile .ic { font-size: 30px; line-height: 1; transition: transform .18s cubic-bezier(.22,1,.36,1); }
    .mp-tile:hover { color: var(--foreground); border-color: var(--accent); transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(0,0,0,.2), 0 0 0 3px rgba(126,224,138,.12); }

    .mp-tile:active { transform: translateY(-1px) scale(.97); }

    .send-bubbles {
      --c1: #1d3a24; --c2: #54aa69; --size-letter: 14px;
      padding: 0 26px; font-size: var(--size-letter); font-family: inherit;
      background-color: transparent; border: calc(var(--size-letter) / 6) solid var(--c2);
      border-radius: 12px; cursor: pointer; overflow: hidden; position: relative;
      transition: 300ms cubic-bezier(.83, 0, .17, 1);
    }
    .send-bubbles > .text { font-weight: 700; color: var(--c2); position: relative; z-index: 1; transition: color 700ms cubic-bezier(.83,0,.17,1); }
    .send-bubbles::before { top: 0; left: 0; } .send-bubbles::after { top: 100%; left: 100%; }
    .send-bubbles::before, .send-bubbles::after {
      content: ""; width: 150%; aspect-ratio: 1/1; scale: 0;
      transition: 1000ms cubic-bezier(.76, 0, .24, 1);
      background-color: var(--c2); border-radius: 50%; position: absolute; translate: -50% -50%;
    }
    .send-bubbles:hover > .text { color: var(--c1); }
    .send-bubbles:hover::before, .send-bubbles:hover::after { scale: 1; }
    .send-bubbles:active { scale: .97; filter: brightness(.9); }
    .send-bubbles:disabled { opacity: .55; cursor: not-allowed; filter: grayscale(.4); }
    /* ★ v3.1 视觉：本轮图片预览条（缩略图 + 单张删除 + 状态提示） */
    .chat-imgs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 8px; }
    .chat-img { position: relative; width: 62px; height: 62px; border-radius: 10px; overflow: hidden;
      border: 1px solid var(--border); background: var(--card); }
    .chat-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .chat-img .x { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; line-height: 17px;
      text-align: center; border-radius: 50%; cursor: pointer; font-size: 12px; color: #fff;
      background: rgba(0,0,0,.62); border: none; padding: 0; }
    .chat-img .x:hover { background: #d9534f; }
    .chat-imgs .hint { font-size: 12px; color: var(--muted-foreground); }
    .chat-imgs .err { font-size: 12px; color: #d9534f; }
    .chat-imgs .add { width: 62px; height: 62px; border-radius: 10px; cursor: pointer; font-size: 20px;
      color: var(--muted-foreground); background: transparent; border: 1px dashed var(--border); }
    .chat-imgs .add:hover { color: var(--foreground); border-color: var(--accent); }
    /* ★ 用户气泡里的图：发出去之后仍然看得见（不然用户回头不知道当时贴了什么 ✓） */
    .bubble-imgs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
    .bubble-imgs img { max-width: 132px; max-height: 96px; border-radius: 8px; display: block;
      border: 1px solid rgba(255,255,255,.28); }

    /* 中断态：AI 正在回答时，发送按钮变红「中断」，呼吸灯提示可强停 */
    .send-bubbles.stop { --c1: #2a1410; --c2: #e0653f; animation: stop-pulse 1.6s ease-in-out infinite; }
    .send-bubbles.stop:disabled { opacity: 1; filter: none; cursor: progress; }  /* 已点中断：保持红色，只转光标 */
    @keyframes stop-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(224,101,63,0); }
      50% { box-shadow: 0 0 0 5px rgba(224,101,63,.18); }
    }
    .mini-btn.danger { border-color: rgba(224,101,63,.45); }
    .mini-btn.danger:hover { border-color: #e0653f; color: #e0653f; box-shadow: 0 0 0 3px rgba(224,101,63,.18); }

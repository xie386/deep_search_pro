<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="980" height="520" fill="#e6e9e6"/>
  <rect width="980" height="520" fill="#0b1220" opacity="0.30"/>
  <g transform="translate(60,20)">
    <rect x="0" y="0" width="860" height="474" rx="18" fill="#ffffff" stroke="#cfe3d1"/>
    <text x="26" y="36" font-size="18" fill="#2f7a43" font-weight="bold">🔧 工具 · 小小API（抖音热榜）</text>
    <text x="26" y="60" font-size="12" fill="#6b7a6e">贴 OpenAPI / Swagger 文档 → 解析候选 → 勾选 → 确认勾选。下面同时列出这个来源已保存的工具，不用重贴文档。</text>

    <!-- 粘贴框 -->
    <rect x="26" y="72" width="808" height="104" rx="8" fill="#f7faf8" stroke="#c9d6cb"/>
    <text x="38" y="92" font-size="11.5" fill="#2f7a43">{</text>
    <text x="38" y="108" font-size="11.5" fill="#3b4a3f">  "openapi": "3.0.0", "info": { "title": "小小API", "version": "1.0.0" },</text>
    <text x="38" y="124" font-size="11.5" fill="#3b4a3f">  "paths": { "/api/ip": { "get": { "operationId": "ipQuery", "summary": "查询IP归属地",</text>
    <text x="38" y="140" font-size="11.5" fill="#3b4a3f">      "parameters": [ { "name": "ip", "in": "query", "required": true,</text>
    <text x="38" y="156" font-size="11.5" fill="#3b4a3f">                        "schema": { "type": "string" } } ], "responses": { "200": {} } } } } }</text>
    <text x="38" y="170" font-size="11" fill="#a8620f">↑ 例（最小可用）：这段就是完整文档，不用真的写 Swagger 全家桶</text>

    <!-- 按钮行 -->
    <rect x="26" y="186" width="98" height="28" rx="7" fill="#eef5ee" stroke="#cfe3d1"/>
    <text x="75" y="205" font-size="12.5" fill="#2f7a43" text-anchor="middle">🔍 解析候选</text>
    <rect x="132" y="186" width="146" height="28" rx="7" fill="#54aa69"/>
    <text x="205" y="205" font-size="12.5" fill="#fff" text-anchor="middle">✅ 确认勾选（1）</text>
    <text x="292" y="205" font-size="11.5" fill="#8a968c">写操作要先勾「我确认这是写操作」，才会进入确认清单。</text>

    <!-- 候选：已确认 -->
    <rect x="26" y="226" width="808" height="60" rx="8" fill="#fdfbf0" stroke="#e5d9a8"/>
    <rect x="26" y="226" width="3" height="60" fill="#54aa69"/>
    <rect x="42" y="240" width="14" height="14" rx="3" fill="#eef5ee" stroke="#9fb3a3"/>
    <text x="49" y="251" font-size="11" fill="#2f7a43" text-anchor="middle">✓</text>
    <text x="70" y="252" font-size="13" fill="#2b3a2e" font-weight="bold">获取抖音实时热榜</text>
    <rect x="226" y="238" width="52" height="18" rx="9" fill="#e7f5ea" stroke="#54aa69"/>
    <text x="252" y="251" font-size="11" fill="#2f7a43" text-anchor="middle">只读</text>
    <text x="292" y="252" font-size="11.5" fill="#8a968c">api:xxapi#douyinHot</text>
    <text x="470" y="252" font-size="11.5" fill="#8a968c">无参数</text>
    <rect x="700" y="238" width="112" height="18" rx="9" fill="#e7f5ea" stroke="#54aa69"/>
    <text x="756" y="251" font-size="11" fill="#2f7a43" text-anchor="middle">已确认 ✅</text>
    <text x="70" y="274" font-size="11.5" fill="#8a968c">（已确认的工具重复贴文档不会被覆盖，保留你的设置）</text>

    <!-- 候选：待确认 -->
    <rect x="26" y="294" width="808" height="60" rx="8" fill="#fdfbf0" stroke="#e5d9a8"/>
    <rect x="26" y="294" width="3" height="60" fill="#54aa69"/>
    <rect x="42" y="308" width="14" height="14" rx="3" fill="#fff" stroke="#9fb3a3"/>
    <text x="70" y="320" font-size="13" fill="#2b3a2e" font-weight="bold">查询IP归属地</text>
    <rect x="180" y="306" width="52" height="18" rx="9" fill="#e7f5ea" stroke="#54aa69"/>
    <text x="206" y="319" font-size="11" fill="#2f7a43" text-anchor="middle">只读</text>
    <text x="246" y="320" font-size="11.5" fill="#8a968c">api:xxapi#ipQuery</text>
    <text x="420" y="320" font-size="11.5" fill="#8a968c">参数: ip(必填,query)</text>
    <rect x="700" y="306" width="112" height="18" rx="9" fill="#fdf4e6" stroke="#e2b04a"/>
    <text x="756" y="319" font-size="11" fill="#a8620f" text-anchor="middle">待确认 ○</text>
    <text x="70" y="342" font-size="11.5" fill="#8a968c">勾上这个框 → 点上面的「确认勾选」→ 它才会进池、Agent 才能调用</text>

    <!-- 写操作示例 -->
    <rect x="26" y="362" width="808" height="56" rx="8" fill="#fdf6f6" stroke="#e8c9c9"/>
    <rect x="26" y="362" width="3" height="56" fill="#d9534f"/>
    <rect x="42" y="374" width="14" height="14" rx="3" fill="#f3f5f3" stroke="#c8cfc9"/>
    <text x="70" y="386" font-size="13" fill="#2b3a2e" font-weight="bold">创建钩子</text>
    <rect x="152" y="372" width="76" height="18" rx="9" fill="#fbeaea" stroke="#d9534f"/>
    <text x="190" y="385" font-size="11" fill="#b4483f" text-anchor="middle">⚠️ 写操作</text>
    <text x="240" y="386" font-size="11.5" fill="#8a968c">api:demo#createHook</text>
    <text x="70" y="408" font-size="11.5" fill="#a8620f">☐ 我确认这是写操作（会改外部状态），仅在明确需要时放行　←　不勾这个，勾选框是灰的、确认时也会被跳过</text>
  </g>
</svg>

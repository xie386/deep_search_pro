<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="980" height="430" fill="#f3f5f2"/>
  <!-- 顶部 tab -->
  <g transform="translate(24,18)">
    <rect x="0" y="0" width="88" height="30" rx="15" fill="#eef5ee" stroke="#cfe3d1"/>
    <text x="44" y="20" font-size="13" fill="#5b6b5e" text-anchor="middle">技能</text>
    <rect x="96" y="0" width="96" height="30" rx="15" fill="#eef5ee" stroke="#cfe3d1"/>
    <text x="144" y="20" font-size="13" fill="#5b6b5e" text-anchor="middle">CLI 面板</text>
    <rect x="200" y="0" width="112" height="30" rx="15" fill="#eef5ee" stroke="#cfe3d1"/>
    <text x="256" y="20" font-size="13" fill="#5b6b5e" text-anchor="middle">自定义 CLI</text>
    <rect x="320" y="0" width="104" height="30" rx="15" fill="#eef5ee" stroke="#cfe3d1"/>
    <text x="372" y="20" font-size="13" fill="#5b6b5e" text-anchor="middle">MCP 服务</text>
    <rect x="432" y="0" width="104" height="30" rx="15" fill="#dff0e2" stroke="#54aa69" stroke-width="1.6"/>
    <text x="484" y="20" font-size="13" fill="#2f7a43" text-anchor="middle" font-weight="bold">🔗 API 工具</text>
  </g>

  <!-- 指导栏 -->
  <g transform="translate(24,62)">
    <rect x="0" y="0" width="932" height="176" rx="12" fill="#fbfdfb" stroke="#cfe3d1"/>
    <text x="18" y="30" font-size="17" fill="#2b3a2e" font-weight="bold">🔗 API 工具接入</text>
    <text x="18" y="58" font-size="12.5" fill="#6b7a6e">把你自己（或公司内部）的 HTTP API 接成 Agent 能调用的工具：一个来源 = 一份 base_url + 鉴权，</text>
    <text x="18" y="78" font-size="12.5" fill="#6b7a6e">来源下面可以挂任意多个工具（工具 = 文档里的一个操作，如 GET /api/ip）。</text>
    <text x="18" y="104" font-size="12.5" fill="#a8620f">⚠️ 未确认的工具 Agent 看不到、也调不到；写操作（POST/PUT/PATCH/DELETE）即使确认，也要单独勾一次</text>
    <text x="18" y="124" font-size="12.5" fill="#a8620f">「我确认这是写操作」。密钥只存在你本机库里、调用时才注入，界面上永远打码。</text>
    <!-- 统计 + 动作 chips -->
    <g transform="translate(18,140)" font-size="11.5">
      <rect x="0" y="0" width="96" height="24" rx="6" fill="#0b1220" stroke="#26314a"/>
      <text x="48" y="16" fill="#9fd4ff" text-anchor="middle">我的来源 1</text>
      <rect x="104" y="0" width="108" height="24" rx="6" fill="#0b1220" stroke="#26314a"/>
      <text x="158" y="16" fill="#9fd4ff" text-anchor="middle">已接入工具 1</text>
      <rect x="220" y="0" width="92" height="24" rx="6" fill="#0b1220" stroke="#26314a"/>
      <text x="266" y="16" fill="#9fd4ff" text-anchor="middle">待确认 1</text>
      <rect x="320" y="0" width="100" height="24" rx="6" fill="#0b1220" stroke="#26314a"/>
      <text x="370" y="16" fill="#9fd4ff" text-anchor="middle">体检通过 1</text>
      <rect x="428" y="0" width="92" height="24" rx="6" fill="#0b1220" stroke="#26314a"/>
      <text x="474" y="16" fill="#9fd4ff" text-anchor="middle">↻ 重新拉取</text>
      <rect x="528" y="0" width="120" height="24" rx="6" fill="#0b1220" stroke="#26314a"/>
      <text x="588" y="16" fill="#ffd479" text-anchor="middle">＋ 新增 API 来源</text>
      <rect x="656" y="0" width="104" height="24" rx="6" fill="#0b1220" stroke="#26314a"/>
      <text x="708" y="16" fill="#9fd4ff" text-anchor="middle">📘 教程指导</text>
    </g>
    <path d="M18 176 L18 176" stroke="none"/>
  </g>

  <!-- 来源卡 -->
  <g transform="translate(24,252)">
    <rect x="0" y="0" width="932" height="158" rx="12" fill="#fbfdfb" stroke="#cfe3d1"/>
    <text x="18" y="30" font-size="15" fill="#2b3a2e" font-weight="bold">小小API（抖音热榜）</text>
    <rect x="212" y="16" width="60" height="20" rx="5" fill="#eef2ef"/>
    <text x="242" y="30" font-size="11.5" fill="#6b7a6e" text-anchor="middle">xxapi</text>
    <rect x="282" y="16" width="76" height="20" rx="10" fill="#e7f5ea" stroke="#54aa69"/>
    <text x="320" y="30" font-size="11.5" fill="#2f7a43" text-anchor="middle">✓ 已体检</text>
    <text x="18" y="52" font-size="12.5" fill="#6b7a6e">base_url https://v2.xxapi.cn · 鉴权 无鉴权 · 超时 30s</text>
    <text x="18" y="72" font-size="12.5" fill="#6b7a6e">能力描述（决定 Agent 何时想起它）：抖音热榜、抖音热搜、实时热点榜单</text>
    <!-- 工具区 -->
    <rect x="18" y="84" width="896" height="56" rx="10" fill="#f4fbf5" stroke="#a9c9b0" stroke-dasharray="4 3"/>
    <text x="30" y="102" font-size="12" fill="#6b7a6e">工具 2 个 · 已确认 1 · 待确认 1</text>
    <rect x="800" y="90" width="104" height="22" rx="6" fill="#eef5ee" stroke="#cfe3d1"/>
    <text x="852" y="105" font-size="11.5" fill="#2f7a43" text-anchor="middle">＋ 导入 / 查看工具</text>
    <text x="30" y="122" font-size="12.5" fill="#2b3a2e">✅</text>
    <text x="50" y="122" font-size="12.5" fill="#2b3a2e" font-weight="bold">获取抖音实时热榜</text>
    <rect x="186" y="109" width="52" height="18" rx="9" fill="#e7f5ea" stroke="#54aa69"/>
    <text x="212" y="122" font-size="11" fill="#2f7a43" text-anchor="middle">只读</text>
    <text x="250" y="122" font-size="11.5" fill="#8a968c">api:xxapi#douyinHot</text>
    <text x="400" y="122" font-size="11.5" fill="#8a968c">无参数</text>
    <text x="30" y="136" font-size="11.5" fill="#a8620f">○ 查询IP归属地 只读 · 待确认  api:xxapi#ipQuery  参数: ip(必填,query)</text>
    <!-- 底部动作 -->
    <text x="600" y="152" font-size="11.5" fill="#8a968c">备注：免密钥公开接口</text>
    <rect x="742" y="144" width="54" height="20" rx="6" fill="#eef5ee" stroke="#cfe3d1"/>
    <text x="769" y="158" font-size="11.5" fill="#5b6b5e" text-anchor="middle">🩺 体检</text>
    <rect x="802" y="144" width="54" height="20" rx="6" fill="#eef5ee" stroke="#cfe3d1"/>
    <text x="829" y="158" font-size="11.5" fill="#5b6b5e" text-anchor="middle">✏️ 编辑</text>
    <rect x="862" y="144" width="54" height="20" rx="6" fill="#fbeaea" stroke="#e2b4b4"/>
    <text x="889" y="158" font-size="11.5" fill="#b4483f" text-anchor="middle">🗑 删除</text>
  </g>
  <text x="24" y="424" font-size="11" fill="#9aa79d">示意图（非真实截图）：🔗 API 工具 tab —— 常态只有指导栏 + 来源卡，工具直接列在卡里；表单要点按钮才出现。</text>
</svg>

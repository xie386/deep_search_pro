<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="980" height="430" fill="#f3f5f2"/>
  <g transform="translate(24,18)">
    <rect x="0" y="0" width="88" height="30" rx="15" fill="#eef5ee" stroke="#cfe3d1"/>
    <text x="44" y="20" font-size="13" fill="#5b6b5e" text-anchor="middle">技能</text>
    <rect x="96" y="0" width="96" height="30" rx="15" fill="#eef5ee" stroke="#cfe3d1"/>
    <text x="144" y="20" font-size="13" fill="#5b6b5e" text-anchor="middle">CLI 面板</text>
    <rect x="200" y="0" width="112" height="30" rx="15" fill="#eef5ee" stroke="#cfe3d1"/>
    <text x="256" y="20" font-size="13" fill="#5b6b5e" text-anchor="middle">自定义 CLI</text>
    <rect x="320" y="0" width="104" height="30" rx="15" fill="#dff0e2" stroke="#54aa69" stroke-width="1.6"/>
    <text x="372" y="20" font-size="13" fill="#2f7a43" text-anchor="middle" font-weight="bold">MCP 服务</text>
    <rect x="432" y="0" width="104" height="30" rx="15" fill="#eef5ee" stroke="#cfe3d1"/>
    <text x="484" y="20" font-size="13" fill="#5b6b5e" text-anchor="middle">API 工具</text>
  </g>
  <g transform="translate(60,56)">
    <rect x="0" y="0" width="860" height="346" rx="14" fill="#ffffff" stroke="#cfe3d1"/>
    <text x="24" y="34" font-size="16" fill="#2b3a2e" font-weight="bold">＋ 新增 MCP 来源</text>
    <text x="24" y="58" font-size="11.5" fill="#8a978d">填完保存，再点卡片上的「🔍 发现 / 查看工具」连上去列工具</text>
    <line x1="24" y1="72" x2="836" y2="72" stroke="#e6efe7"/>

    <text x="24" y="98" font-size="12" fill="#5b6b5e">名称</text>
    <rect x="24" y="106" width="240" height="28" rx="6" fill="#f7faf7" stroke="#dbe7dc"/>
    <text x="34" y="125" font-size="12" fill="#2b3a2e">法国国家图书馆（Gallica）</text>
    <text x="300" y="98" font-size="12" fill="#5b6b5e">短名（进 ref，只能 ASCII）</text>
    <rect x="300" y="106" width="150" height="28" rx="6" fill="#f7faf7" stroke="#dbe7dc"/>
    <text x="310" y="125" font-size="12" fill="#2b3a2e">bnf</text>
    <text x="480" y="98" font-size="12" fill="#5b6b5e">连接方式</text>
    <rect x="480" y="106" width="104" height="28" rx="6" fill="#dff0e2" stroke="#54aa69"/>
    <text x="532" y="125" font-size="12" fill="#2f7a43" text-anchor="middle">stdio</text>
    <rect x="592" y="106" width="104" height="28" rx="6" fill="#f7faf7" stroke="#dbe7dc"/>
    <text x="644" y="125" font-size="12" fill="#6b7a6e" text-anchor="middle">http</text>

    <text x="24" y="162" font-size="12" fill="#5b6b5e">命令（stdio）</text>
    <rect x="24" y="170" width="436" height="28" rx="6" fill="#f7faf7" stroke="#dbe7dc"/>
    <text x="34" y="189" font-size="11.5" fill="#2b3a2e">D:\LLM\mcp_servers\bnf\env\Scripts\python.exe</text>
    <text x="476" y="162" font-size="12" fill="#5b6b5e">工作目录</text>
    <rect x="476" y="170" width="360" height="28" rx="6" fill="#f7faf7" stroke="#dbe7dc"/>
    <text x="486" y="189" font-size="11.5" fill="#2b3a2e">D:\LLM\mcp_servers\bnf</text>

    <text x="24" y="226" font-size="12" fill="#5b6b5e">参数（每行一个）</text>
    <rect x="24" y="234" width="436" height="28" rx="6" fill="#f7faf7" stroke="#dbe7dc"/>
    <text x="34" y="253" font-size="11.5" fill="#2b3a2e">D:/LLM/mcp_servers/bnf/bnf_server.py</text>
    <text x="476" y="226" font-size="12" fill="#5b6b5e">URL（http 时填，端点 ID 建议打码保存）</text>
    <rect x="476" y="234" width="360" height="28" rx="6" fill="#f7faf7" stroke="#dbe7dc"/>
    <text x="486" y="253" font-size="11.5" fill="#9aa79c">https://mcp.api-inference.modelscope.net/&lt;端点ID&gt;/mcp</text>

    <text x="24" y="292" font-size="12" fill="#5b6b5e">超时（秒）</text>
    <rect x="24" y="300" width="80" height="28" rx="6" fill="#f7faf7" stroke="#dbe7dc"/>
    <text x="64" y="319" font-size="12" fill="#2b3a2e" text-anchor="middle">120</text>
    <text x="120" y="292" font-size="12" fill="#5b6b5e">命令白名单</text>
    <rect x="120" y="300" width="180" height="28" rx="6" fill="#f7faf7" stroke="#dbe7dc"/>
    <text x="130" y="319" font-size="11.5" fill="#2b3a2e">["python"]</text>
    <rect x="320" y="300" width="150" height="28" rx="6" fill="#f7faf7" stroke="#dbe7dc"/>
    <text x="330" y="319" font-size="11.5" fill="#3d6b4a">☑ 我声明全只读</text>
    <rect x="486" y="300" width="350" height="28" rx="6" fill="#eef5ee" stroke="#cfe3d1"/>
    <text x="496" y="319" font-size="11.5" fill="#6b7a6e">能力描述 / 官方介绍文案（AI 预写的依据，至少填一个）</text>
  </g>
</svg>
